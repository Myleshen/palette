# Ported from Ghostty's bundled "Aizen Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Aizen Light"
appearance = "light"

[palette]
bg = "#f0f2f6"
surface = "#e4e6ea"
elevated = "#f8f9fb"
fg = "#40435b"
fg_muted = "#646677"accent = "#135be9"
accent_fg = "#ffffff"
selection_bg = "#bdc2cc"
selection_fg = "#4a4d66"
match_fg = "#8636ec"
border = "#cfd1d9"
separator = "#f8f9fb80"
danger = "#d00c36"
warning = "#c67b00"
success = "#3e9e28"
info = "#1c64f2"
badge_bg = "#f8f9fb"
badge_fg = "#4a4d66"

[states.selected]
bg = "#bdc2cc"
fg = "#4a4d66"
[states.hover]
bg = "#f8f9fb"
[states.disabled]
fg = "#848798"

[window]
material = "popover"

[footer]
hint_color = "#646677"
