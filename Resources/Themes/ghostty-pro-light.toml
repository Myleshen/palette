# Ported from Ghostty's bundled "Pro Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Pro Light"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#191919"
fg_muted = "#6a6a6a"
accent = "#3b75ff"
accent_fg = "#000000"
selection_bg = "#c1ddff"
selection_fg = "#191919"
match_fg = "#ed66e8"
border = "#d1d1d1"
separator = "#ffffff80"
danger = "#e5492b"
warning = "#c6c440"
success = "#50d148"
info = "#3b75ff"
badge_bg = "#ffffff"
badge_fg = "#191919"

[states.selected]
bg = "#c1ddff"
fg = "#191919"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#6a6a6a"

[window]
material = "popover"

[footer]
hint_color = "#6a6a6a"
