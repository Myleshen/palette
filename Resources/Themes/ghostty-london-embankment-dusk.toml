# Ported from Ghostty's bundled "London Embankment Dusk" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · London Embankment Dusk"
appearance = "dark"

[palette]
bg = "#161f2c"
surface = "#101620"
elevated = "#2d3541"
fg = "#e8eef2"
fg_muted = "#9ea6ad"
accent = "#f2c455"
accent_fg = "#000000"
selection_bg = "#2c3a52"
selection_fg = "#e8eef2"
match_fg = "#b09bc0"
border = "#404854"
separator = "#2d354180"
danger = "#c5573f"
warning = "#e2bd5c"
success = "#6a8e85"
info = "#5e87b3"
badge_bg = "#2d3541"
badge_fg = "#e8eef2"

[states.selected]
bg = "#2c3a52"
fg = "#e8eef2"
[states.hover]
bg = "#2d3541"
[states.disabled]
fg = "#9ea6ad"

[footer]
hint_color = "#9ea6ad"
