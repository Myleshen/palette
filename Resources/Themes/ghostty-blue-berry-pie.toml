# Ported from Ghostty's bundled "Blue Berry Pie" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Blue Berry Pie"
appearance = "dark"

[palette]
bg = "#1c0c28"
surface = "#14091d"
elevated = "#33243e"
fg = "#babab9"
fg_muted = "#837d86"
accent = "#90a5bd"
accent_fg = "#000000"
selection_bg = "#606060"
selection_fg = "#ffffff"
match_fg = "#bc94b7"
border = "#3c2f45"
separator = "#33243e80"
danger = "#a7337b"
warning = "#eab9a8"
success = "#5cb1b3"
info = "#90a5bd"
badge_bg = "#33243e"
badge_fg = "#babab9"

[states.selected]
bg = "#606060"
fg = "#ffffff"
[states.hover]
bg = "#33243e"
[states.disabled]
fg = "#837d86"

[footer]
hint_color = "#837d86"
