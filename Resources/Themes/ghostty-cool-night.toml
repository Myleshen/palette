# Ported from Ghostty's bundled "Cool Night" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Cool Night"
appearance = "dark"

[palette]
bg = "#010c18"
surface = "#010911"
elevated = "#1a242f"
fg = "#ecdef4"
fg_muted = "#9a94a7"
accent = "#38ff9d"
accent_fg = "#000000"
selection_bg = "#38ff9c"
selection_fg = "#000000"
match_fg = "#c792ea"
border = "#303644"
separator = "#1a242f80"
danger = "#ff3a3a"
warning = "#fff383"
success = "#52ffd0"
info = "#1376f9"
badge_bg = "#1a242f"
badge_fg = "#ecdef4"

[states.selected]
bg = "#38ff9c"
fg = "#000000"
[states.hover]
bg = "#1a242f"
[states.disabled]
fg = "#9a94a7"

[footer]
hint_color = "#9a94a7"
