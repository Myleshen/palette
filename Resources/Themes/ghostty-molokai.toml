# Ported from Ghostty's bundled "Molokai" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Molokai"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#bbbbbb"
fg_muted = "#808080"
accent = "#00afff"
accent_fg = "#000000"
selection_bg = "#b5d5ff"
selection_fg = "#000000"
match_fg = "#af87ff"
border = "#343434"
separator = "#2a2a2a80"
danger = "#fa2573"
warning = "#dfd460"
success = "#98e123"
info = "#1080d0"
badge_bg = "#2a2a2a"
badge_fg = "#bbbbbb"

[states.selected]
bg = "#b5d5ff"
fg = "#000000"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#808080"

[footer]
hint_color = "#808080"
