# Ported from Ghostty's bundled "Carbonfox" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Carbonfox"
appearance = "dark"

[palette]
bg = "#161616"
surface = "#101010"
elevated = "#2d2d2d"
fg = "#f2f4f8"
fg_muted = "#a5a6a9"
accent = "#8cb6ff"
accent_fg = "#000000"
selection_bg = "#2a2a2a"
selection_fg = "#f2f4f8"
match_fg = "#c8a5ff"
border = "#424243"
separator = "#2d2d2d80"
danger = "#ee5396"
warning = "#08bdba"
success = "#25be6a"
info = "#78a9ff"
badge_bg = "#2d2d2d"
badge_fg = "#f2f4f8"

[states.selected]
bg = "#2a2a2a"
fg = "#f2f4f8"
[states.hover]
bg = "#2d2d2d"
[states.disabled]
fg = "#a5a6a9"

[footer]
hint_color = "#a5a6a9"
