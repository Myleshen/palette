# Ported from Ghostty's bundled "Sunset Drive" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sunset Drive"
appearance = "dark"

[palette]
bg = "#0f0f1a"
surface = "#0b0b13"
elevated = "#272731"
fg = "#ededfe"
fg_muted = "#9f9fae"
accent = "#00a4ff"
accent_fg = "#000000"
selection_bg = "#202036"
selection_fg = "#ededff"
match_fg = "#ff93ff"
border = "#3b3b48"
separator = "#27273180"
danger = "#ff0063"
warning = "#ffe900"
success = "#00f992"
info = "#00a4ff"
badge_bg = "#272731"
badge_fg = "#ededfe"

[states.selected]
bg = "#202036"
fg = "#ededff"
[states.hover]
bg = "#272731"
[states.disabled]
fg = "#9f9fae"

[footer]
hint_color = "#9f9fae"
