# Ported from Ghostty's bundled "White Sands" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · White Sands"
appearance = "light"

[palette]
bg = "#f4efe4"
surface = "#e8e3d9"
elevated = "#faf8f3"
fg = "#283b54"
fg_muted = "#6f7a86"
accent = "#315d86"
accent_fg = "#ffffff"
selection_bg = "#faf8f3"
selection_fg = "#172c45"
match_fg = "#73568f"
border = "#cbcbc7"
separator = "#faf8f380"
danger = "#9b493f"
warning = "#7a641f"
success = "#46734f"
info = "#315d86"
badge_bg = "#faf8f3"
badge_fg = "#283b54"

[states.selected]
bg = "#faf8f3"
fg = "#172c45"
[states.hover]
bg = "#faf8f3"
[states.disabled]
fg = "#6f7a86"

[window]
material = "popover"

[footer]
hint_color = "#6f7a86"
