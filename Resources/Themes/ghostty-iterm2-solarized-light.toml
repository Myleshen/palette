# Ported from Ghostty's bundled "iTerm2 Solarized Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg was moved toward the readable end of the background to reach 4.5:1.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
name = "Ghostty · iTerm2 Solarized Light"
appearance = "light"

[palette]
bg = "#fdf6e3"
surface = "#f0ead8"
elevated = "#fefbf2"
fg = "#44575f"
fg_muted = "#667475"
accent = "#006eaf"
accent_fg = "#eaeaea"
selection_bg = "#fefbf2"
selection_fg = "#586e75"
match_fg = "#d33682"
border = "#dddbce"
separator = "#fefbf280"
danger = "#dc322f"
warning = "#b48800"
success = "#859800"
info = "#268bd2"
badge_bg = "#fefbf2"
badge_fg = "#5d7179"

[states.selected]
bg = "#fefbf2"
fg = "#586e75"
[states.hover]
bg = "#fefbf2"
[states.disabled]
fg = "#839192"

[window]
material = "popover"

[footer]
hint_color = "#839192"
