# Ported from Ghostty's bundled "Vaughn" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Vaughn"
appearance = "dark"

[palette]
bg = "#25234f"
surface = "#1b1939"
elevated = "#3b3961"
fg = "#dcdccc"
fg_muted = "#9c9ba0"
accent = "#ff837c"
accent_fg = "#000000"
selection_bg = "#b5d5ff"
selection_fg = "#000000"
match_fg = "#ec93d3"
border = "#4a4868"
separator = "#3b396180"
danger = "#8a6968"
warning = "#dfaf8f"
success = "#60b48a"
info = "#575aff"
badge_bg = "#3b3961"
badge_fg = "#dcdccc"

[states.selected]
bg = "#b5d5ff"
fg = "#000000"
[states.hover]
bg = "#3b3961"
[states.disabled]
fg = "#9c9ba0"

[footer]
hint_color = "#9c9ba0"
