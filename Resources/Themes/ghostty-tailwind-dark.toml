# Ported from Ghostty's bundled "Tailwind Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Tailwind Dark"
appearance = "dark"

[palette]
bg = "#262626"
surface = "#1b1b1b"
elevated = "#3c3c3c"
fg = "#ebebeb"
fg_muted = "#a2a2a2"
accent = "#7dd3fc"
accent_fg = "#000000"
selection_bg = "#475569"
selection_fg = "#e5e5e5"
match_fg = "#f0abfc"
border = "#4c4c4c"
separator = "#3c3c3c80"
danger = "#f87171"
warning = "#facc15"
success = "#4ade80"
info = "#38bdf8"
badge_bg = "#3c3c3c"
badge_fg = "#e5e5e5"

[states.selected]
bg = "#475569"
fg = "#e5e5e5"
[states.hover]
bg = "#3c3c3c"
[states.disabled]
fg = "#a2a2a2"

[footer]
hint_color = "#a2a2a2"
