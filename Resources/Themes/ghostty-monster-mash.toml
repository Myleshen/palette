# Ported from Ghostty's bundled "Monster Mash" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Monster Mash"
appearance = "dark"

[palette]
bg = "#173b0d"
surface = "#112a09"
elevated = "#2e4f25"
fg = "#f0f5d8"
fg_muted = "#a4b491"
accent = "#95cceb"
accent_fg = "#000000"
selection_bg = "#c1cfb8"
selection_fg = "#545647"
match_fg = "#c59eeb"
border = "#426036"
separator = "#2e4f2580"
danger = "#f09579"
warning = "#e7cf52"
success = "#9ee566"
info = "#86c5e8"
badge_bg = "#2e4f25"
badge_fg = "#f0f5d8"

[states.selected]
bg = "#c1cfb8"
fg = "#545647"
[states.hover]
bg = "#2e4f25"
[states.disabled]
fg = "#a4b491"

[footer]
hint_color = "#a4b491"
