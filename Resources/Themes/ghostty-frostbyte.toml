# Ported from Ghostty's bundled "Frostbyte" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Frostbyte"
appearance = "light"

[palette]
bg = "#eef5fc"
surface = "#e2e9ef"
elevated = "#f7fbfe"
fg = "#283645"
fg_muted = "#66717d"
accent = "#1a66be"
accent_fg = "#ffffff"
selection_bg = "#d2e4f4"
selection_fg = "#616569"
match_fg = "#5552cc"
border = "#c6cfd7"
separator = "#f7fbfe80"
danger = "#c2384f"
warning = "#876010"
success = "#2e7a56"
info = "#1a66be"
badge_bg = "#f7fbfe"
badge_fg = "#283645"

[states.selected]
bg = "#d2e4f4"
fg = "#616569"
[states.hover]
bg = "#f7fbfe"
[states.disabled]
fg = "#6d7985"

[window]
material = "popover"

[footer]
hint_color = "#6d7985"
