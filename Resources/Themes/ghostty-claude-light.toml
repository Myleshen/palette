# Ported from Ghostty's bundled "Claude Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Claude Light"
appearance = "light"

[palette]
bg = "#faf9f5"
surface = "#edede9"
elevated = "#fdfcfb"
fg = "#141413"
fg_muted = "#646462"
accent = "#184e95"
accent_fg = "#ffffff"
selection_bg = "#fdfcfb"
selection_fg = "#141413"
match_fg = "#882b4d"
border = "#cccbc8"
separator = "#fdfcfb80"
danger = "#a84b3a"
warning = "#8a6220"
success = "#2e7c4c"
info = "#184e95"
badge_bg = "#fdfcfb"
badge_fg = "#141413"

[states.selected]
bg = "#fdfcfb"
fg = "#141413"
[states.hover]
bg = "#fdfcfb"
[states.disabled]
fg = "#646462"

[window]
material = "popover"

[footer]
hint_color = "#646462"
