# Ported from Ghostty's bundled "Prism" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Prism"
appearance = "dark"

[palette]
bg = "#0b1326"
surface = "#080e1b"
elevated = "#232b3c"
fg = "#d7e3f4"
fg_muted = "#909aac"
accent = "#77caff"
accent_fg = "#000000"
selection_bg = "#1e2c49"
selection_fg = "#9398a3"
match_fg = "#b8c1ff"
border = "#343d4f"
separator = "#232b3c80"
danger = "#ff7192"
warning = "#fad77c"
success = "#71e0b0"
info = "#47b3ff"
badge_bg = "#232b3c"
badge_fg = "#d7e3f4"

[states.selected]
bg = "#1e2c49"
fg = "#9398a3"
[states.hover]
bg = "#232b3c"
[states.disabled]
fg = "#909aac"

[footer]
hint_color = "#909aac"
