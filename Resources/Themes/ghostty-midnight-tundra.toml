# Ported from Ghostty's bundled "Midnight Tundra" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Midnight Tundra"
appearance = "dark"

[palette]
bg = "#0e141b"
surface = "#0a0e13"
elevated = "#262c32"
fg = "#c9d4de"
fg_muted = "#88919a"
accent = "#8abde4"
accent_fg = "#000000"
selection_bg = "#24384a"
selection_fg = "#e6eef5"
match_fg = "#bda6dd"
border = "#333a42"
separator = "#262c3280"
danger = "#d9707c"
warning = "#d8b174"
success = "#7fb88a"
info = "#6da3cf"
badge_bg = "#262c32"
badge_fg = "#c9d4de"

[states.selected]
bg = "#24384a"
fg = "#e6eef5"
[states.hover]
bg = "#262c32"
[states.disabled]
fg = "#88919a"

[footer]
hint_color = "#88919a"
