# Ported from Ghostty's bundled "Cassette Tape" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Cassette Tape"
appearance = "light"

[palette]
bg = "#fff7ed"
surface = "#f2ebe1"
elevated = "#fffbf7"
fg = "#2b1b12"
fg_muted = "#75685f"
accent = "#63240e"
accent_fg = "#ffffff"
selection_bg = "#2b1b12"
selection_fg = "#fff7ed"
match_fg = "#0c5e58"
border = "#d5cbc1"
separator = "#fffbf780"
danger = "#b91c1c"
warning = "#be123c"
success = "#3f6212"
info = "#7c2d12"
badge_bg = "#fffbf7"
badge_fg = "#2b1b12"

[states.selected]
bg = "#2b1b12"
fg = "#fff7ed"
[states.hover]
bg = "#fffbf7"
[states.disabled]
fg = "#75685f"

[window]
material = "popover"

[footer]
hint_color = "#75685f"
