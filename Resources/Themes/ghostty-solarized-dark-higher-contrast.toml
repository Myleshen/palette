# Ported from Ghostty's bundled "Solarized Dark Higher Contrast" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Solarized Dark Higher Contrast"
appearance = "dark"

[palette]
bg = "#001e27"
surface = "#00161c"
elevated = "#1a343d"
fg = "#9cc2c3"
fg_muted = "#65898c"
accent = "#34a1dc"
accent_fg = "#000000"
selection_bg = "#003748"
selection_fg = "#8fa1a0"
match_fg = "#e24d8e"
border = "#1f3f46"
separator = "#1a343d80"
danger = "#d11c24"
warning = "#a57706"
success = "#6cbe6c"
info = "#2176c7"
badge_bg = "#1a343d"
badge_fg = "#9cc2c3"

[states.selected]
bg = "#003748"
fg = "#8fa1a0"
[states.hover]
bg = "#1a343d"
[states.disabled]
fg = "#65898c"

[footer]
hint_color = "#65898c"
