# Ported from Ghostty's bundled "Cobalt2" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Cobalt2"
appearance = "dark"

[palette]
bg = "#132738"
surface = "#0e1c28"
elevated = "#2b3d4c"
fg = "#ffffff"
fg_muted = "#acb3b9"
accent = "#f0cc09"
accent_fg = "#000000"
selection_bg = "#18354f"
selection_fg = "#b5b5b5"
match_fg = "#ff55ff"
border = "#425260"
separator = "#2b3d4c80"
danger = "#ff0000"
warning = "#ffe50a"
success = "#38de21"
info = "#206adc"
badge_bg = "#2b3d4c"
badge_fg = "#ffffff"

[states.selected]
bg = "#18354f"
fg = "#b5b5b5"
[states.hover]
bg = "#2b3d4c"
[states.disabled]
fg = "#acb3b9"

[footer]
hint_color = "#acb3b9"
