# Ported from Ghostty's bundled "Barbenheimer Nuclear Sunrise" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Barbenheimer Nuclear Sunrise"
appearance = "dark"

[palette]
bg = "#0f0f0a"
surface = "#0b0b07"
elevated = "#272723"
fg = "#ffffff"
fg_muted = "#ababa9"
accent = "#80a0c0"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#0f0f0a"
match_fg = "#c080c0"
border = "#3f3f3b"
separator = "#27272380"
danger = "#ff69b4"
warning = "#c0c080"
success = "#80c0a0"
info = "#80a0c0"
badge_bg = "#272723"
badge_fg = "#ffffff"

[states.selected]
bg = "#ffffff"
fg = "#0f0f0a"
[states.hover]
bg = "#272723"
[states.disabled]
fg = "#ababa9"

[footer]
hint_color = "#ababa9"
