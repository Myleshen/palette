# Ported from Ghostty's bundled "London Bonfire Night" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · London Bonfire Night"
appearance = "dark"

[palette]
bg = "#0e0c0e"
surface = "#0a090a"
elevated = "#262426"
fg = "#e8e0c8"
fg_muted = "#9c9687"
accent = "#7a96d0"
accent_fg = "#000000"
selection_bg = "#2a2228"
selection_fg = "#e8e0c8"
match_fg = "#ed85bc"
border = "#3a3633"
separator = "#26242680"
danger = "#d65a3a"
warning = "#e8b048"
success = "#6a8a4a"
info = "#5a7ab8"
badge_bg = "#262426"
badge_fg = "#e8e0c8"

[states.selected]
bg = "#2a2228"
fg = "#e8e0c8"
[states.hover]
bg = "#262426"
[states.disabled]
fg = "#9c9687"

[footer]
hint_color = "#9c9687"
