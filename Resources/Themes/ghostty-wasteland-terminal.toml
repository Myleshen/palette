# Ported from Ghostty's bundled "Wasteland Terminal" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Wasteland Terminal"
appearance = "dark"

[palette]
bg = "#050b05"
surface = "#040804"
elevated = "#1e231e"
fg = "#18ff62"
fg_muted = "#11aa41"
accent = "#56bd84"
accent_fg = "#000000"
selection_bg = "#1a4d27"
selection_fg = "#e0ffe6"
match_fg = "#84d69a"
border = "#093c18"
separator = "#1e231e80"
danger = "#26b34f"
warning = "#a1d64b"
success = "#18ff62"
info = "#3e9b67"
badge_bg = "#1e231e"
badge_fg = "#18ff62"

[states.selected]
bg = "#1a4d27"
fg = "#e0ffe6"
[states.hover]
bg = "#1e231e"
[states.disabled]
fg = "#11aa41"

[footer]
hint_color = "#11aa41"
