# Ported from Ghostty's bundled "Poison Apple" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Poison Apple"
appearance = "dark"

[palette]
bg = "#560b13"
surface = "#3e080e"
elevated = "#67232b"
fg = "#f7e8d8"
fg_muted = "#bf9b93"
accent = "#95c1dd"
accent_fg = "#000000"
selection_bg = "#c4b2b4"
selection_fg = "#474542"
match_fg = "#c999c1"
border = "#76373a"
separator = "#67232b80"
danger = "#ef8178"
warning = "#e5c45b"
success = "#9ed25f"
info = "#86b9d8"
badge_bg = "#67232b"
badge_fg = "#f7e8d8"

[states.selected]
bg = "#c4b2b4"
fg = "#474542"
[states.hover]
bg = "#67232b"
[states.disabled]
fg = "#bf9b93"

[footer]
hint_color = "#bf9b93"
