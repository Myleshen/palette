# Ported from Ghostty's bundled "Builtin Pastel Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Builtin Pastel Dark"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#bbbbbb"
fg_muted = "#7a7a7a"
accent = "#b5dcff"
accent_fg = "#000000"
selection_bg = "#363983"
selection_fg = "#f2f2f2"
match_fg = "#ff9cfe"
border = "#252525"
separator = "#1a1a1a80"
danger = "#ff6c60"
warning = "#ffffb6"
success = "#a8ff60"
info = "#96cbfe"
badge_bg = "#1a1a1a"
badge_fg = "#bbbbbb"

[states.selected]
bg = "#363983"
fg = "#f2f2f2"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#7a7a7a"

[footer]
hint_color = "#7a7a7a"
