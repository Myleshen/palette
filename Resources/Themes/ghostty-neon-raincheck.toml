# Ported from Ghostty's bundled "Neon Raincheck" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Neon Raincheck"
appearance = "dark"

[palette]
bg = "#101522"
surface = "#0c0f18"
elevated = "#282c38"
fg = "#dce6f5"
fg_muted = "#959dab"
accent = "#9cb8ff"
accent_fg = "#000000"
selection_bg = "#293452"
selection_fg = "#9da1a8"
match_fg = "#d2a9ff"
border = "#393f4c"
separator = "#282c3880"
danger = "#e36b8d"
warning = "#e2c179"
success = "#70c6ad"
info = "#789de8"
badge_bg = "#282c38"
badge_fg = "#dce6f5"

[states.selected]
bg = "#293452"
fg = "#9da1a8"
[states.hover]
bg = "#282c38"
[states.disabled]
fg = "#959dab"

[footer]
hint_color = "#959dab"
