# Ported from Ghostty's bundled "Wild Charm Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Wild Charm Light"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#005faf"
accent_fg = "#ffffff"
selection_bg = "#00afff"
selection_fg = "#333333"
match_fg = "#870087"
border = "#cccccc"
separator = "#ffffff80"
danger = "#af0000"
warning = "#af5f00"
success = "#008700"
info = "#005faf"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#00afff"
fg = "#333333"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
