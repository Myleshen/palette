# Ported from Ghostty's bundled "Crypt Keeper" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Crypt Keeper"
appearance = "dark"

[palette]
bg = "#353b24"
surface = "#262a1a"
elevated = "#494f3a"
fg = "#f2efd5"
fg_muted = "#b0b097"
accent = "#a9ccd9"
accent_fg = "#000000"
selection_bg = "#535a3d"
selection_fg = "#fff9e8"
match_fg = "#d6b8c7"
border = "#5b5f47"
separator = "#494f3a80"
danger = "#e89a78"
warning = "#dec46c"
success = "#a6cc8c"
info = "#91bdd0"
badge_bg = "#494f3a"
badge_fg = "#f2efd5"

[states.selected]
bg = "#535a3d"
fg = "#fff9e8"
[states.hover]
bg = "#494f3a"
[states.disabled]
fg = "#b0b097"

[footer]
hint_color = "#b0b097"
