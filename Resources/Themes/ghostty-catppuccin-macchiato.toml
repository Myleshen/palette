# Ported from Ghostty's bundled "Catppuccin Macchiato" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Catppuccin Macchiato"
appearance = "dark"

[palette]
bg = "#24273a"
surface = "#1a1c2a"
elevated = "#3a3d4e"
fg = "#cad3f5"
fg_muted = "#9097b4"
accent = "#adc5f7"
accent_fg = "#000000"
selection_bg = "#f4dbd6"
selection_fg = "#24273a"
match_fg = "#f5bde6"
border = "#45495f"
separator = "#3a3d4e80"
danger = "#ed8796"
warning = "#eed49f"
success = "#a6da95"
info = "#8aadf4"
badge_bg = "#3a3d4e"
badge_fg = "#cad3f5"

[states.selected]
bg = "#f4dbd6"
fg = "#24273a"
[states.hover]
bg = "#3a3d4e"
[states.disabled]
fg = "#9097b4"

[footer]
hint_color = "#9097b4"
