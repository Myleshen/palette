# Ported from Ghostty's bundled "Gruvbox Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Gruvbox Light"
appearance = "light"

[palette]
bg = "#fbf1c7"
surface = "#eee5bd"
elevated = "#fdf9e6"
fg = "#3c3836"
fg_muted = "#6c6658"
accent = "#076678"
accent_fg = "#ffffff"
selection_bg = "#3c3836"
selection_fg = "#fbf1c7"
match_fg = "#8f3f71"
border = "#d5ccaa"
separator = "#fdf9e680"
danger = "#cc241d"
warning = "#b98000"
success = "#918f08"
info = "#458588"
badge_bg = "#fdf9e6"
badge_fg = "#3c3836"

[states.selected]
bg = "#3c3836"
fg = "#fbf1c7"
[states.hover]
bg = "#fdf9e6"
[states.disabled]
fg = "#7f7969"

[window]
material = "popover"

[footer]
hint_color = "#6c6657"
