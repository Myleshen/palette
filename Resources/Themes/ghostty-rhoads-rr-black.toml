# Ported from Ghostty's bundled "Rhoads RR Black" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Rhoads RR Black"
appearance = "dark"

[palette]
bg = "#0a0907"
surface = "#070605"
elevated = "#232220"
fg = "#f4ecd7"
fg_muted = "#a29d8e"
accent = "#d4af37"
accent_fg = "#000000"
selection_bg = "#5a4512"
selection_fg = "#e6d7a5"
match_fg = "#c49af2"
border = "#393631"
separator = "#23222080"
danger = "#c81e1e"
warning = "#d4af37"
success = "#2e7d32"
info = "#3b82f6"
badge_bg = "#232220"
badge_fg = "#f4ecd7"

[states.selected]
bg = "#5a4512"
fg = "#e6d7a5"
[states.hover]
bg = "#232220"
[states.disabled]
fg = "#a29d8e"

[footer]
hint_color = "#a29d8e"
