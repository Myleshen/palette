# Ported from Ghostty's bundled "Rainbows and Unicorns VHS" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rainbows and Unicorns VHS"
appearance = "dark"

[palette]
bg = "#101b45"
surface = "#0c1332"
elevated = "#283258"
fg = "#f2ebdd"
fg_muted = "#a3a2a8"
accent = "#abcdff"
accent_fg = "#000000"
selection_bg = "#f2ebdd"
selection_fg = "#101b45"
match_fg = "#e5c2ff"
border = "#3d4563"
separator = "#28325880"
danger = "#ff6b6b"
warning = "#f7d774"
success = "#8fe3a0"
info = "#7fb2ff"
badge_bg = "#283258"
badge_fg = "#f2ebdd"

[states.selected]
bg = "#f2ebdd"
fg = "#101b45"
[states.hover]
bg = "#283258"
[states.disabled]
fg = "#a3a2a8"

[footer]
hint_color = "#a3a2a8"
