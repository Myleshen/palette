# Ported from Ghostty's bundled "Matcha Zen" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Matcha Zen"
appearance = "light"

[palette]
bg = "#f5f7ea"
surface = "#e9ebde"
elevated = "#fbfbf6"
fg = "#354029"
fg_muted = "#6c7361"
accent = "#267571"
accent_fg = "#ffffff"
selection_bg = "#dde7cc"
selection_fg = "#65665e"
match_fg = "#7e5ba6"
border = "#cfd2c3"
separator = "#fbfbf680"
danger = "#c2452a"
warning = "#927000"
success = "#4e8c2e"
info = "#2e7c78"
badge_bg = "#fbfbf6"
badge_fg = "#354029"

[states.selected]
bg = "#dde7cc"
fg = "#65665e"
[states.hover]
bg = "#fbfbf6"
[states.disabled]
fg = "#78806d"

[window]
material = "popover"

[footer]
hint_color = "#78806d"
