# Ported from Ghostty's bundled "Rainbows and Unicorns Workbench" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rainbows and Unicorns Workbench"
appearance = "dark"

[palette]
bg = "#00408f"
surface = "#002e67"
elevated = "#1a539a"
fg = "#ffffff"
fg_muted = "#a6bcd8"
accent = "#c2e4ff"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#00408f"
match_fg = "#f7cff8"
border = "#3366a5"
separator = "#1a539a80"
danger = "#ffa79b"
warning = "#ffd978"
success = "#a6ee8e"
info = "#9ad2ff"
badge_bg = "#1a539a"
badge_fg = "#ffffff"

[states.selected]
bg = "#ffffff"
fg = "#00408f"
[states.hover]
bg = "#1a539a"
[states.disabled]
fg = "#a6bcd8"

[footer]
hint_color = "#a6bcd8"
