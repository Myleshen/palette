# Ported from Ghostty's bundled "Springfield Resident" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Springfield Resident"
appearance = "light"

[palette]
bg = "#ffdd32"
surface = "#f2d230"
elevated = "#fff0a3"
fg = "#084f8f"
fg_muted = "#5e816e"
accent = "#075aa8"
accent_fg = "#ffffff"
selection_bg = "#ef4fa8"
selection_fg = "#211d57"
match_fg = "#a92d87"
border = "#cec145"
separator = "#fff0a380"
danger = "#b83245"
warning = "#8a5a00"
success = "#237a3b"
info = "#075aa8"
badge_bg = "#fff0a3"
badge_fg = "#084f8f"

[states.selected]
bg = "#ef4fa8"
fg = "#211d57"
[states.hover]
bg = "#fff0a3"
[states.disabled]
fg = "#5e816e"

[window]
material = "popover"

[footer]
hint_color = "#5e816e"
