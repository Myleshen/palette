# Ported from Ghostty's bundled "Cursed VHS" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Cursed VHS"
appearance = "dark"

[palette]
bg = "#1c082c"
surface = "#140620"
elevated = "#332141"
fg = "#f4edff"
fg_muted = "#a89db5"
accent = "#75c1f4"
accent_fg = "#000000"
selection_bg = "#b9aec5"
selection_fg = "#454347"
match_fg = "#d77ef2"
border = "#473656"
separator = "#33214180"
danger = "#ff6d98"
warning = "#e5c85f"
success = "#8ed69e"
info = "#62b9f2"
badge_bg = "#332141"
badge_fg = "#f4edff"

[states.selected]
bg = "#b9aec5"
fg = "#454347"
[states.hover]
bg = "#332141"
[states.disabled]
fg = "#a89db5"

[footer]
hint_color = "#a89db5"
