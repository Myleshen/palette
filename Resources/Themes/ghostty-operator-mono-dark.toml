# Ported from Ghostty's bundled "Operator Mono Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Operator Mono Dark"
appearance = "dark"

[palette]
bg = "#191919"
surface = "#121212"
elevated = "#303030"
fg = "#c3cac2"
fg_muted = "#888c87"
accent = "#fcdc08"
accent_fg = "#000000"
selection_bg = "#19273b"
selection_fg = "#dde5dc"
match_fg = "#ff2c7a"
border = "#3b3c3b"
separator = "#30303080"
danger = "#ca372d"
warning = "#d4d697"
success = "#4d7b3a"
info = "#4387cf"
badge_bg = "#303030"
badge_fg = "#c3cac2"

[states.selected]
bg = "#19273b"
fg = "#dde5dc"
[states.hover]
bg = "#303030"
[states.disabled]
fg = "#888c87"

[footer]
hint_color = "#888c87"
