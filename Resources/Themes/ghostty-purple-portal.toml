# Ported from Ghostty's bundled "Purple Portal" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Purple Portal"
appearance = "dark"

[palette]
bg = "#160528"
surface = "#10041d"
elevated = "#2d1e3e"
fg = "#faf5ff"
fg_muted = "#aaa1b4"
accent = "#fbd644"
accent_fg = "#000000"
selection_bg = "#faf5ff"
selection_fg = "#160528"
match_fg = "#60caf9"
border = "#443553"
separator = "#2d1e3e80"
danger = "#fb7185"
warning = "#f472b6"
success = "#34d399"
info = "#facc15"
badge_bg = "#2d1e3e"
badge_fg = "#faf5ff"

[states.selected]
bg = "#faf5ff"
fg = "#160528"
[states.hover]
bg = "#2d1e3e"
[states.disabled]
fg = "#aaa1b4"

[footer]
hint_color = "#aaa1b4"
