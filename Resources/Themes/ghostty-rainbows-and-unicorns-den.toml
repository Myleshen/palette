# Ported from Ghostty's bundled "Rainbows and Unicorns Den" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rainbows and Unicorns Den"
appearance = "dark"

[palette]
bg = "#1e150d"
surface = "#160f09"
elevated = "#342c25"
fg = "#ebd9b8"
fg_muted = "#a3947c"
accent = "#95bdd2"
accent_fg = "#000000"
selection_bg = "#e0a030"
selection_fg = "#1e150d"
match_fg = "#d29cb8"
border = "#473c2f"
separator = "#342c2580"
danger = "#d9583b"
warning = "#e0a030"
success = "#9db85c"
info = "#6f9fb8"
badge_bg = "#342c25"
badge_fg = "#ebd9b8"

[states.selected]
bg = "#e0a030"
fg = "#1e150d"
[states.hover]
bg = "#342c25"
[states.disabled]
fg = "#a3947c"

[footer]
hint_color = "#a3947c"
