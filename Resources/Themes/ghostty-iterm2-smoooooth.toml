# Ported from Ghostty's bundled "iTerm2 Smoooooth" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · iTerm2 Smoooooth"
appearance = "dark"

[palette]
bg = "#15191f"
surface = "#0f1216"
elevated = "#2c3035"
fg = "#dcdcdc"
fg_muted = "#96989a"
accent = "#a7abf2"
accent_fg = "#000000"
selection_bg = "#b3d7ff"
selection_fg = "#000000"
match_fg = "#e17ee1"
border = "#3d4045"
separator = "#2c303580"
danger = "#b43c2a"
warning = "#c7c400"
success = "#00c200"
info = "#3558dc"
badge_bg = "#2c3035"
badge_fg = "#dcdcdc"

[states.selected]
bg = "#b3d7ff"
fg = "#000000"
[states.hover]
bg = "#2c3035"
[states.disabled]
fg = "#96989a"

[footer]
hint_color = "#96989a"
