# Ported from Ghostty's bundled "Lit Cell Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lit Cell Light"
appearance = "light"

[palette]
bg = "#f1f4ef"
surface = "#e5e8e3"
elevated = "#f9faf8"
fg = "#1b2620"
fg_muted = "#666e68"
accent = "#225b9d"
accent_fg = "#ffffff"
selection_bg = "#cbe6d6"
selection_fg = "#0f1311"
match_fg = "#7e3e98"
border = "#c6cbc6"
separator = "#f9faf880"
danger = "#aa2826"
warning = "#834d00"
success = "#09663f"
info = "#225b9d"
badge_bg = "#f9faf8"
badge_fg = "#1b2620"

[states.selected]
bg = "#cbe6d6"
fg = "#0f1311"
[states.hover]
bg = "#f9faf8"
[states.disabled]
fg = "#666e68"

[window]
material = "popover"

[footer]
hint_color = "#666e68"
