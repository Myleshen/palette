# Ported from Ghostty's bundled "Daybreak" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Daybreak"
appearance = "light"

[palette]
bg = "#f3efe8"
surface = "#e7e3dc"
elevated = "#faf8f5"
fg = "#44413b"
fg_muted = "#817e78"
accent = "#186875"
accent_fg = "#ffffff"
selection_bg = "#e2daca"
selection_fg = "#5d5b57"
match_fg = "#754193"
border = "#d0ccc5"
separator = "#faf8f580"
danger = "#af2817"
warning = "#795900"
success = "#3c6a12"
info = "#186875"
badge_bg = "#faf8f5"
badge_fg = "#44413b"

[states.selected]
bg = "#e2daca"
fg = "#5d5b57"
[states.hover]
bg = "#faf8f5"
[states.disabled]
fg = "#817e78"

[window]
material = "popover"

[footer]
hint_color = "#817e78"
