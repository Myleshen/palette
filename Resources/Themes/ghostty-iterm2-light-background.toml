# Ported from Ghostty's bundled "iTerm2 Light Background" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · iTerm2 Light Background"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#0225c7"
accent_fg = "#ffffff"
selection_bg = "#c1deff"
selection_fg = "#000000"
match_fg = "#ca30c7"
border = "#cccccc"
separator = "#ffffff80"
danger = "#c91b00"
warning = "#c7c400"
success = "#00c200"
info = "#0225c7"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#c1deff"
fg = "#000000"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
