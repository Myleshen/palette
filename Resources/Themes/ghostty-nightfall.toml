# Ported from Ghostty's bundled "Nightfall" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Nightfall"
appearance = "dark"

[palette]
bg = "#1a140e"
surface = "#130e0a"
elevated = "#312c26"
fg = "#f6e8d0"
fg_muted = "#a99e8c"
accent = "#79b5e8"
accent_fg = "#000000"
selection_bg = "#3b2a1a"
selection_fg = "#f6e8d0"
match_fg = "#eba1d9"
border = "#463e35"
separator = "#312c2680"
danger = "#e87555"
warning = "#e8ad3f"
success = "#83b96f"
info = "#5f9ed8"
badge_bg = "#312c26"
badge_fg = "#f6e8d0"

[states.selected]
bg = "#3b2a1a"
fg = "#f6e8d0"
[states.hover]
bg = "#312c26"
[states.disabled]
fg = "#a99e8c"

[footer]
hint_color = "#a99e8c"
