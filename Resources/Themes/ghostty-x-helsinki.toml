# Ported from Ghostty's bundled "X Helsinki" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · X Helsinki"
appearance = "light"

[palette]
bg = "#f8fafe"
surface = "#ecedf1"
elevated = "#fcfdff"
fg = "#544d40"
fg_muted = "#8d8a82"
accent = "#b23b00"
accent_fg = "#ffffff"
selection_bg = "#544d40"
selection_fg = "#f8fafe"
match_fg = "#218c00"
border = "#d7d7d8"
separator = "#fcfdff80"
danger = "#1faa9e"
warning = "#2e70ad"
success = "#733d9a"
info = "#b55a0f"
badge_bg = "#fcfdff"
badge_fg = "#544d40"

[states.selected]
bg = "#544d40"
fg = "#f8fafe"
[states.hover]
bg = "#fcfdff"
[states.disabled]
fg = "#8d8a82"

[window]
material = "popover"

[footer]
hint_color = "#8d8a82"
