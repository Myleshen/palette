# Ported from Omarchy's bundled "Vantablack" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/vantablack/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Vantablack"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#8d8d8d"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#000000"
match_fg = "#9b9b9b"
border = "#333333"
separator = "#1a1a1a80"
danger = "#a4a4a4"
warning = "#cecece"
success = "#b6b6b6"
info = "#8d8d8d"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#ffffff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
