# Ported from Ghostty's bundled "Pnevma" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Pnevma"
appearance = "dark"

[palette]
bg = "#1c1c1c"
surface = "#141414"
elevated = "#333333"
fg = "#d0d0d0"
fg_muted = "#919191"
accent = "#a1bdce"
accent_fg = "#000000"
selection_bg = "#4d4d4d"
selection_fg = "#ffffff"
match_fg = "#d7beda"
border = "#404040"
separator = "#33333380"
danger = "#a36666"
warning = "#d7af87"
success = "#90a57d"
info = "#7fa5bd"
badge_bg = "#333333"
badge_fg = "#d0d0d0"

[states.selected]
bg = "#4d4d4d"
fg = "#ffffff"
[states.hover]
bg = "#333333"
[states.disabled]
fg = "#919191"

[footer]
hint_color = "#919191"
