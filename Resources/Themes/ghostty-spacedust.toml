# Ported from Ghostty's bundled "Spacedust" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Spacedust"
appearance = "dark"

[palette]
bg = "#0a1e24"
surface = "#07161a"
elevated = "#23343a"
fg = "#ecf0c1"
fg_muted = "#9da68a"
accent = "#67a0ce"
accent_fg = "#000000"
selection_bg = "#0a385c"
selection_fg = "#ffffff"
match_fg = "#ff8a3a"
border = "#374843"
separator = "#23343a80"
danger = "#e35b00"
warning = "#e3cd7b"
success = "#5cab96"
info = "#0f548b"
badge_bg = "#23343a"
badge_fg = "#ecf0c1"

[states.selected]
bg = "#0a385c"
fg = "#ffffff"
[states.hover]
bg = "#23343a"
[states.disabled]
fg = "#9da68a"

[footer]
hint_color = "#9da68a"
