# Ported from Ghostty's bundled "Batman" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg was moved toward the readable end of the background to reach 4.5:1.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
# Contrast note: badge_fg was corrected to reach 4.5:1 against the badge background.
name = "Ghostty · Batman"
appearance = "dark"

[palette]
bg = "#1b1d1e"
surface = "#131516"
elevated = "#323434"
fg = "#868686"
fg_muted = "#686869"
accent = "#fcef0c"
accent_fg = "#000000"
selection_bg = "#4d504c"
selection_fg = "#f0e04a"
match_fg = "#9a9a9d"
border = "#303233"
separator = "#32343480"
danger = "#e6dc44"
warning = "#f4fd22"
success = "#c8be46"
info = "#737174"
badge_bg = "#323434"
badge_fg = "#9e9e9e"

[states.selected]
bg = "#4d504c"
fg = "#f0e04a"
[states.hover]
bg = "#323434"
[states.disabled]
fg = "#686869"

[footer]
hint_color = "#686869"
