# Ported from Ghostty's bundled "Modus Vivendi Tinted" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Modus Vivendi Tinted"
appearance = "dark"

[palette]
bg = "#0d0e1c"
surface = "#090a14"
elevated = "#252633"
fg = "#ffffff"
fg_muted = "#aaabb0"
accent = "#79a8ff"
accent_fg = "#000000"
selection_bg = "#555a66"
selection_fg = "#ffffff"
match_fg = "#feacd0"
border = "#3d3e49"
separator = "#25263380"
danger = "#ff5f59"
warning = "#d0bc00"
success = "#44bc44"
info = "#2fafff"
badge_bg = "#252633"
badge_fg = "#ffffff"

[states.selected]
bg = "#555a66"
fg = "#ffffff"
[states.hover]
bg = "#252633"
[states.disabled]
fg = "#aaabb0"

[footer]
hint_color = "#aaabb0"
