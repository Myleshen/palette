# Ported from Ghostty's bundled "Espresso" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Espresso"
appearance = "dark"

[palette]
bg = "#323232"
surface = "#242424"
elevated = "#464646"
fg = "#ffffff"
fg_muted = "#b7b7b7"
accent = "#8bb9db"
accent_fg = "#000000"
selection_bg = "#5b5b5b"
selection_fg = "#ffffff"
match_fg = "#efb5f7"
border = "#5b5b5b"
separator = "#46464680"
danger = "#d25252"
warning = "#ffc66d"
success = "#a5c261"
info = "#6c99bb"
badge_bg = "#464646"
badge_fg = "#ffffff"

[states.selected]
bg = "#5b5b5b"
fg = "#ffffff"
[states.hover]
bg = "#464646"
[states.disabled]
fg = "#b7b7b7"

[footer]
hint_color = "#b7b7b7"
