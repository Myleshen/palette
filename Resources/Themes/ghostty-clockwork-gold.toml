# Ported from Ghostty's bundled "Clockwork Gold" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Clockwork Gold"
appearance = "dark"

[palette]
bg = "#1d1c19"
surface = "#151412"
elevated = "#343330"
fg = "#ebe8e0"
fg_muted = "#a3a19a"
accent = "#ffcc00"
accent_fg = "#000000"
selection_bg = "#4c4b47"
selection_fg = "#fcfaf4"
match_fg = "#ff68c6"
border = "#464541"
separator = "#34333080"
danger = "#e94b4a"
warning = "#ffcc00"
success = "#73c881"
info = "#4fa3f4"
badge_bg = "#343330"
badge_fg = "#ebe8e0"

[states.selected]
bg = "#4c4b47"
fg = "#fcfaf4"
[states.hover]
bg = "#343330"
[states.disabled]
fg = "#a3a19a"

[footer]
hint_color = "#a3a19a"
