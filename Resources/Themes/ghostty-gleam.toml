# Ported from Ghostty's bundled "Gleam" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Gleam"
appearance = "dark"

[palette]
bg = "#292d3e"
surface = "#1e202d"
elevated = "#3e4251"
fg = "#ffffff"
fg_muted = "#b4b6bb"
accent = "#9ce7ff"
accent_fg = "#000000"
selection_bg = "#393f57"
selection_fg = "#ffffff"
match_fg = "#ffaff3"
border = "#545765"
separator = "#3e425180"
danger = "#f44747"
warning = "#ffd596"
success = "#aadd8b"
info = "#6796e6"
badge_bg = "#3e4251"
badge_fg = "#ffffff"

[states.selected]
bg = "#393f57"
fg = "#ffffff"
[states.hover]
bg = "#3e4251"
[states.disabled]
fg = "#b4b6bb"

[footer]
hint_color = "#b4b6bb"
