# Ported from Ghostty's bundled "Rainbows and Unicorns" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Rainbows and Unicorns"
appearance = "dark"

[palette]
bg = "#0e0e13"
surface = "#0a0a0e"
elevated = "#26262b"
fg = "#e6e3d8"
fg_muted = "#9a9893"
accent = "#fcb827"
accent_fg = "#000000"
selection_bg = "#963d97"
selection_fg = "#fffdf5"
match_fg = "#d68adb"
border = "#39393a"
separator = "#26262b80"
danger = "#e0453f"
warning = "#fcb827"
success = "#62bb47"
info = "#1d9be3"
badge_bg = "#26262b"
badge_fg = "#e6e3d8"

[states.selected]
bg = "#963d97"
fg = "#fffdf5"
[states.hover]
bg = "#26262b"
[states.disabled]
fg = "#9a9893"

[footer]
hint_color = "#9a9893"
