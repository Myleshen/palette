# Ported from Ghostty's bundled "Night Owlish Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Night Owlish Light"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#403f53"
fg_muted = "#767582"
accent = "#3e6bca"
accent_fg = "#f2f2f2"
selection_bg = "#ffffff"
selection_fg = "#403f53"
match_fg = "#403f53"
border = "#d9d9dd"
separator = "#ffffff80"
danger = "#d3423e"
warning = "#b98f00"
success = "#2aa298"
info = "#4876d6"
badge_bg = "#ffffff"
badge_fg = "#403f53"

[states.selected]
bg = "#ffffff"
fg = "#403f53"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#83828f"

[window]
material = "popover"

[footer]
hint_color = "#83828f"
