# Ported from Ghostty's bundled "Apple System Colors Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Apple System Colors Light"
appearance = "light"

[palette]
bg = "#feffff"
surface = "#f1f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#0869cb"
accent_fg = "#ffffff"
selection_bg = "#abd8ff"
selection_fg = "#000000"
match_fg = "#9647bf"
border = "#cbcccc"
separator = "#ffffff80"
danger = "#cc372e"
warning = "#af9200"
success = "#26a439"
info = "#0869cb"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#abd8ff"
fg = "#000000"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
