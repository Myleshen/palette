# Ported from Ghostty's bundled "Birds Of Paradise" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Birds Of Paradise"
appearance = "dark"

[palette]
bg = "#2a1f1d"
surface = "#1e1615"
elevated = "#3f3534"
fg = "#e0dbb7"
fg_muted = "#a09981"
accent = "#b8d3ed"
accent_fg = "#000000"
selection_bg = "#563c27"
selection_fg = "#e0dbbb"
match_fg = "#d19ecb"
border = "#4e453c"
separator = "#3f353480"
danger = "#c6352d"
warning = "#e99d2a"
success = "#6ba18a"
info = "#5a86ad"
badge_bg = "#3f3534"
badge_fg = "#e0dbb7"

[states.selected]
bg = "#563c27"
fg = "#e0dbbb"
[states.hover]
bg = "#3f3534"
[states.disabled]
fg = "#a09981"

[footer]
hint_color = "#a09981"
