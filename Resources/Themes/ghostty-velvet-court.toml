# Ported from Ghostty's bundled "Velvet Court" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Velvet Court"
appearance = "dark"

[palette]
bg = "#1f0e1c"
surface = "#160a14"
elevated = "#352633"
fg = "#f2dcea"
fg_muted = "#a894a2"
accent = "#f0c44e"
accent_fg = "#000000"
selection_bg = "#3e2138"
selection_fg = "#998e97"
match_fg = "#d087e0"
border = "#493745"
separator = "#35263380"
danger = "#ee5c82"
warning = "#f0c44e"
success = "#9ad08a"
info = "#b392e8"
badge_bg = "#352633"
badge_fg = "#f2dcea"

[states.selected]
bg = "#3e2138"
fg = "#998e97"
[states.hover]
bg = "#352633"
[states.disabled]
fg = "#a894a2"

[footer]
hint_color = "#a894a2"
