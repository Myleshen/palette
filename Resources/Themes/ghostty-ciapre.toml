# Ported from Ghostty's bundled "Ciapre" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Ciapre"
appearance = "dark"

[palette]
bg = "#191c27"
surface = "#12141c"
elevated = "#30333d"
fg = "#aea47a"
fg_muted = "#7a745d"
accent = "#3097c6"
accent_fg = "#000000"
selection_bg = "#30333d"
selection_fg = "#aea47f"
match_fg = "#d33061"
border = "#373738"
separator = "#30333d80"
danger = "#8e0d16"
warning = "#cc8b3f"
success = "#48513b"
info = "#576d8c"
badge_bg = "#30333d"
badge_fg = "#aea47a"

[states.selected]
bg = "#30333d"
fg = "#aea47f"
[states.hover]
bg = "#30333d"
[states.disabled]
fg = "#7a745d"

[footer]
hint_color = "#7a745d"
