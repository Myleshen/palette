# Ported from Ghostty's bundled "Silent Empire" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Silent Empire"
appearance = "dark"

[palette]
bg = "#071e29"
surface = "#05161e"
elevated = "#20343e"
fg = "#e3f3f5"
fg_muted = "#96a8ae"
accent = "#e6c579"
accent_fg = "#000000"
selection_bg = "#394653"
selection_fg = "#fff8ee"
match_fg = "#bfa9ed"
border = "#334952"
separator = "#20343e80"
danger = "#df8179"
warning = "#e6c579"
success = "#86c5a4"
info = "#7ab8ec"
badge_bg = "#20343e"
badge_fg = "#e3f3f5"

[states.selected]
bg = "#394653"
fg = "#fff8ee"
[states.hover]
bg = "#20343e"
[states.disabled]
fg = "#96a8ae"

[footer]
hint_color = "#96a8ae"
