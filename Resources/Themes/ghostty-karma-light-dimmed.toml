# Ported from Ghostty's bundled "Karma Light Dimmed" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Karma Light Dimmed"
appearance = "light"

[palette]
bg = "#f5f3f7"
surface = "#e9e7eb"
elevated = "#fbfafb"
fg = "#1c1f24"
fg_muted = "#68696e"
accent = "#496a98"
accent_fg = "#e8e8e8"
selection_bg = "#ddd8e2"
selection_fg = "#1c1f24"
match_fg = "#7c5ab0"
border = "#cac9cd"
separator = "#fbfafb80"
danger = "#d36e85"
warning = "#ba8300"
success = "#4a9a4c"
info = "#6688b8"
badge_bg = "#fbfafb"
badge_fg = "#1c1f24"

[states.selected]
bg = "#ddd8e2"
fg = "#1c1f24"
[states.hover]
bg = "#fbfafb"
[states.disabled]
fg = "#68696e"

[window]
material = "popover"

[footer]
hint_color = "#68696e"
