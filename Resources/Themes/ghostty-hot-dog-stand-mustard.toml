# Ported from Ghostty's bundled "Hot Dog Stand (Mustard)" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Hot Dog Stand (Mustard)"
appearance = "light"

[palette]
bg = "#ffff54"
surface = "#f2f250"
elevated = "#ffffb2"
fg = "#000000"
fg_muted = "#59591d"
accent = "#000000"
accent_fg = "#ffffff"
selection_bg = "#ea3323"
selection_fg = "#0a0a0a"
match_fg = "#ea3323"
border = "#cccc43"
separator = "#ffffb280"
danger = "#ea3323"
warning = "#ea3323"
success = "#ea3323"
info = "#000000"
badge_bg = "#ffffb2"
badge_fg = "#000000"

[states.selected]
bg = "#ea3323"
fg = "#0a0a0a"
[states.hover]
bg = "#ffffb2"
[states.disabled]
fg = "#59591d"

[window]
material = "popover"

[footer]
hint_color = "#59591d"
