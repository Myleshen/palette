# Ported from Ghostty's bundled "X Berlin" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · X Berlin"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#cccccc"
fg_muted = "#858585"
accent = "#aaaaaa"
accent_fg = "#000000"
selection_bg = "#cccccc"
selection_fg = "#000000"
match_fg = "#cccccc"
border = "#292929"
separator = "#1a1a1a80"
danger = "#999999"
warning = "#dddddd"
success = "#bbbbbb"
info = "#888888"
badge_bg = "#1a1a1a"
badge_fg = "#cccccc"

[states.selected]
bg = "#cccccc"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#858585"

[footer]
hint_color = "#858585"
