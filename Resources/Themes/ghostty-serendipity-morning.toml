# Ported from Ghostty's bundled "Serendipity Morning" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Serendipity Morning"
appearance = "light"

[palette]
bg = "#f6f7fb"
surface = "#eaebee"
elevated = "#fbfbfd"
fg = "#3f4363"
fg_muted = "#6e7086"
accent = "#4568b6"
accent_fg = "#ebebeb"
selection_bg = "#5a5670"
selection_fg = "#d1d2de"
match_fg = "#629aa5"
border = "#d1d3dd"
separator = "#fbfbfd80"
danger = "#c25a4d"
warning = "#785fd0"
success = "#2f7aab"
info = "#6288d8"
badge_bg = "#fbfbfd"
badge_fg = "#3f4363"

[states.selected]
bg = "#5a5670"
fg = "#d1d2de"
[states.hover]
bg = "#fbfbfd"
[states.disabled]
fg = "#7f8298"

[window]
material = "popover"

[footer]
hint_color = "#7f8298"
