# Ported from Ghostty's bundled "TokyoNight Storm" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · TokyoNight Storm"
appearance = "dark"

[palette]
bg = "#24283b"
surface = "#1a1d2a"
elevated = "#3a3e4f"
fg = "#c0caf5"
fg_muted = "#8991b4"
accent = "#7aa2f7"
accent_fg = "#000000"
selection_bg = "#364a82"
selection_fg = "#c0caf5"
match_fg = "#bb9af7"
border = "#434860"
separator = "#3a3e4f80"
danger = "#f7768e"
warning = "#e0af68"
success = "#9ece6a"
info = "#7aa2f7"
badge_bg = "#3a3e4f"
badge_fg = "#c0caf5"

[states.selected]
bg = "#364a82"
fg = "#c0caf5"
[states.hover]
bg = "#3a3e4f"
[states.disabled]
fg = "#8991b4"

[footer]
hint_color = "#8991b4"
