# Ported from Ghostty's bundled "Liquid Carbon Transparent" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Liquid Carbon Transparent"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#afc2c2"
fg_muted = "#727e7e"
accent = "#0099cc"
accent_fg = "#000000"
selection_bg = "#7dbeff"
selection_fg = "#000000"
match_fg = "#cc69c8"
border = "#232727"
separator = "#1a1a1a80"
danger = "#ff3030"
warning = "#ccac00"
success = "#559a70"
info = "#0099cc"
badge_bg = "#1a1a1a"
badge_fg = "#afc2c2"

[states.selected]
bg = "#7dbeff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#727e7e"

[footer]
hint_color = "#727e7e"
