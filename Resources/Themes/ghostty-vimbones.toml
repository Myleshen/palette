# Ported from Ghostty's bundled "Vimbones" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Vimbones"
appearance = "light"

[palette]
bg = "#f0f0ca"
surface = "#e4e4c0"
elevated = "#f8f8e7"
fg = "#353535"
fg_muted = "#6d6c60"
accent = "#1d5573"
accent_fg = "#ffffff"
selection_bg = "#d7d7d7"
selection_fg = "#353535"
match_fg = "#7b3b70"
border = "#cbcbac"
separator = "#f8f8e780"
danger = "#a8334c"
warning = "#944927"
success = "#4f6c31"
info = "#286486"
badge_bg = "#f8f8e7"
badge_fg = "#353535"

[states.selected]
bg = "#d7d7d7"
fg = "#353535"
[states.hover]
bg = "#f8f8e7"
[states.disabled]
fg = "#767669"

[window]
material = "popover"

[footer]
hint_color = "#767669"
