# Ported from Ghostty's bundled "Rhoads Insipired" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rhoads Insipired"
appearance = "dark"

[palette]
bg = "#0a0a0a"
surface = "#070707"
elevated = "#232323"
fg = "#f5f5f0"
fg_muted = "#a3a3a0"
accent = "#85c7f2"
accent_fg = "#000000"
selection_bg = "#f4b942"
selection_fg = "#111111"
match_fg = "#d69bf4"
border = "#393938"
separator = "#23232380"
danger = "#e85d5d"
warning = "#f5a623"
success = "#b7d96c"
info = "#5aa9e6"
badge_bg = "#232323"
badge_fg = "#f5f5f0"

[states.selected]
bg = "#f4b942"
fg = "#111111"
[states.hover]
bg = "#232323"
[states.disabled]
fg = "#a3a3a0"

[footer]
hint_color = "#a3a3a0"
