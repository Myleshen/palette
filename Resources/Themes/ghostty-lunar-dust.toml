# Ported from Ghostty's bundled "Lunar Dust" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lunar Dust"
appearance = "light"

[palette]
bg = "#f3f1ed"
surface = "#e7e5e1"
elevated = "#faf9f7"
fg = "#20242b"
fg_muted = "#6a6c6f"
accent = "#123a78"
accent_fg = "#ffffff"
selection_bg = "#d9d6d0"
selection_fg = "#20242b"
match_fg = "#603286"
border = "#c9c8c6"
separator = "#faf9f780"
danger = "#842626"
warning = "#654d00"
success = "#165a38"
info = "#17458a"
badge_bg = "#faf9f7"
badge_fg = "#20242b"

[states.selected]
bg = "#d9d6d0"
fg = "#20242b"
[states.hover]
bg = "#faf9f7"
[states.disabled]
fg = "#6a6c6f"

[window]
material = "popover"

[footer]
hint_color = "#6a6c6f"
