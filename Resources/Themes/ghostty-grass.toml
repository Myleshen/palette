# Ported from Ghostty's bundled "Grass" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
# Contrast note: badge_fg was corrected to reach 4.5:1 against the badge background.
name = "Ghostty · Grass"
appearance = "dark"

[palette]
bg = "#13773d"
surface = "#0e562c"
elevated = "#2b8550"
fg = "#ffffff"
fg_muted = "#d5f0a8"
accent = "#fbfdff"
accent_fg = "#767575"
selection_bg = "#2b8550"
selection_fg = "#ffffff"
match_fg = "#ff55ff"
border = "#428f52"
separator = "#2b855080"
danger = "#ffa69f"
warning = "#edb515"
success = "#40d93a"
info = "#00006e"
badge_bg = "#2b8550"
badge_fg = "#fffdf4"

[states.selected]
bg = "#2b8550"
fg = "#ffffff"
[states.hover]
bg = "#2b8550"
[states.disabled]
fg = "#afc882"

[footer]
hint_color = "#afc882"
