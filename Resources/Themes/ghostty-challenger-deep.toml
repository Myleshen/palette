# Ported from Ghostty's bundled "Challenger Deep" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Challenger Deep"
appearance = "dark"

[palette]
bg = "#1e1c31"
surface = "#161423"
elevated = "#343346"
fg = "#cbe1e7"
fg_muted = "#8e9ca7"
accent = "#91ddff"
accent_fg = "#000000"
selection_bg = "#cbe1e7"
selection_fg = "#1e1c31"
match_fg = "#c991e1"
border = "#414355"
separator = "#34334680"
danger = "#ff5458"
warning = "#ffb378"
success = "#62d196"
info = "#65b2ff"
badge_bg = "#343346"
badge_fg = "#cbe1e7"

[states.selected]
bg = "#cbe1e7"
fg = "#1e1c31"
[states.hover]
bg = "#343346"
[states.disabled]
fg = "#8e9ca7"

[footer]
hint_color = "#8e9ca7"
