# Ported from Ghostty's bundled "Elegant" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Elegant"
appearance = "dark"

[palette]
bg = "#292b31"
surface = "#1e1f23"
elevated = "#3e4046"
fg = "#ced2d6"
fg_muted = "#94989c"
accent = "#8dabe1"
accent_fg = "#000000"
selection_bg = "#d5d5d5"
selection_fg = "#144385"
match_fg = "#c792eb"
border = "#4a4c52"
separator = "#3e404680"
danger = "#ff0257"
warning = "#ffcb8b"
success = "#85cc95"
info = "#8dabe1"
badge_bg = "#3e4046"
badge_fg = "#ced2d6"

[states.selected]
bg = "#d5d5d5"
fg = "#144385"
[states.hover]
bg = "#3e4046"
[states.disabled]
fg = "#94989c"

[footer]
hint_color = "#94989c"
