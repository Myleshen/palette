# Ported from Ghostty's bundled "Xcode Light hc" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Xcode Light hc"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#003f73"
accent_fg = "#ffffff"
selection_bg = "#b4d8fd"
selection_fg = "#000000"
match_fg = "#9c2191"
border = "#cccccc"
separator = "#ffffff80"
danger = "#ad1805"
warning = "#78492a"
success = "#355d61"
info = "#0058a1"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#b4d8fd"
fg = "#000000"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
