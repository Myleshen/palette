# Ported from Ghostty's bundled "Mirage" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Mirage"
appearance = "dark"

[palette]
bg = "#1b2738"
surface = "#131c28"
elevated = "#323d4c"
fg = "#a6b2c1"
fg_muted = "#818e9d"
accent = "#7fb5ff"
accent_fg = "#000000"
selection_bg = "#273951"
selection_fg = "#d3dbe5"
match_fg = "#ddb3ff"
border = "#374353"
separator = "#323d4c80"
danger = "#ff9999"
warning = "#ffd700"
success = "#85cc95"
info = "#7fb5ff"
badge_bg = "#323d4c"
badge_fg = "#a6b2c0"

[states.selected]
bg = "#273951"
fg = "#d3dbe5"
[states.hover]
bg = "#323d4c"
[states.disabled]
fg = "#758190"

[footer]
hint_color = "#758190"
