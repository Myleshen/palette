# Ported from Ghostty's bundled "Espresso Libre" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Espresso Libre"
appearance = "dark"

[palette]
bg = "#2a211c"
surface = "#1e1814"
elevated = "#3f3733"
fg = "#b8a898"
fg_muted = "#86796d"
accent = "#43a8ed"
accent_fg = "#000000"
selection_bg = "#c3dcff"
selection_fg = "#675d53"
match_fg = "#ff818a"
border = "#463c35"
separator = "#3f373380"
danger = "#cc0000"
warning = "#f0e53a"
success = "#1a921c"
info = "#0066ff"
badge_bg = "#3f3733"
badge_fg = "#b8a898"

[states.selected]
bg = "#c3dcff"
fg = "#675d53"
[states.hover]
bg = "#3f3733"
[states.disabled]
fg = "#86796d"

[footer]
hint_color = "#86796d"
