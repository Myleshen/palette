# Ported from Ghostty's bundled "Static Memory" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Static Memory"
appearance = "light"

[palette]
bg = "#f7f8f6"
surface = "#ebecea"
elevated = "#fbfcfb"
fg = "#1b2020"
fg_muted = "#686c6b"
accent = "#123a78"
accent_fg = "#ffffff"
selection_bg = "#dde3e0"
selection_fg = "#1b2020"
match_fg = "#603087"
border = "#cbcdcb"
separator = "#fbfcfb80"
danger = "#852323"
warning = "#654d00"
success = "#145b38"
info = "#17468d"
badge_bg = "#fbfcfb"
badge_fg = "#1b2020"

[states.selected]
bg = "#dde3e0"
fg = "#1b2020"
[states.hover]
bg = "#fbfcfb"
[states.disabled]
fg = "#686c6b"

[window]
material = "popover"

[footer]
hint_color = "#686c6b"
