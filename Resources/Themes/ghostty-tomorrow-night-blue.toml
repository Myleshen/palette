# Ported from Ghostty's bundled "Tomorrow Night Blue" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Tomorrow Night Blue"
appearance = "dark"

[palette]
bg = "#002451"
surface = "#001a3a"
elevated = "#1a3a62"
fg = "#ffffff"
fg_muted = "#a6b2c2"
accent = "#bbdaff"
accent_fg = "#000000"
selection_bg = "#003f8e"
selection_fg = "#ffffff"
match_fg = "#ebbbff"
border = "#335074"
separator = "#1a3a6280"
danger = "#ff9da4"
warning = "#ffeead"
success = "#d1f1a9"
info = "#bbdaff"
badge_bg = "#1a3a62"
badge_fg = "#ffffff"

[states.selected]
bg = "#003f8e"
fg = "#ffffff"
[states.hover]
bg = "#1a3a62"
[states.disabled]
fg = "#a6b2c2"

[footer]
hint_color = "#a6b2c2"
