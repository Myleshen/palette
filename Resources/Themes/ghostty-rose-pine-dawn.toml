# Ported from Ghostty's bundled "Rose Pine Dawn" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rose Pine Dawn"
appearance = "light"

[palette]
bg = "#faf4ed"
surface = "#ede8e1"
elevated = "#fdfaf7"
fg = "#443e64"
fg_muted = "#6b667d"
accent = "#33717c"
accent_fg = "#e8e8e8"
selection_bg = "#dfdad9"
selection_fg = "#575279"
match_fg = "#907aa9"
border = "#d9d4d6"
separator = "#fdfaf780"
danger = "#b4637a"
warning = "#c67e00"
success = "#286983"
info = "#56949f"
badge_bg = "#fdfaf7"
badge_fg = "#575279"

[states.selected]
bg = "#dfdad9"
fg = "#575279"
[states.hover]
bg = "#fdfaf7"
[states.disabled]
fg = "#908ba2"

[window]
material = "popover"

[footer]
hint_color = "#6b667c"
