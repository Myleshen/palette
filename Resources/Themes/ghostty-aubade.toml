# Ported from Ghostty's bundled "Aubade" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Aubade"
appearance = "light"

[palette]
bg = "#fbf6fb"
surface = "#eeeaee"
elevated = "#fdfbfd"
fg = "#3a3340"
fg_muted = "#7e7781"
accent = "#4a3cc0"
accent_fg = "#ffffff"
selection_bg = "#ebe2ee"
selection_fg = "#686568"
match_fg = "#8a4bc0"
border = "#d4cfd6"
separator = "#fdfbfd80"
danger = "#c0303a"
warning = "#8c610c"
success = "#2e7d6e"
info = "#4a3cc0"
badge_bg = "#fdfbfd"
badge_fg = "#3a3340"

[states.selected]
bg = "#ebe2ee"
fg = "#686568"
[states.hover]
bg = "#fdfbfd"
[states.disabled]
fg = "#7e7781"

[window]
material = "popover"

[footer]
hint_color = "#7e7781"
