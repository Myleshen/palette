# Ported from Ghostty's bundled "Kanso Ink" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Kanso Ink"
appearance = "dark"

[palette]
bg = "#14171d"
surface = "#0e1115"
elevated = "#2c2e34"
fg = "#c5c9c7"
fg_muted = "#878b8c"
accent = "#7fb4ca"
accent_fg = "#000000"
selection_bg = "#22262d"
selection_fg = "#c5c9c7"
match_fg = "#a292a3"
border = "#373b3f"
separator = "#2c2e3480"
danger = "#c4746e"
warning = "#c4b28a"
success = "#8a9a7b"
info = "#8ba4b0"
badge_bg = "#2c2e34"
badge_fg = "#c5c9c7"

[states.selected]
bg = "#22262d"
fg = "#c5c9c7"
[states.hover]
bg = "#2c2e34"
[states.disabled]
fg = "#878b8c"

[footer]
hint_color = "#878b8c"
