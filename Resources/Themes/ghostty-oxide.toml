# Ported from Ghostty's bundled "Oxide" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Oxide"
appearance = "dark"

[palette]
bg = "#161616"
surface = "#101010"
elevated = "#2d2d2d"
fg = "#cecece"
fg_muted = "#8e8e8e"
accent = "#6fc6ff"
accent_fg = "#000000"
selection_bg = "#262626"
selection_fg = "#cecece"
match_fg = "#b5b2ff"
border = "#3b3b3b"
separator = "#2d2d2d80"
danger = "#ed756e"
warning = "#c39900"
success = "#5bb661"
info = "#3ba6f5"
badge_bg = "#2d2d2d"
badge_fg = "#cecece"

[states.selected]
bg = "#262626"
fg = "#cecece"
[states.hover]
bg = "#2d2d2d"
[states.disabled]
fg = "#8e8e8e"

[footer]
hint_color = "#8e8e8e"
