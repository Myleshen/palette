# Ported from Ghostty's bundled "Hyper" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Hyper"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#f81ce5"
accent_fg = "#000000"
selection_bg = "#4a0845"
selection_fg = "#ffffff"
match_fg = "#fd7cfc"
border = "#333333"
separator = "#1a1a1a80"
danger = "#c51e14"
warning = "#c7c329"
success = "#1dc121"
info = "#0a2fc4"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#4a0845"
fg = "#ffffff"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
