# Ported from Ghostty's bundled "Lumina Polaire Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Polaire Dark"
appearance = "dark"

[palette]
bg = "#0f1a21"
surface = "#0b1318"
elevated = "#273137"
fg = "#d7e1e8"
fg_muted = "#919ba2"
accent = "#d1e5ff"
accent_fg = "#000000"
selection_bg = "#2c4551"
selection_fg = "#d7e1e8"
match_fg = "#ffd3fa"
border = "#374249"
separator = "#27313780"
danger = "#cd776f"
warning = "#e2c682"
success = "#a9d6b1"
info = "#aeccf2"
badge_bg = "#273137"
badge_fg = "#d7e1e8"

[states.selected]
bg = "#2c4551"
fg = "#d7e1e8"
[states.hover]
bg = "#273137"
[states.disabled]
fg = "#919ba2"

[footer]
hint_color = "#919ba2"
