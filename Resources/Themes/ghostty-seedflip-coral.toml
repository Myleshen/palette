# Ported from Ghostty's bundled "SeedFlip Coral" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · SeedFlip Coral"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#1d1d1d"
fg_muted = "#6c6c6c"
accent = "#0f58bd"
accent_fg = "#ffffff"
selection_bg = "#ffffff"
selection_fg = "#1d1d1d"
match_fg = "#bd0fbd"
border = "#d2d2d2"
separator = "#ffffff80"
danger = "#bd0f0f"
warning = "#bda00f"
success = "#0fbd49"
info = "#0f58bd"
badge_bg = "#ffffff"
badge_fg = "#1d1d1d"

[states.selected]
bg = "#ffffff"
fg = "#1d1d1d"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#6c6c6c"

[window]
material = "popover"

[footer]
hint_color = "#6c6c6c"
