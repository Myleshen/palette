# Ported from Ghostty's bundled "Raycast Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Raycast Light"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#0070c9"
accent_fg = "#f2f2f2"
selection_bg = "#e5e5e5"
selection_fg = "#000000"
match_fg = "#9a1b6e"
border = "#cccccc"
separator = "#ffffff80"
danger = "#b12424"
warning = "#cc8600"
success = "#006b4f"
info = "#138af2"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#e5e5e5"
fg = "#000000"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
