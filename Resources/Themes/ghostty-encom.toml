# Ported from Ghostty's bundled "ENCOM" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · ENCOM"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#00a595"
fg_muted = "#006b61"
accent = "#0081ff"
accent_fg = "#000000"
selection_bg = "#00a48c"
selection_fg = "#0c2d28"
match_fg = "#ff00ff"
border = "#00211e"
separator = "#1a1a1a80"
danger = "#9f0000"
warning = "#ffd000"
success = "#008b00"
info = "#0081ff"
badge_bg = "#1a1a1a"
badge_fg = "#00a595"

[states.selected]
bg = "#00a48c"
fg = "#0c2d28"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#006b61"

[footer]
hint_color = "#006b61"
