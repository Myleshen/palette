# Ported from Ghostty's bundled "iTerm2 Pastel Dark Background" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · iTerm2 Pastel Dark Background"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#c7c7c7"
fg_muted = "#818181"
accent = "#c2e3ff"
accent_fg = "#000000"
selection_bg = "#454d96"
selection_fg = "#f4f4f4"
match_fg = "#ffb2fe"
border = "#282828"
separator = "#1a1a1a80"
danger = "#ff8373"
warning = "#fffdc3"
success = "#b4fb73"
info = "#a5d5fe"
badge_bg = "#1a1a1a"
badge_fg = "#c7c7c7"

[states.selected]
bg = "#454d96"
fg = "#f4f4f4"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#818181"

[footer]
hint_color = "#818181"
