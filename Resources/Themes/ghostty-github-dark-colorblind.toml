# Ported from Ghostty's bundled "GitHub Dark Colorblind" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · GitHub Dark Colorblind"
appearance = "dark"

[palette]
bg = "#0d1117"
surface = "#090c11"
elevated = "#25292e"
fg = "#c9d1d9"
fg_muted = "#878e95"
accent = "#79c0ff"
accent_fg = "#000000"
selection_bg = "#c9d1d9"
selection_fg = "#0d1117"
match_fg = "#d2a8ff"
border = "#33373e"
separator = "#25292e80"
danger = "#ec8e2c"
warning = "#d29922"
success = "#58a6ff"
info = "#58a6ff"
badge_bg = "#25292e"
badge_fg = "#c9d1d9"

[states.selected]
bg = "#c9d1d9"
fg = "#0d1117"
[states.hover]
bg = "#25292e"
[states.disabled]
fg = "#878e95"

[footer]
hint_color = "#878e95"
