# Ported from Ghostty's bundled "hazyland" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · hazyland"
appearance = "dark"

[palette]
bg = "#171219"
surface = "#110d12"
elevated = "#2e2a30"
fg = "#eee4ff"
fg_muted = "#a39bae"
accent = "#96ccff"
accent_fg = "#000000"
selection_bg = "#0D2847"
selection_fg = "#eee4ff"
match_fg = "#b4b7f2"
border = "#423c47"
separator = "#2e2a3080"
danger = "#ff8fc4"
warning = "#f6e6a8"
success = "#b2ffe3"
info = "#96ccff"
badge_bg = "#2e2a30"
badge_fg = "#eee4ff"

[states.selected]
bg = "#0D2847"
fg = "#eee4ff"
[states.hover]
bg = "#2e2a30"
[states.disabled]
fg = "#a39bae"

[footer]
hint_color = "#a39bae"
