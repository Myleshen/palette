# Ported from Ghostty's bundled "Builtin Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Builtin Dark"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#010101"
elevated = "#1a1a1a"
fg = "#bbbbbb"
fg_muted = "#7a7a7a"
accent = "#6773ff"
accent_fg = "#1b1a1a"
selection_bg = "#b5d5ff"
selection_fg = "#000000"
match_fg = "#ff55ff"
border = "#252525"
separator = "#1a1a1a80"
danger = "#bb0000"
warning = "#bbbb00"
success = "#00bb00"
info = "#1a41ec"
badge_bg = "#1a1a1a"
badge_fg = "#bbbbbb"

[states.selected]
bg = "#b5d5ff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#7a7a7a"

[footer]
hint_color = "#7a7a7a"
