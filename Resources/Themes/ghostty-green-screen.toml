# Ported from Ghostty's bundled "Green Screen" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Green Screen"
appearance = "dark"

[palette]
bg = "#031009"
surface = "#020c06"
elevated = "#1c2822"
fg = "#dff7e8"
fg_muted = "#92a69a"
accent = "#a1c8ef"
accent_fg = "#000000"
selection_bg = "#12351f"
selection_fg = "#effff4"
match_fg = "#d9bae8"
border = "#2f3e36"
separator = "#1c282280"
danger = "#ed8087"
warning = "#e5cc69"
success = "#70d19c"
info = "#82b3e7"
badge_bg = "#1c2822"
badge_fg = "#dff7e8"

[states.selected]
bg = "#12351f"
fg = "#effff4"
[states.hover]
bg = "#1c2822"
[states.disabled]
fg = "#92a69a"

[footer]
hint_color = "#92a69a"
