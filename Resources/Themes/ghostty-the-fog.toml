# Ported from Ghostty's bundled "The Fog" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · The Fog"
appearance = "dark"

[palette]
bg = "#294552"
surface = "#1e323b"
elevated = "#3e5863"
fg = "#eef4f3"
fg_muted = "#a9b7bb"
accent = "#a4cfe0"
accent_fg = "#000000"
selection_bg = "#c8d4d7"
selection_fg = "#555757"
match_fg = "#bfb2ce"
border = "#506872"
separator = "#3e586380"
danger = "#ee9d8b"
warning = "#dec978"
success = "#9bc8ad"
info = "#93c3d6"
badge_bg = "#3e5863"
badge_fg = "#eef4f3"

[states.selected]
bg = "#c8d4d7"
fg = "#555757"
[states.hover]
bg = "#3e5863"
[states.disabled]
fg = "#a9b7bb"

[footer]
hint_color = "#a9b7bb"
