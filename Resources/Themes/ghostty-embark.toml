# Ported from Ghostty's bundled "Embark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Embark"
appearance = "dark"

[palette]
bg = "#1e1c31"
surface = "#161423"
elevated = "#343346"
fg = "#eeffff"
fg_muted = "#a5b0b7"
accent = "#57c7ff"
accent_fg = "#000000"
selection_bg = "#fbfcfc"
selection_fg = "#1e1c31"
match_fg = "#c792ea"
border = "#48495a"
separator = "#34334680"
danger = "#f0719b"
warning = "#ffe9aa"
success = "#a1efd3"
info = "#57c7ff"
badge_bg = "#343346"
badge_fg = "#eeffff"

[states.selected]
bg = "#fbfcfc"
fg = "#1e1c31"
[states.hover]
bg = "#343346"
[states.disabled]
fg = "#a5b0b7"

[footer]
hint_color = "#a5b0b7"
