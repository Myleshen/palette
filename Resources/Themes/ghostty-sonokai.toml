# Ported from Ghostty's bundled "Sonokai" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sonokai"
appearance = "dark"

[palette]
bg = "#2c2e34"
surface = "#202125"
elevated = "#414348"
fg = "#e2e2e3"
fg_muted = "#a2a3a6"
accent = "#76cce0"
accent_fg = "#000000"
selection_bg = "#414550"
selection_fg = "#e2e2e3"
match_fg = "#b39df3"
border = "#505257"
separator = "#41434880"
danger = "#fc5d7c"
warning = "#e7c664"
success = "#9ed072"
info = "#76cce0"
badge_bg = "#414348"
badge_fg = "#e2e2e3"

[states.selected]
bg = "#414550"
fg = "#e2e2e3"
[states.hover]
bg = "#414348"
[states.disabled]
fg = "#a2a3a6"

[footer]
hint_color = "#a2a3a6"
