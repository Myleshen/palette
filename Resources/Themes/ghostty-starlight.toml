# Ported from Ghostty's bundled "Starlight" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Starlight"
appearance = "dark"

[palette]
bg = "#242424"
surface = "#1a1a1a"
elevated = "#3a3a3a"
fg = "#ffffff"
fg_muted = "#b2b2b2"
accent = "#5dc5f8"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#242424"
match_fg = "#f2affd"
border = "#505050"
separator = "#3a3a3a80"
danger = "#f62b5a"
warning = "#e3c401"
success = "#47b413"
info = "#24acd4"
badge_bg = "#3a3a3a"
badge_fg = "#ffffff"

[states.selected]
bg = "#ffffff"
fg = "#242424"
[states.hover]
bg = "#3a3a3a"
[states.disabled]
fg = "#b2b2b2"

[footer]
hint_color = "#b2b2b2"
