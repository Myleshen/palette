# Ported from Ghostty's bundled "Relaxed" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Relaxed"
appearance = "dark"

[palette]
bg = "#353a44"
surface = "#262a31"
elevated = "#494e57"
fg = "#d9d9d9"
fg_muted = "#a0a1a5"
accent = "#7eaac7"
accent_fg = "#000000"
selection_bg = "#6a7985"
selection_fg = "#000000"
match_fg = "#b06698"
border = "#565a62"
separator = "#494e5780"
danger = "#bc5653"
warning = "#ebc17a"
success = "#909d63"
info = "#6a8799"
badge_bg = "#494e57"
badge_fg = "#d9d9d9"

[states.selected]
bg = "#6a7985"
fg = "#000000"
[states.hover]
bg = "#494e57"
[states.disabled]
fg = "#a0a1a5"

[footer]
hint_color = "#a0a1a5"
