# Ported from Ghostty's bundled "Zacess Warm Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Zacess Warm Light"
appearance = "light"

[palette]
bg = "#f4ead5"
surface = "#e8deca"
elevated = "#faf6ec"
fg = "#342410"
fg_muted = "#776955"
accent = "#5b1301"
accent_fg = "#ffffff"
selection_bg = "#215779"
selection_fg = "#f4ead5"
match_fg = "#742c60"
border = "#cec2ae"
separator = "#faf6ec80"
danger = "#8c1a16"
warning = "#6a4603"
success = "#275200"
info = "#014b79"
badge_bg = "#faf6ec"
badge_fg = "#342410"

[states.selected]
bg = "#215779"
fg = "#f4ead5"
[states.hover]
bg = "#faf6ec"
[states.disabled]
fg = "#776955"

[window]
material = "popover"

[footer]
hint_color = "#776955"
