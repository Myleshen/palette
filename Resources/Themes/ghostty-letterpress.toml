# Ported from Ghostty's bundled "Letterpress" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Letterpress"
appearance = "light"

[palette]
bg = "#f3ecdf"
surface = "#e7e0d4"
elevated = "#faf6f1"
fg = "#3a352c"
fg_muted = "#706b61"
accent = "#2a5c8a"
accent_fg = "#ffffff"
selection_bg = "#e3d8c4"
selection_fg = "#5d5952"
match_fg = "#6e4b2e"
border = "#cec7bb"
separator = "#faf6f180"
danger = "#b0202a"
warning = "#8a5e0a"
success = "#506b24"
info = "#2a5c8a"
badge_bg = "#faf6f1"
badge_fg = "#3a352c"

[states.selected]
bg = "#e3d8c4"
fg = "#5d5952"
[states.hover]
bg = "#faf6f1"
[states.disabled]
fg = "#7b756b"

[window]
material = "popover"

[footer]
hint_color = "#7b756b"
