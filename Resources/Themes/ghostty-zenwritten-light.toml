# Ported from Ghostty's bundled "Zenwritten Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zenwritten Light"
appearance = "light"

[palette]
bg = "#eeeeee"
surface = "#e2e2e2"
elevated = "#f7f7f7"
fg = "#353535"
fg_muted = "#767676"
accent = "#1d5573"
accent_fg = "#ffffff"
selection_bg = "#d7d7d7"
selection_fg = "#353535"
match_fg = "#7b3b70"
border = "#c9c9c9"
separator = "#f7f7f780"
danger = "#a8334c"
warning = "#944927"
success = "#4f6c31"
info = "#286486"
badge_bg = "#f7f7f7"
badge_fg = "#353535"

[states.selected]
bg = "#d7d7d7"
fg = "#353535"
[states.hover]
bg = "#f7f7f7"
[states.disabled]
fg = "#767676"

[window]
material = "popover"

[footer]
hint_color = "#767676"
