# Ported from Ghostty's bundled "Catppuccin Frappe" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Catppuccin Frappe"
appearance = "dark"

[palette]
bg = "#303446"
surface = "#232532"
elevated = "#454859"
fg = "#c6d0f5"
fg_muted = "#9299b8"
accent = "#adc2f3"
accent_fg = "#000000"
selection_bg = "#f2d5cf"
selection_fg = "#303446"
match_fg = "#f4b8e4"
border = "#4e5369"
separator = "#45485980"
danger = "#e78284"
warning = "#e5c890"
success = "#a6d189"
info = "#8caaee"
badge_bg = "#454859"
badge_fg = "#c6d0f5"

[states.selected]
bg = "#f2d5cf"
fg = "#303446"
[states.hover]
bg = "#454859"
[states.disabled]
fg = "#9299b8"

[footer]
hint_color = "#9299b8"
