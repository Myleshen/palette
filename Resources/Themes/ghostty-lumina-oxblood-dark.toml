# Ported from Ghostty's bundled "Lumina Oxblood Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Oxblood Dark"
appearance = "dark"

[palette]
bg = "#200f16"
surface = "#170b10"
elevated = "#36272d"
fg = "#e8d6dc"
fg_muted = "#a29097"
accent = "#c2dcff"
accent_fg = "#000000"
selection_bg = "#522c3d"
selection_fg = "#e8d6dc"
match_fg = "#f2d5ff"
border = "#48373e"
separator = "#36272d80"
danger = "#db6c63"
warning = "#f9c875"
success = "#7dc797"
info = "#9ac3f8"
badge_bg = "#36272d"
badge_fg = "#e8d6dc"

[states.selected]
bg = "#522c3d"
fg = "#e8d6dc"
[states.hover]
bg = "#36272d"
[states.disabled]
fg = "#a29097"

[footer]
hint_color = "#a29097"
