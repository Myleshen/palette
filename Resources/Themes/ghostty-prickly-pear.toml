# Ported from Ghostty's bundled "Prickly Pear" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Prickly Pear"
appearance = "dark"

[palette]
bg = "#561038"
surface = "#3e0c28"
elevated = "#67284c"
fg = "#fff0df"
fg_muted = "#c4a2a5"
accent = "#b4d5f4"
accent_fg = "#000000"
selection_bg = "#7b2853"
selection_fg = "#fff7ed"
match_fg = "#edb8df"
border = "#783d59"
separator = "#67284c80"
danger = "#ff8d99"
warning = "#f5c54e"
success = "#78d58e"
info = "#9ac4ef"
badge_bg = "#67284c"
badge_fg = "#fff0df"

[states.selected]
bg = "#7b2853"
fg = "#fff7ed"
[states.hover]
bg = "#67284c"
[states.disabled]
fg = "#c4a2a5"

[footer]
hint_color = "#c4a2a5"
