# Ported from Ghostty's bundled "Lumina Polaire Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Polaire Light"
appearance = "light"

[palette]
bg = "#f0f9fa"
surface = "#e4eded"
elevated = "#f8fcfd"
fg = "#17323f"
fg_muted = "#637880"
accent = "#173e76"
accent_fg = "#ffffff"
selection_bg = "#b8d1de"
selection_fg = "#17323f"
match_fg = "#723a6e"
border = "#c5d1d5"
separator = "#f8fcfd80"
danger = "#882322"
warning = "#965a1c"
success = "#327645"
info = "#3e5372"
badge_bg = "#f8fcfd"
badge_fg = "#17323f"

[states.selected]
bg = "#b8d1de"
fg = "#17323f"
[states.hover]
bg = "#f8fcfd"
[states.disabled]
fg = "#637880"

[window]
material = "popover"

[footer]
hint_color = "#637880"
