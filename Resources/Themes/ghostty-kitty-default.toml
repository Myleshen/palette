# Ported from Ghostty's bundled "Kitty Default" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Kitty Default"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#dddddd"
fg_muted = "#909090"
accent = "#1a8fff"
accent_fg = "#000000"
selection_bg = "#fffacd"
selection_fg = "#000000"
match_fg = "#fd28ff"
border = "#2c2c2c"
separator = "#1a1a1a80"
danger = "#cc0403"
warning = "#cecb00"
success = "#19cb00"
info = "#0d73cc"
badge_bg = "#1a1a1a"
badge_fg = "#dddddd"

[states.selected]
bg = "#fffacd"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#909090"

[footer]
hint_color = "#909090"
