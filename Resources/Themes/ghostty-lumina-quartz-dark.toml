# Ported from Ghostty's bundled "Lumina Quartz Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Quartz Dark"
appearance = "dark"

[palette]
bg = "#161719"
surface = "#101112"
elevated = "#2d2e30"
fg = "#ccd0d3"
fg_muted = "#8c8f92"
accent = "#d6e8ff"
accent_fg = "#000000"
selection_bg = "#44474a"
selection_fg = "#ccd0d3"
match_fg = "#ffd7fa"
border = "#3a3c3e"
separator = "#2d2e3080"
danger = "#c57c74"
warning = "#dfcfb0"
success = "#9dd7b7"
info = "#b6ceed"
badge_bg = "#2d2e30"
badge_fg = "#ccd0d3"

[states.selected]
bg = "#44474a"
fg = "#ccd0d3"
[states.hover]
bg = "#2d2e30"
[states.disabled]
fg = "#8c8f92"

[footer]
hint_color = "#8c8f92"
