# Ported from Ghostty's bundled "Modus Operandi Deuteranopia" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Modus Operandi Deuteranopia"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#0031a9"
accent_fg = "#ffffff"
selection_bg = "#bdbdbd"
selection_fg = "#000000"
match_fg = "#721045"
border = "#cccccc"
separator = "#ffffff80"
danger = "#a60000"
warning = "#695500"
success = "#006800"
info = "#0031a9"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#bdbdbd"
fg = "#000000"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
