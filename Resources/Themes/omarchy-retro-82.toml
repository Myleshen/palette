# Ported from Omarchy's bundled "Retro 82" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/retro-82/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Retro 82"
appearance = "dark"

[palette]
bg = "#05182e"
surface = "#041121"
elevated = "#1e2f43"
fg = "#f6dcac"
fg_muted = "#a29780"
accent = "#faa968"
accent_fg = "#000000"
selection_bg = "#faa968"
selection_fg = "#00172e"
match_fg = "#3f8f8a"
border = "#353f47"
separator = "#1e2f4380"
danger = "#f85525"
warning = "#e97b3c"
success = "#028391"
info = "#faa968"
badge_bg = "#1e2f43"
badge_fg = "#f6dcac"

[states.selected]
bg = "#faa968"
fg = "#00172e"
[states.hover]
bg = "#1e2f43"
[states.disabled]
fg = "#a29780"

[footer]
hint_color = "#a29780"
