# Ported from Ghostty's bundled "Sierra Gold" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sierra Gold"
appearance = "dark"

[palette]
bg = "#392414"
surface = "#291a0e"
elevated = "#4d3a2c"
fg = "#f9e6c7"
fg_muted = "#b6a288"
accent = "#b9d9fa"
accent_fg = "#000000"
selection_bg = "#8e684a"
selection_fg = "#fff8e8"
match_fg = "#e7bde9"
border = "#5f4b38"
separator = "#4d3a2c80"
danger = "#f4a17c"
warning = "#f3c873"
success = "#a8c98b"
info = "#9dc5ed"
badge_bg = "#4d3a2c"
badge_fg = "#f9e6c7"

[states.selected]
bg = "#8e684a"
fg = "#fff8e8"
[states.hover]
bg = "#4d3a2c"
[states.disabled]
fg = "#b6a288"

[footer]
hint_color = "#b6a288"
