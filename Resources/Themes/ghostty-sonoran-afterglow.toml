# Ported from Ghostty's bundled "Sonoran Afterglow" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Sonoran Afterglow"
appearance = "dark"

[palette]
bg = "#201a2b"
surface = "#17131f"
elevated = "#363140"
fg = "#ede1d9"
fg_muted = "#a59b9c"
accent = "#e9b872"
accent_fg = "#000000"
selection_bg = "#49364c"
selection_fg = "#ada9b3"
match_fg = "#d7ace0"
border = "#49424e"
separator = "#36314080"
danger = "#d66d73"
warning = "#d9ae69"
success = "#83ad89"
info = "#819cd3"
badge_bg = "#363140"
badge_fg = "#ede1d9"

[states.selected]
bg = "#49364c"
fg = "#ada9b3"
[states.hover]
bg = "#363140"
[states.disabled]
fg = "#a59b9c"

[footer]
hint_color = "#a59b9c"
