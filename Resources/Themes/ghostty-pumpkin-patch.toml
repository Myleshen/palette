# Ported from Ghostty's bundled "Pumpkin Patch" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Pumpkin Patch"
appearance = "dark"

[palette]
bg = "#243416"
surface = "#1a2510"
elevated = "#3a482d"
fg = "#f5efd1"
fg_muted = "#acae90"
accent = "#95c7d5"
accent_fg = "#000000"
selection_bg = "#cacfb9"
selection_fg = "#585547"
match_fg = "#cea6c0"
border = "#4e593b"
separator = "#3a482d80"
danger = "#f09870"
warning = "#e8c95a"
success = "#95ce77"
info = "#87bfcf"
badge_bg = "#3a482d"
badge_fg = "#f5efd1"

[states.selected]
bg = "#cacfb9"
fg = "#585547"
[states.hover]
bg = "#3a482d"
[states.disabled]
fg = "#acae90"

[footer]
hint_color = "#acae90"
