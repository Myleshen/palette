# Ported from Ghostty's bundled "Charcoal" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Charcoal"
appearance = "dark"

[palette]
bg = "#0d0d0d"
surface = "#090909"
elevated = "#252525"
fg = "#c4c4c4"
fg_muted = "#848484"
accent = "#d0d0d0"
accent_fg = "#000000"
selection_bg = "#2e2e2e"
selection_fg = "#e0e0e0"
match_fg = "#b8b8b8"
border = "#323232"
separator = "#25252580"
danger = "#888888"
warning = "#b0b0b0"
success = "#a8a8a8"
info = "#9a9a9a"
badge_bg = "#252525"
badge_fg = "#c4c4c4"

[states.selected]
bg = "#2e2e2e"
fg = "#e0e0e0"
[states.hover]
bg = "#252525"
[states.disabled]
fg = "#848484"

[footer]
hint_color = "#848484"
