# Ported from Ghostty's bundled "Karasu Snow" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Karasu Snow"
appearance = "light"

[palette]
bg = "#fafafa"
surface = "#ededed"
elevated = "#fdfdfd"
fg = "#292524"
fg_muted = "#72706f"
accent = "#2e5e9b"
accent_fg = "#ffffff"
selection_bg = "#e5e5e5"
selection_fg = "#292524"
match_fg = "#6c4bb8"
border = "#d0cfcf"
separator = "#fdfdfd80"
danger = "#b84755"
warning = "#8a6a1f"
success = "#3f7e4a"
info = "#2e5e9b"
badge_bg = "#fdfdfd"
badge_fg = "#292524"

[states.selected]
bg = "#e5e5e5"
fg = "#292524"
[states.hover]
bg = "#fdfdfd"
[states.disabled]
fg = "#72706f"

[window]
material = "popover"

[footer]
hint_color = "#72706f"
