# Ported from Ghostty's bundled "Noctis Obscuro" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Noctis Obscuro"
appearance = "dark"

[palette]
bg = "#031417"
surface = "#020e11"
elevated = "#1c2c2e"
fg = "#b2cacd"
fg_muted = "#758a8d"
accent = "#60b6eb"
accent_fg = "#000000"
selection_bg = "#0d2a2f"
selection_fg = "#b2cacd"
match_fg = "#e798b3"
border = "#26383b"
separator = "#1c2c2e80"
danger = "#e66533"
warning = "#e4b781"
success = "#49e9a6"
info = "#49ace9"
badge_bg = "#1c2c2e"
badge_fg = "#b2cacd"

[states.selected]
bg = "#0d2a2f"
fg = "#b2cacd"
[states.hover]
bg = "#1c2c2e"
[states.disabled]
fg = "#758a8d"

[footer]
hint_color = "#758a8d"
