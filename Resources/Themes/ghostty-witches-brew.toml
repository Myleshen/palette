# Ported from Ghostty's bundled "Witches' Brew" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Witches' Brew"
appearance = "dark"

[palette]
bg = "#073b25"
surface = "#052a1b"
elevated = "#204f3b"
fg = "#efffdc"
fg_muted = "#9eba9c"
accent = "#9cf04d"
accent_fg = "#000000"
selection_bg = "#245c42"
selection_fg = "#fbfff3"
match_fg = "#e5b7df"
border = "#35624a"
separator = "#204f3b80"
danger = "#f19a72"
warning = "#f0cc58"
success = "#9be86b"
info = "#86c8e3"
badge_bg = "#204f3b"
badge_fg = "#efffdc"

[states.selected]
bg = "#245c42"
fg = "#fbfff3"
[states.hover]
bg = "#204f3b"
[states.disabled]
fg = "#9eba9c"

[footer]
hint_color = "#9eba9c"
