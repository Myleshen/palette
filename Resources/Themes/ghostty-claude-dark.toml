# Ported from Ghostty's bundled "Claude Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Claude Dark"
appearance = "dark"

[palette]
bg = "#262624"
surface = "#1b1b1a"
elevated = "#3c3c3a"
fg = "#e5e4e1"
fg_muted = "#a2a29f"
accent = "#9fc5f4"
accent_fg = "#000000"
selection_bg = "#363634"
selection_fg = "#e5e4e1"
match_fg = "#f3aac5"
border = "#4c4c4a"
separator = "#3c3c3a80"
danger = "#d47563"
warning = "#e8c96b"
success = "#9aca86"
info = "#6a9bcc"
badge_bg = "#3c3c3a"
badge_fg = "#e5e4e1"

[states.selected]
bg = "#363634"
fg = "#e5e4e1"
[states.hover]
bg = "#3c3c3a"
[states.disabled]
fg = "#a2a29f"

[footer]
hint_color = "#a2a29f"
