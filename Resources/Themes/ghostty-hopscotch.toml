# Ported from Ghostty's bundled "Hopscotch" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Hopscotch"
appearance = "dark"

[palette]
bg = "#322931"
surface = "#241e23"
elevated = "#463e46"
fg = "#bbb6b9"
fg_muted = "#979095"
accent = "#afaaae"
accent_fg = "#000000"
selection_bg = "#5c545b"
selection_fg = "#cfcdcf"
match_fg = "#d5d3d5"
border = "#4d454c"
separator = "#463e4680"
danger = "#dd464c"
warning = "#fdcc59"
success = "#8fc13e"
info = "#1290bf"
badge_bg = "#463e46"
badge_fg = "#b9b5b8"

[states.selected]
bg = "#5c545b"
fg = "#cfcdcf"
[states.hover]
bg = "#463e46"
[states.disabled]
fg = "#8a8489"

[footer]
hint_color = "#8a8489"
