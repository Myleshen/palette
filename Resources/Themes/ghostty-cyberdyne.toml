# Ported from Ghostty's bundled "Cyberdyne" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Cyberdyne"
appearance = "dark"

[palette]
bg = "#151144"
surface = "#0f0c31"
elevated = "#2c2957"
fg = "#00ff92"
fg_muted = "#07ac77"
accent = "#c2e3ff"
accent_fg = "#000000"
selection_bg = "#454d96"
selection_fg = "#f4f4f4"
match_fg = "#ffb2fe"
border = "#114154"
separator = "#2c295780"
danger = "#ff8373"
warning = "#d2a700"
success = "#00c172"
info = "#0071cf"
badge_bg = "#2c2957"
badge_fg = "#00ff92"

[states.selected]
bg = "#454d96"
fg = "#f4f4f4"
[states.hover]
bg = "#2c2957"
[states.disabled]
fg = "#07ac77"

[footer]
hint_color = "#07ac77"
