# Ported from Ghostty's bundled "X" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · X"
appearance = "dark"

[palette]
bg = "#050505"
surface = "#040404"
elevated = "#1e1e1e"
fg = "#f7f1ff"
fg_muted = "#a29ea8"
accent = "#fd9353"
accent_fg = "#000000"
selection_bg = "#f7f1ff"
selection_fg = "#050505"
match_fg = "#948ae3"
border = "#353437"
separator = "#1e1e1e80"
danger = "#fc618d"
warning = "#fce566"
success = "#7bd88f"
info = "#fd9353"
badge_bg = "#1e1e1e"
badge_fg = "#f7f1ff"

[states.selected]
bg = "#f7f1ff"
fg = "#050505"
[states.hover]
bg = "#1e1e1e"
[states.disabled]
fg = "#a29ea8"

[footer]
hint_color = "#a29ea8"
