# Ported from Ghostty's bundled "Midnight Rambler" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Midnight Rambler"
appearance = "dark"

[palette]
bg = "#081a30"
surface = "#061323"
elevated = "#213145"
fg = "#e6f0fa"
fg_muted = "#98a5b3"
accent = "#e4c274"
accent_fg = "#000000"
selection_bg = "#394653"
selection_fg = "#fff8ee"
match_fg = "#cb9eed"
border = "#344558"
separator = "#21314580"
danger = "#ed748d"
warning = "#e4c274"
success = "#7ac9ac"
info = "#77b8f0"
badge_bg = "#213145"
badge_fg = "#e6f0fa"

[states.selected]
bg = "#394653"
fg = "#fff8ee"
[states.hover]
bg = "#213145"
[states.disabled]
fg = "#98a5b3"

[footer]
hint_color = "#98a5b3"
