# Ported from Ghostty's bundled "Django Smooth" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Django Smooth"
appearance = "dark"

[palette]
bg = "#245032"
surface = "#1a3a24"
elevated = "#3a6246"
fg = "#f8f8f8"
fg_muted = "#aebdb3"
accent = "#d0d0cf"
accent_fg = "#000000"
selection_bg = "#336442"
selection_fg = "#f8f8f8"
match_fg = "#ffffff"
border = "#4e725a"
separator = "#3a624680"
danger = "#fd6209"
warning = "#ffe862"
success = "#41a83e"
info = "#989898"
badge_bg = "#3a6246"
badge_fg = "#f8f8f8"

[states.selected]
bg = "#336442"
fg = "#f8f8f8"
[states.hover]
bg = "#3a6246"
[states.disabled]
fg = "#aebdb3"

[footer]
hint_color = "#aebdb3"
