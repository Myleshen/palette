# Ported from Ghostty's bundled "Zacess Deep Contrast Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zacess Deep Contrast Light"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#000000"
fg_muted = "#595959"
accent = "#0d00ff"
accent_fg = "#ffffff"
selection_bg = "#990098"
selection_fg = "#ffffff"
match_fg = "#db009a"
border = "#cccccc"
separator = "#ffffff80"
danger = "#ca0000"
warning = "#ad6500"
success = "#00892e"
info = "#0040ff"
badge_bg = "#ffffff"
badge_fg = "#000000"

[states.selected]
bg = "#990098"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#595959"

[window]
material = "popover"

[footer]
hint_color = "#595959"
