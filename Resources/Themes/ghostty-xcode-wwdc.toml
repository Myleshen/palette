# Ported from Ghostty's bundled "Xcode WWDC" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Xcode WWDC"
appearance = "dark"

[palette]
bg = "#292c36"
surface = "#1e2027"
elevated = "#3e414a"
fg = "#e7e8eb"
fg_muted = "#a4a6ac"
accent = "#8884c5"
accent_fg = "#000000"
selection_bg = "#494d5c"
selection_fg = "#e7e8eb"
match_fg = "#b73999"
border = "#4f525a"
separator = "#3e414a80"
danger = "#bb383a"
warning = "#d28e5d"
success = "#94c66e"
info = "#8884c5"
badge_bg = "#3e414a"
badge_fg = "#e7e8eb"

[states.selected]
bg = "#494d5c"
fg = "#e7e8eb"
[states.hover]
bg = "#3e414a"
[states.disabled]
fg = "#a4a6ac"

[footer]
hint_color = "#a4a6ac"
