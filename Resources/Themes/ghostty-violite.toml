# Ported from Ghostty's bundled "Violite" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Violite"
appearance = "dark"

[palette]
bg = "#241c36"
surface = "#1a1427"
elevated = "#3a334a"
fg = "#eef4f6"
fg_muted = "#a7a8b3"
accent = "#b78fef"
accent_fg = "#000000"
selection_bg = "#49376d"
selection_fg = "#eef4f6"
match_fg = "#ef8fcf"
border = "#4c475c"
separator = "#3a334a80"
danger = "#ec7979"
warning = "#ece279"
success = "#79ecb3"
info = "#a979ec"
badge_bg = "#3a334a"
badge_fg = "#eef4f6"

[states.selected]
bg = "#49376d"
fg = "#eef4f6"
[states.hover]
bg = "#3a334a"
[states.disabled]
fg = "#a7a8b3"

[footer]
hint_color = "#a7a8b3"
