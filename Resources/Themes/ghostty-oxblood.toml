# Ported from Ghostty's bundled "Oxblood" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Oxblood"
appearance = "dark"

[palette]
bg = "#140b0d"
surface = "#0e0809"
elevated = "#2c2325"
fg = "#e8d2d4"
fg_muted = "#9e8c8e"
accent = "#e86b72"
accent_fg = "#000000"
selection_bg = "#3a2227"
selection_fg = "#999395"
match_fg = "#e0556b"
border = "#3e3335"
separator = "#2c232580"
danger = "#ff4d54"
warning = "#e0b24a"
success = "#c9a24a"
info = "#d9743f"
badge_bg = "#2c2325"
badge_fg = "#e8d2d4"

[states.selected]
bg = "#3a2227"
fg = "#999395"
[states.hover]
bg = "#2c2325"
[states.disabled]
fg = "#9e8c8e"

[footer]
hint_color = "#9e8c8e"
