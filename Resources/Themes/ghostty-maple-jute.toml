# Ported from Ghostty's bundled "Maple Jute" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Maple Jute"
appearance = "dark"

[palette]
bg = "#56351f"
surface = "#3e2616"
elevated = "#674935"
fg = "#fbe9d3"
fg_muted = "#c1aa94"
accent = "#c2dafa"
accent_fg = "#000000"
selection_bg = "#8e684a"
selection_fg = "#fff8e8"
match_fg = "#ecc9ec"
border = "#775943"
separator = "#67493580"
danger = "#f5a18d"
warning = "#f2c87c"
success = "#b9d8a1"
info = "#a8c9ec"
badge_bg = "#674935"
badge_fg = "#fbe9d3"

[states.selected]
bg = "#8e684a"
fg = "#fff8e8"
[states.hover]
bg = "#674935"
[states.disabled]
fg = "#c1aa94"

[footer]
hint_color = "#c1aa94"
