# Ported from Ghostty's bundled "cyberpunk-icy" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · cyberpunk-icy"
appearance = "dark"

[palette]
bg = "#0a0a0f"
surface = "#07070b"
elevated = "#232327"
fg = "#d4b3f7"
fg_muted = "#8d78a6"
accent = "#00ffff"
accent_fg = "#000000"
selection_bg = "#004d4d"
selection_fg = "#b1b1b2"
match_fg = "#ff55ff"
border = "#322c3d"
separator = "#23232780"
danger = "#ff0055"
warning = "#fffc00"
success = "#00ff9f"
info = "#7b2fff"
badge_bg = "#232327"
badge_fg = "#d4b3f7"

[states.selected]
bg = "#004d4d"
fg = "#b1b1b2"
[states.hover]
bg = "#232327"
[states.disabled]
fg = "#8d78a6"

[footer]
hint_color = "#8d78a6"
