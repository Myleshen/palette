# Ported from Ghostty's bundled "Raycast Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Raycast Dark"
appearance = "dark"

[palette]
bg = "#1a1a1a"
surface = "#131313"
elevated = "#313131"
fg = "#ffffff"
fg_muted = "#afafaf"
accent = "#56c2ff"
accent_fg = "#000000"
selection_bg = "#333333"
selection_fg = "#9b9b9b"
match_fg = "#cf2f98"
border = "#484848"
separator = "#31313180"
danger = "#ff5360"
warning = "#ffc531"
success = "#59d499"
info = "#56c2ff"
badge_bg = "#313131"
badge_fg = "#ffffff"

[states.selected]
bg = "#333333"
fg = "#9b9b9b"
[states.hover]
bg = "#313131"
[states.disabled]
fg = "#afafaf"

[footer]
hint_color = "#afafaf"
