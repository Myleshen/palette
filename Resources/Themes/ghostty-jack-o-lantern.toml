# Ported from Ghostty's bundled "Jack O' Lantern" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Jack O' Lantern"
appearance = "dark"

[palette]
bg = "#4a1b08"
surface = "#351306"
elevated = "#5c3221"
fg = "#fff0d5"
fg_muted = "#c0a58d"
accent = "#acd5ef"
accent_fg = "#000000"
selection_bg = "#713514"
selection_fg = "#fff7e8"
match_fg = "#e8bad8"
border = "#6e4631"
separator = "#5c322180"
danger = "#ff8b61"
warning = "#f3c969"
success = "#8dcc7a"
info = "#8fc5e8"
badge_bg = "#5c3221"
badge_fg = "#fff0d5"

[states.selected]
bg = "#713514"
fg = "#fff7e8"
[states.hover]
bg = "#5c3221"
[states.disabled]
fg = "#c0a58d"

[footer]
hint_color = "#c0a58d"
