# Ported from Ghostty's bundled "High Desert Snow" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · High Desert Snow"
appearance = "light"

[palette]
bg = "#f9fafb"
surface = "#ededee"
elevated = "#fcfdfd"
fg = "#1f2937"
fg_muted = "#6b727c"
accent = "#2563eb"
accent_fg = "#ffffff"
selection_bg = "#cbd5e1"
selection_fg = "#1f2937"
match_fg = "#9333ea"
border = "#cdd0d4"
separator = "#fcfdfd80"
danger = "#dc2626"
warning = "#ca8a04"
success = "#16a34a"
info = "#2563eb"
badge_bg = "#fcfdfd"
badge_fg = "#1f2937"

[states.selected]
bg = "#cbd5e1"
fg = "#1f2937"
[states.hover]
bg = "#fcfdfd"
[states.disabled]
fg = "#6b727c"

[window]
material = "popover"

[footer]
hint_color = "#6b727c"
