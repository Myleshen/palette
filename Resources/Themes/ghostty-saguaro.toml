# Ported from Ghostty's bundled "Saguaro" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Saguaro"
appearance = "dark"

[palette]
bg = "#001c13"
surface = "#00140e"
elevated = "#1a332b"
fg = "#fff0d5"
fg_muted = "#a6a691"
accent = "#9be1dc"
accent_fg = "#000000"
selection_bg = "#7b3d25"
selection_fg = "#fff4dc"
match_fg = "#f0a6c5"
border = "#33463a"
separator = "#1a332b80"
danger = "#f08a68"
warning = "#f2c85f"
success = "#82d49d"
info = "#72d2ce"
badge_bg = "#1a332b"
badge_fg = "#fff0d5"

[states.selected]
bg = "#7b3d25"
fg = "#fff4dc"
[states.hover]
bg = "#1a332b"
[states.disabled]
fg = "#a6a691"

[footer]
hint_color = "#a6a691"
