# Ported from Ghostty's bundled "X London" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · X London"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#333333"
fg_muted = "#7a7a7a"
accent = "#666666"
accent_fg = "#ffffff"
selection_bg = "#333333"
selection_fg = "#ffffff"
match_fg = "#777777"
border = "#d6d6d6"
separator = "#ffffff80"
danger = "#333333"
warning = "#555555"
success = "#444444"
info = "#666666"
badge_bg = "#ffffff"
badge_fg = "#333333"

[states.selected]
bg = "#333333"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#7a7a7a"

[window]
material = "popover"

[footer]
hint_color = "#7a7a7a"
