# Ported from Ghostty's bundled "Abernathy" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Abernathy"
appearance = "dark"

[palette]
bg = "#111416"
surface = "#0c0e10"
elevated = "#292c2d"
fg = "#eeeeec"
fg_muted = "#a1a2a1"
accent = "#11b5f6"
accent_fg = "#000000"
selection_bg = "#eeeeec"
selection_fg = "#333333"
match_fg = "#ff00ff"
border = "#3d4041"
separator = "#292c2d80"
danger = "#cd0000"
warning = "#cdcd00"
success = "#00cd00"
info = "#1093f5"
badge_bg = "#292c2d"
badge_fg = "#eeeeec"

[states.selected]
bg = "#eeeeec"
fg = "#333333"
[states.hover]
bg = "#292c2d"
[states.disabled]
fg = "#a1a2a1"

[footer]
hint_color = "#a1a2a1"
