# Ported from Ghostty's bundled "X Madrid" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · X Madrid"
appearance = "light"

[palette]
bg = "#fafafa"
surface = "#ededed"
elevated = "#fdfdfd"
fg = "#1a1a1a"
fg_muted = "#686868"
accent = "#007497"
accent_fg = "#ffffff"
selection_bg = "#1a1a1a"
selection_fg = "#fafafa"
match_fg = "#4d2699"
border = "#cdcdcd"
separator = "#fdfdfd80"
danger = "#990026"
warning = "#8a6408"
success = "#007a28"
info = "#007a9e"
badge_bg = "#fdfdfd"
badge_fg = "#1a1a1a"

[states.selected]
bg = "#1a1a1a"
fg = "#fafafa"
[states.hover]
bg = "#fdfdfd"
[states.disabled]
fg = "#686868"

[window]
material = "popover"

[footer]
hint_color = "#686868"
