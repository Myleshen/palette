# Ported from Ghostty's bundled "Cyberpunk" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Cyberpunk"
appearance = "dark"

[palette]
bg = "#332a57"
surface = "#251e3f"
elevated = "#473f68"
fg = "#e5e5e5"
fg_muted = "#a7a4b3"
accent = "#1bccfd"
accent_fg = "#000000"
selection_bg = "#c1deff"
selection_fg = "#000000"
match_fg = "#e6aefe"
border = "#574f73"
separator = "#473f6880"
danger = "#ff7092"
warning = "#fffa6a"
success = "#00fbac"
info = "#00bfff"
badge_bg = "#473f68"
badge_fg = "#e5e5e5"

[states.selected]
bg = "#c1deff"
fg = "#000000"
[states.hover]
bg = "#473f68"
[states.disabled]
fg = "#a7a4b3"

[footer]
hint_color = "#a7a4b3"
