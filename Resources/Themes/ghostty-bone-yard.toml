# Ported from Ghostty's bundled "Bone Yard" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Bone Yard"
appearance = "light"

[palette]
bg = "#ead9b8"
surface = "#deceaf"
elevated = "#f6eedf"
fg = "#51463b"
fg_muted = "#877967"
accent = "#24150e"
accent_fg = "#ffffff"
selection_bg = "#f6eedf"
selection_fg = "#24150e"
match_fg = "#4f394c"
border = "#cbbc9f"
separator = "#f6eedf80"
danger = "#8b342c"
warning = "#6c571f"
success = "#44583b"
info = "#374f60"
badge_bg = "#f6eedf"
badge_fg = "#51463b"

[states.selected]
bg = "#f6eedf"
fg = "#24150e"
[states.hover]
bg = "#f6eedf"
[states.disabled]
fg = "#877967"

[window]
material = "popover"

[footer]
hint_color = "#877967"
