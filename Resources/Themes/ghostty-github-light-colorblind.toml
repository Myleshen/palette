# Ported from Ghostty's bundled "GitHub Light Colorblind" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · GitHub Light Colorblind"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#24292f"
fg_muted = "#717478"
accent = "#0969da"
accent_fg = "#ffffff"
selection_bg = "#24292f"
selection_fg = "#ffffff"
match_fg = "#8250df"
border = "#d3d4d5"
separator = "#ffffff80"
danger = "#b35900"
warning = "#4d2d00"
success = "#0550ae"
info = "#0969da"
badge_bg = "#ffffff"
badge_fg = "#24292f"

[states.selected]
bg = "#24292f"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#717478"

[window]
material = "popover"

[footer]
hint_color = "#717478"
