# Ported from Ghostty's bundled "Porcelain" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Porcelain"
appearance = "light"

[palette]
bg = "#fbfbfd"
surface = "#eeeef0"
elevated = "#fdfdfe"
fg = "#2a2e37"
fg_muted = "#72747a"
accent = "#004cc8"
accent_fg = "#ffffff"
selection_bg = "#dce6f7"
selection_fg = "#616163"
match_fg = "#761bc3"
border = "#d1d2d5"
separator = "#fdfdfe80"
danger = "#c60018"
warning = "#855700"
success = "#157424"
info = "#004cc8"
badge_bg = "#fdfdfe"
badge_fg = "#2a2e37"

[states.selected]
bg = "#dce6f7"
fg = "#616163"
[states.hover]
bg = "#fdfdfe"
[states.disabled]
fg = "#73767c"

[window]
material = "popover"

[footer]
hint_color = "#73767c"
