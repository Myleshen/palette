# Ported from Ghostty's bundled "Purple Rain" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Purple Rain"
appearance = "dark"

[palette]
bg = "#21084a"
surface = "#180635"
elevated = "#37215c"
fg = "#fffbf6"
fg_muted = "#b1a6ba"
accent = "#00a6ff"
accent_fg = "#000000"
selection_bg = "#287691"
selection_fg = "#ffffff"
match_fg = "#ac7bf0"
border = "#4d396c"
separator = "#37215c80"
danger = "#ff260e"
warning = "#ffc400"
success = "#9be205"
info = "#00a2fa"
badge_bg = "#37215c"
badge_fg = "#fffbf6"

[states.selected]
bg = "#287691"
fg = "#ffffff"
[states.hover]
bg = "#37215c"
[states.disabled]
fg = "#b1a6ba"

[footer]
hint_color = "#b1a6ba"
