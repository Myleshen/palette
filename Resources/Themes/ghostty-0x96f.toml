# Ported from Ghostty's bundled "0x96f" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · 0x96f"
appearance = "dark"

[palette]
bg = "#262427"
surface = "#1b1a1c"
elevated = "#3c3a3d"
fg = "#fcfcfa"
fg_muted = "#b1b0b0"
accent = "#1bd5eb"
accent_fg = "#000000"
selection_bg = "#fcfcfa"
selection_fg = "#262427"
match_fg = "#b0a3eb"
border = "#514f51"
separator = "#3c3a3d80"
danger = "#ff666d"
warning = "#ffc739"
success = "#b3e03a"
info = "#00cde8"
badge_bg = "#3c3a3d"
badge_fg = "#fcfcfa"

[states.selected]
bg = "#fcfcfa"
fg = "#262427"
[states.hover]
bg = "#3c3a3d"
[states.disabled]
fg = "#b1b0b0"

[footer]
hint_color = "#b1b0b0"
