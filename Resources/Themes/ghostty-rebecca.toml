# Ported from Ghostty's bundled "Rebecca" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rebecca"
appearance = "dark"

[palette]
bg = "#292a44"
surface = "#1e1e31"
elevated = "#3e3f57"
fg = "#e8e6ed"
fg_muted = "#a5a4b2"
accent = "#69c0fa"
accent_fg = "#000000"
selection_bg = "#663399"
selection_fg = "#f4f2f9"
match_fg = "#bf9cf9"
border = "#4f5066"
separator = "#3e3f5780"
danger = "#dd7755"
warning = "#f2e7b7"
success = "#04dbb5"
info = "#7aa5ff"
badge_bg = "#3e3f57"
badge_fg = "#e8e6ed"

[states.selected]
bg = "#663399"
fg = "#f4f2f9"
[states.hover]
bg = "#3e3f57"
[states.disabled]
fg = "#a5a4b2"

[footer]
hint_color = "#a5a4b2"
