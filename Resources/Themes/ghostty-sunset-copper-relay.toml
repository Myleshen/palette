# Ported from Ghostty's bundled "Sunset Copper Relay" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sunset Copper Relay"
appearance = "dark"

[palette]
bg = "#211c1b"
surface = "#181413"
elevated = "#373332"
fg = "#e9ddcf"
fg_muted = "#a39990"
accent = "#b2d5ed"
accent_fg = "#000000"
selection_bg = "#e9ddcf"
selection_fg = "#211c1b"
match_fg = "#e1c3ed"
border = "#49433f"
separator = "#37333280"
danger = "#e78c80"
warning = "#e8c07c"
success = "#a5c994"
info = "#91bbd9"
badge_bg = "#373332"
badge_fg = "#e9ddcf"

[states.selected]
bg = "#e9ddcf"
fg = "#211c1b"
[states.hover]
bg = "#373332"
[states.disabled]
fg = "#a39990"

[footer]
hint_color = "#a39990"
