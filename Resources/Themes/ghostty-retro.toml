# Ported from Ghostty's bundled "Retro" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Retro"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#13a10e"
fg_muted = "#0c6909"
accent = "#16ba10"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#000000"
match_fg = "#16ba10"
border = "#042003"
separator = "#1a1a1a80"
danger = "#13a10e"
warning = "#13a10e"
success = "#13a10e"
info = "#13a10e"
badge_bg = "#1a1a1a"
badge_fg = "#13a10e"

[states.selected]
bg = "#ffffff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#0c6909"

[footer]
hint_color = "#0c6909"
