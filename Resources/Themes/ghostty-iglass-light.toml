# Ported from Ghostty's bundled "iglass Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · iglass Light"
appearance = "light"

[palette]
bg = "#f5f5f7"
surface = "#e9e9eb"
elevated = "#fbfbfb"
fg = "#1d1d1f"
fg_muted = "#69696b"
accent = "#0035bb"
accent_fg = "#ffffff"
selection_bg = "#bad7f9"
selection_fg = "#1d1d1f"
match_fg = "#6a238a"
border = "#cacacc"
separator = "#fbfbfb80"
danger = "#92000b"
warning = "#763200"
success = "#00521b"
info = "#0035bb"
badge_bg = "#fbfbfb"
badge_fg = "#1d1d1f"

[states.selected]
bg = "#bad7f9"
fg = "#1d1d1f"
[states.hover]
bg = "#fbfbfb"
[states.disabled]
fg = "#69696b"

[window]
material = "popover"

[footer]
hint_color = "#69696b"
