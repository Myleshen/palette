# Ported from Ghostty's bundled "GitHub Light High Contrast" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · GitHub Light High Contrast"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#0e1116"
fg_muted = "#626468"
accent = "#0349b4"
accent_fg = "#ffffff"
selection_bg = "#0e1116"
selection_fg = "#ffffff"
match_fg = "#622cbc"
border = "#cfcfd0"
separator = "#ffffff80"
danger = "#a0111f"
warning = "#3f2200"
success = "#024c1a"
info = "#0349b4"
badge_bg = "#ffffff"
badge_fg = "#0e1116"

[states.selected]
bg = "#0e1116"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#626468"

[window]
material = "popover"

[footer]
hint_color = "#626468"
