# Ported from Ghostty's bundled "Modus Vivendi" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Modus Vivendi"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#79a8ff"
accent_fg = "#000000"
selection_bg = "#5a5a5a"
selection_fg = "#ffffff"
match_fg = "#feacd0"
border = "#333333"
separator = "#1a1a1a80"
danger = "#ff5f59"
warning = "#d0bc00"
success = "#44bc44"
info = "#2fafff"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#5a5a5a"
fg = "#ffffff"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
