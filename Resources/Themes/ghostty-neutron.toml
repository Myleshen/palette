# Ported from Ghostty's bundled "Neutron" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Neutron"
appearance = "dark"

[palette]
bg = "#1c1e22"
surface = "#141618"
elevated = "#333438"
fg = "#e6e8ef"
fg_muted = "#9fa1a7"
accent = "#6a7c93"
accent_fg = "#000000"
selection_bg = "#2f363e"
selection_fg = "#92a1b3"
match_fg = "#a4799d"
border = "#44464b"
separator = "#33343880"
danger = "#b54036"
warning = "#deb566"
success = "#5ab977"
info = "#6a7c93"
badge_bg = "#333438"
badge_fg = "#e6e8ef"

[states.selected]
bg = "#2f363e"
fg = "#92a1b3"
[states.hover]
bg = "#333438"
[states.disabled]
fg = "#9fa1a7"

[footer]
hint_color = "#9fa1a7"
