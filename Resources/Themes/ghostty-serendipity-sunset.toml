# Ported from Ghostty's bundled "Serendipity Sunset" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Serendipity Sunset"
appearance = "dark"

[palette]
bg = "#202231"
surface = "#171823"
elevated = "#363846"
fg = "#dee0ef"
fg_muted = "#9c9eac"
accent = "#a0b6e8"
accent_fg = "#000000"
selection_bg = "#6b6d7c"
selection_fg = "#eff0f7"
match_fg = "#aac9d4"
border = "#464857"
separator = "#36384680"
danger = "#d1918f"
warning = "#a392dc"
success = "#709bbd"
info = "#a0b6e8"
badge_bg = "#363846"
badge_fg = "#dee0ef"

[states.selected]
bg = "#6b6d7c"
fg = "#eff0f7"
[states.hover]
bg = "#363846"
[states.disabled]
fg = "#9c9eac"

[footer]
hint_color = "#9c9eac"
