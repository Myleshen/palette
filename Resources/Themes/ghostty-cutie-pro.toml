# Ported from Ghostty's bundled "Cutie Pro" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Cutie Pro"
appearance = "dark"

[palette]
bg = "#181818"
surface = "#111111"
elevated = "#2f2f2f"
fg = "#d5d0c9"
fg_muted = "#93908b"
accent = "#42d9c5"
accent_fg = "#000000"
selection_bg = "#363636"
selection_fg = "#d5d0c9"
match_fg = "#b294bb"
border = "#3e3d3b"
separator = "#2f2f2f80"
danger = "#f56e7f"
warning = "#f58669"
success = "#bec975"
info = "#42d9c5"
badge_bg = "#2f2f2f"
badge_fg = "#d5d0c9"

[states.selected]
bg = "#363636"
fg = "#d5d0c9"
[states.hover]
bg = "#2f2f2f"
[states.disabled]
fg = "#93908b"

[footer]
hint_color = "#93908b"
