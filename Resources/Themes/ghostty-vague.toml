# Ported from Ghostty's bundled "Vague" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Vague"
appearance = "dark"

[palette]
bg = "#141415"
surface = "#0e0e0f"
elevated = "#2c2c2c"
fg = "#cdcdcd"
fg_muted = "#8c8c8d"
accent = "#8ba9c1"
accent_fg = "#000000"
selection_bg = "#252530"
selection_fg = "#cdcdcd"
match_fg = "#c9b1ca"
border = "#39393a"
separator = "#2c2c2c80"
danger = "#d8647e"
warning = "#f3be7c"
success = "#7fa563"
info = "#6e94b2"
badge_bg = "#2c2c2c"
badge_fg = "#cdcdcd"

[states.selected]
bg = "#252530"
fg = "#cdcdcd"
[states.hover]
bg = "#2c2c2c"
[states.disabled]
fg = "#8c8c8d"

[footer]
hint_color = "#8c8c8d"
