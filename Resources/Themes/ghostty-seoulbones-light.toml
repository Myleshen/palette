# Ported from Ghostty's bundled "Seoulbones Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
name = "Ghostty · Seoulbones Light"
appearance = "light"

[palette]
bg = "#e2e2e2"
surface = "#d7d7d7"
elevated = "#f2f2f2"
fg = "#494848"
fg_muted = "#656564"
accent = "#00667f"
accent_fg = "#ffffff"
selection_bg = "#cccccc"
selection_fg = "#555555"
match_fg = "#7f4c7e"
border = "#c6c6c6"
separator = "#f2f2f280"
danger = "#d94f82"
warning = "#b07250"
success = "#628562"
info = "#0084a3"
badge_bg = "#f2f2f2"
badge_fg = "#555555"

[states.selected]
bg = "#cccccc"
fg = "#555555"
[states.hover]
bg = "#f2f2f2"
[states.disabled]
fg = "#808080"

[window]
material = "popover"

[footer]
hint_color = "#808080"
