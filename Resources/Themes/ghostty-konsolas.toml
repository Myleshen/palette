# Ported from Ghostty's bundled "Konsolas" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Konsolas"
appearance = "dark"

[palette]
bg = "#060606"
surface = "#040404"
elevated = "#1f1f1f"
fg = "#c8c1c1"
fg_muted = "#848080"
accent = "#6779ff"
accent_fg = "#201f1f"
selection_bg = "#1f1f1f"
selection_fg = "#c8c1c1"
match_fg = "#ff54ff"
border = "#2d2b2b"
separator = "#1f1f1f80"
danger = "#b2211e"
warning = "#ebae1f"
success = "#18b218"
info = "#3c4dcd"
badge_bg = "#1f1f1f"
badge_fg = "#c8c1c1"

[states.selected]
bg = "#1f1f1f"
fg = "#c8c1c1"
[states.hover]
bg = "#1f1f1f"
[states.disabled]
fg = "#848080"

[footer]
hint_color = "#848080"
