# Ported from Omarchy's bundled "Tokyo Night" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/tokyo-night/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Omarchy · Tokyo Night"
appearance = "dark"

[palette]
bg = "#1a1b26"
surface = "#13131b"
elevated = "#31323c"
fg = "#a9b1d6"
fg_muted = "#7c829e"
accent = "#7aa2f7"
accent_fg = "#000000"
selection_bg = "#7aa2f7"
selection_fg = "#373945"
match_fg = "#bb9af7"
border = "#373949"
separator = "#31323c80"
danger = "#f7768e"
warning = "#e0af68"
success = "#9ece6a"
info = "#7aa2f7"
badge_bg = "#31323c"
badge_fg = "#a9b1d6"

[states.selected]
bg = "#7aa2f7"
fg = "#373945"
[states.hover]
bg = "#31323c"
[states.disabled]
fg = "#777c98"

[footer]
hint_color = "#777c98"
