# Ported from Ghostty's bundled "Puppet's Master" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Puppet's Master"
appearance = "dark"

[palette]
bg = "#25150e"
surface = "#1b0f0a"
elevated = "#3b2c26"
fg = "#f5e6d5"
fg_muted = "#ac9d8f"
accent = "#a9c4e9"
accent_fg = "#000000"
selection_bg = "#583022"
selection_fg = "#fff6e7"
match_fg = "#d7b3dd"
border = "#4f3f36"
separator = "#3b2c2680"
danger = "#e9785e"
warning = "#e5b65c"
success = "#a4bc75"
info = "#8daee0"
badge_bg = "#3b2c26"
badge_fg = "#f5e6d5"

[states.selected]
bg = "#583022"
fg = "#fff6e7"
[states.hover]
bg = "#3b2c26"
[states.disabled]
fg = "#ac9d8f"

[footer]
hint_color = "#ac9d8f"
