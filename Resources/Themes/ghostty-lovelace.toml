# Ported from Ghostty's bundled "Lovelace" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lovelace"
appearance = "dark"

[palette]
bg = "#1d1f28"
surface = "#15161d"
elevated = "#34353e"
fg = "#fdfdfd"
fg_muted = "#afafb2"
accent = "#8897f4"
accent_fg = "#000000"
selection_bg = "#c1deff"
selection_fg = "#000000"
match_fg = "#c574dd"
border = "#4a4b53"
separator = "#34353e80"
danger = "#f37f97"
warning = "#f2a272"
success = "#5adecd"
info = "#8897f4"
badge_bg = "#34353e"
badge_fg = "#fdfdfd"

[states.selected]
bg = "#c1deff"
fg = "#000000"
[states.hover]
bg = "#34353e"
[states.disabled]
fg = "#afafb2"

[footer]
hint_color = "#afafb2"
