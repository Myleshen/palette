# Ported from Ghostty's bundled "Coffee Theme" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Coffee Theme"
appearance = "light"

[palette]
bg = "#f5deb3"
surface = "#e9d3aa"
elevated = "#fbf0dd"
fg = "#000000"
fg_muted = "#564e3f"
accent = "#0225c7"
accent_fg = "#ffffff"
selection_bg = "#fbf0dd"
selection_fg = "#000000"
match_fg = "#ca30c7"
border = "#c4b28f"
separator = "#fbf0dd80"
danger = "#c91b00"
warning = "#adaa00"
success = "#00c200"
info = "#0225c7"
badge_bg = "#fbf0dd"
badge_fg = "#000000"

[states.selected]
bg = "#fbf0dd"
fg = "#000000"
[states.hover]
bg = "#fbf0dd"
[states.disabled]
fg = "#564e3f"

[window]
material = "popover"

[footer]
hint_color = "#564e3f"
