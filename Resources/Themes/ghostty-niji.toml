# Ported from Ghostty's bundled "Niji" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Niji"
appearance = "dark"

[palette]
bg = "#141515"
surface = "#0e0f0f"
elevated = "#2c2c2c"
fg = "#ffffff"
fg_muted = "#adadad"
accent = "#8efff3"
accent_fg = "#000000"
selection_bg = "#515151"
selection_fg = "#ffc663"
match_fg = "#ffa2ed"
border = "#434444"
separator = "#2c2c2c80"
danger = "#d23e08"
warning = "#fff700"
success = "#54ca74"
info = "#2ab9ff"
badge_bg = "#2c2c2c"
badge_fg = "#ffffff"

[states.selected]
bg = "#515151"
fg = "#ffc663"
[states.hover]
bg = "#2c2c2c"
[states.disabled]
fg = "#adadad"

[footer]
hint_color = "#adadad"
