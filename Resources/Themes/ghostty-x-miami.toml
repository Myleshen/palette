# Ported from Ghostty's bundled "X Miami" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · X Miami"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#f7f1ff"
fg_muted = "#a19da6"
accent = "#00ffa8"
accent_fg = "#000000"
selection_bg = "#f7f1ff"
selection_fg = "#000000"
match_fg = "#d36cff"
border = "#313033"
separator = "#1a1a1a80"
danger = "#ff4c8b"
warning = "#ffd84c"
success = "#7fffd4"
info = "#00ffa8"
badge_bg = "#1a1a1a"
badge_fg = "#f7f1ff"

[states.selected]
bg = "#f7f1ff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a19da6"

[footer]
hint_color = "#a19da6"
