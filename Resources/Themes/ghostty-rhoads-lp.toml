# Ported from Ghostty's bundled "Rhoads LP" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Rhoads LP"
appearance = "light"

[palette]
bg = "#fdf7e8"
surface = "#f0ebdc"
elevated = "#fefbf5"
fg = "#2b2618"
fg_muted = "#746f61"
accent = "#4567bb"
accent_fg = "#ebebeb"
selection_bg = "#e0c878"
selection_fg = "#665119"
match_fg = "#a678d6"
border = "#d3cdbe"
separator = "#fefbf580"
danger = "#c5423a"
warning = "#aa8d1d"
success = "#5f8f4f"
info = "#5b7fd6"
badge_bg = "#fefbf5"
badge_fg = "#2b2618"

[states.selected]
bg = "#e0c878"
fg = "#665119"
[states.hover]
bg = "#fefbf5"
[states.disabled]
fg = "#746f61"

[window]
material = "popover"

[footer]
hint_color = "#746f61"
