# Ported from Ghostty's bundled "Rainbows and Unicorns Arcade" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Rainbows and Unicorns Arcade"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ededed"
fg_muted = "#9a9a9a"
accent = "#39ff14"
accent_fg = "#000000"
selection_bg = "#39ff14"
selection_fg = "#000000"
match_fg = "#ff7df5"
border = "#2f2f2f"
separator = "#1a1a1a80"
danger = "#ff2a4d"
warning = "#fff01f"
success = "#39ff14"
info = "#1f8bff"
badge_bg = "#1a1a1a"
badge_fg = "#ededed"

[states.selected]
bg = "#39ff14"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#9a9a9a"

[footer]
hint_color = "#9a9a9a"
