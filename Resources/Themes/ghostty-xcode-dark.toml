# Ported from Ghostty's bundled "Xcode Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Xcode Dark"
appearance = "dark"

[palette]
bg = "#292a30"
surface = "#1e1e23"
elevated = "#3e3f45"
fg = "#dfdfe0"
fg_muted = "#9fa0a2"
accent = "#6bdfff"
accent_fg = "#000000"
selection_bg = "#414453"
selection_fg = "#dfdfe0"
match_fg = "#ff7ab2"
border = "#4d4e53"
separator = "#3e3f4580"
danger = "#ff8170"
warning = "#d9c97c"
success = "#78c2b3"
info = "#4eb0cc"
badge_bg = "#3e3f45"
badge_fg = "#dfdfe0"

[states.selected]
bg = "#414453"
fg = "#dfdfe0"
[states.hover]
bg = "#3e3f45"
[states.disabled]
fg = "#9fa0a2"

[footer]
hint_color = "#9fa0a2"
