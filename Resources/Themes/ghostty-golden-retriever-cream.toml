# Ported from Ghostty's bundled "Golden Retriever Cream" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Golden Retriever Cream"
appearance = "light"

[palette]
bg = "#faf7f2"
surface = "#edebe6"
elevated = "#fdfbf9"
fg = "#3a2f24"
fg_muted = "#7d756c"
accent = "#5b8fd9"
accent_fg = "#000000"
selection_bg = "#e8d9c4"
selection_fg = "#3a2f24"
match_fg = "#c77dbb"
border = "#d4cfc9"
separator = "#fdfbf980"
danger = "#df6a5b"
warning = "#d79b32"
success = "#70ad72"
info = "#5b8fd9"
badge_bg = "#fdfbf9"
badge_fg = "#3a2f24"

[states.selected]
bg = "#e8d9c4"
fg = "#3a2f24"
[states.hover]
bg = "#fdfbf9"
[states.disabled]
fg = "#7d756c"

[window]
material = "popover"

[footer]
hint_color = "#7d756c"
