# Ported from Ghostty's bundled "Arthur" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Arthur"
appearance = "dark"

[palette]
bg = "#1c1c1c"
surface = "#141414"
elevated = "#333333"
fg = "#ddeedd"
fg_muted = "#99a499"
accent = "#87ceeb"
accent_fg = "#000000"
selection_bg = "#4d4d4d"
selection_fg = "#ffffff"
match_fg = "#deb887"
border = "#434643"
separator = "#33333380"
danger = "#cd5c5c"
warning = "#e8ae5b"
success = "#86af80"
info = "#6495ed"
badge_bg = "#333333"
badge_fg = "#ddeedd"

[states.selected]
bg = "#4d4d4d"
fg = "#ffffff"
[states.hover]
bg = "#333333"
[states.disabled]
fg = "#99a499"

[footer]
hint_color = "#99a499"
