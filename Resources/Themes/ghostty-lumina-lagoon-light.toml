# Ported from Ghostty's bundled "Lumina Lagoon Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Lagoon Light"
appearance = "light"

[palette]
bg = "#e9fafa"
surface = "#ddeded"
elevated = "#f5fdfd"
fg = "#0b323b"
fg_muted = "#59787e"
accent = "#154986"
accent_fg = "#ffffff"
selection_bg = "#afd3d7"
selection_fg = "#0b323b"
match_fg = "#72366e"
border = "#bdd2d4"
separator = "#f5fdfd80"
danger = "#8f2121"
warning = "#a1600d"
success = "#2e6147"
info = "#185ca9"
badge_bg = "#f5fdfd"
badge_fg = "#0b323b"

[states.selected]
bg = "#afd3d7"
fg = "#0b323b"
[states.hover]
bg = "#f5fdfd"
[states.disabled]
fg = "#59787e"

[window]
material = "popover"

[footer]
hint_color = "#59787e"
