# Ported from Ghostty's bundled "Monokai Pro Machine" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Monokai Pro Machine"
appearance = "dark"

[palette]
bg = "#273136"
surface = "#1c2327"
elevated = "#3d464a"
fg = "#f2fffc"
fg_muted = "#abb7b7"
accent = "#ffb270"
accent_fg = "#000000"
selection_bg = "#545f62"
selection_fg = "#f2fffc"
match_fg = "#baa0f8"
border = "#505a5e"
separator = "#3d464a80"
danger = "#ff6d7e"
warning = "#ffed72"
success = "#a2e57b"
info = "#ffb270"
badge_bg = "#3d464a"
badge_fg = "#f2fffc"

[states.selected]
bg = "#545f62"
fg = "#f2fffc"
[states.hover]
bg = "#3d464a"
[states.disabled]
fg = "#abb7b7"

[footer]
hint_color = "#abb7b7"
