# Ported from Ghostty's bundled "Shades Of Purple" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Shades Of Purple"
appearance = "dark"

[palette]
bg = "#1e1d40"
surface = "#16152e"
elevated = "#343453"
fg = "#ffffff"
fg_muted = "#b0b0bc"
accent = "#fad000"
accent_fg = "#000000"
selection_bg = "#b362ff"
selection_fg = "#1f1f1f"
match_fg = "#ff77ff"
border = "#4b4a66"
separator = "#34345380"
danger = "#d90429"
warning = "#ffe700"
success = "#3ad900"
info = "#6a46ff"
badge_bg = "#343453"
badge_fg = "#ffffff"

[states.selected]
bg = "#b362ff"
fg = "#1f1f1f"
[states.hover]
bg = "#343453"
[states.disabled]
fg = "#b0b0bc"

[footer]
hint_color = "#b0b0bc"
