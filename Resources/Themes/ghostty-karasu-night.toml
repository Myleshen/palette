# Ported from Ghostty's bundled "Karasu Night" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Karasu Night"
appearance = "dark"

[palette]
bg = "#0a0a0a"
surface = "#070707"
elevated = "#232323"
fg = "#e7e5e4"
fg_muted = "#9a9898"
accent = "#8cb4e2"
accent_fg = "#000000"
selection_bg = "#262626"
selection_fg = "#e7e5e4"
match_fg = "#c7b3ee"
border = "#363636"
separator = "#23232380"
danger = "#e06c75"
warning = "#d4b86a"
success = "#8fbf7a"
info = "#7aa2c8"
badge_bg = "#232323"
badge_fg = "#e7e5e4"

[states.selected]
bg = "#262626"
fg = "#e7e5e4"
[states.hover]
bg = "#232323"
[states.disabled]
fg = "#9a9898"

[footer]
hint_color = "#9a9898"
