# Ported from Ghostty's bundled "Flat" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Flat"
appearance = "dark"

[palette]
bg = "#002240"
surface = "#00182e"
elevated = "#1a3853"
fg = "#2cc55d"
fg_muted = "#1d8c53"
accent = "#e5be0c"
accent_fg = "#000000"
selection_bg = "#792b9c"
selection_fg = "#ffffff"
match_fg = "#8230a7"
border = "#094346"
separator = "#1a385380"
danger = "#a82320"
warning = "#e58d11"
success = "#32a548"
info = "#3167ac"
badge_bg = "#1a3853"
badge_fg = "#2cc55d"

[states.selected]
bg = "#792b9c"
fg = "#ffffff"
[states.hover]
bg = "#1a3853"
[states.disabled]
fg = "#1d8c53"

[footer]
hint_color = "#1d8c53"
