# Ported from Ghostty's bundled "Apple Classic" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: badge_fg was corrected to reach 4.5:1 against the badge background.
name = "Ghostty · Apple Classic"
appearance = "dark"

[palette]
bg = "#2c2b2b"
surface = "#201f1f"
elevated = "#414040"
fg = "#e3af24"
fg_muted = "#b08d2f"
accent = "#97a6ff"
accent_fg = "#000000"
selection_bg = "#6b5b02"
selection_fg = "#98ea52"
match_fg = "#ff77ff"
border = "#4e4322"
separator = "#41404080"
danger = "#db321b"
warning = "#c7c400"
success = "#00c200"
info = "#3666ff"
badge_bg = "#414040"
badge_fg = "#d7a60a"

[states.selected]
bg = "#6b5b02"
fg = "#98ea52"
[states.hover]
bg = "#414040"
[states.disabled]
fg = "#9a780f"

[footer]
hint_color = "#9a780f"
