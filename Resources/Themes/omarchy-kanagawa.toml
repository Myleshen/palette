# Ported from Omarchy's bundled "Kanagawa" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/kanagawa/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Kanagawa"
appearance = "dark"

[palette]
bg = "#1f1f28"
surface = "#16161d"
elevated = "#35353e"
fg = "#dcd7ba"
fg_muted = "#9a9787"
accent = "#7f9eda"
accent_fg = "#000000"
selection_bg = "#2d4f67"
selection_fg = "#c8c093"
match_fg = "#938aa9"
border = "#454445"
separator = "#35353e80"
danger = "#c34043"
warning = "#c0a36e"
success = "#76946a"
info = "#7e9cd8"
badge_bg = "#35353e"
badge_fg = "#dcd7ba"

[states.selected]
bg = "#2d4f67"
fg = "#c8c093"
[states.hover]
bg = "#35353e"
[states.disabled]
fg = "#9a9787"

[footer]
hint_color = "#9a9787"
