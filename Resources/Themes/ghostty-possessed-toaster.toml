# Ported from Ghostty's bundled "Possessed Toaster" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Possessed Toaster"
appearance = "dark"

[palette]
bg = "#0e0f0d"
surface = "#0a0b09"
elevated = "#262725"
fg = "#e8dcc0"
fg_muted = "#9c9481"
accent = "#f4ca4d"
accent_fg = "#000000"
selection_bg = "#3a3f3a"
selection_fg = "#fff5da"
match_fg = "#c084fc"
border = "#3a3831"
separator = "#26272580"
danger = "#e0503b"
warning = "#e0a62e"
success = "#6aa84f"
info = "#3d9aff"
badge_bg = "#262725"
badge_fg = "#e8dcc0"

[states.selected]
bg = "#3a3f3a"
fg = "#fff5da"
[states.hover]
bg = "#262725"
[states.disabled]
fg = "#9c9481"

[footer]
hint_color = "#9c9481"
