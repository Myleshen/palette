# Ported from Ghostty's bundled "Monokai Pro Ristretto" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Monokai Pro Ristretto"
appearance = "dark"

[palette]
bg = "#2c2525"
surface = "#201b1b"
elevated = "#413b3b"
fg = "#fff1f3"
fg_muted = "#b5aaab"
accent = "#f38d70"
accent_fg = "#000000"
selection_bg = "#5b5353"
selection_fg = "#fff1f3"
match_fg = "#a8a9eb"
border = "#564e4e"
separator = "#413b3b80"
danger = "#fd6883"
warning = "#f9cc6c"
success = "#adda78"
info = "#f38d70"
badge_bg = "#413b3b"
badge_fg = "#fff1f3"

[states.selected]
bg = "#5b5353"
fg = "#fff1f3"
[states.hover]
bg = "#413b3b"
[states.disabled]
fg = "#b5aaab"

[footer]
hint_color = "#b5aaab"
