# Ported from Ghostty's bundled "Lumina Canopy Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Canopy Dark"
appearance = "dark"

[palette]
bg = "#0c1b10"
surface = "#09130c"
elevated = "#243228"
fg = "#d8e3d6"
fg_muted = "#919d91"
accent = "#c0e3ff"
accent_fg = "#000000"
selection_bg = "#403e24"
selection_fg = "#d8e3d6"
match_fg = "#fdc5f8"
border = "#354338"
separator = "#24322880"
danger = "#d57068"
warning = "#d1cca8"
success = "#99d0a4"
info = "#9acaf1"
badge_bg = "#243228"
badge_fg = "#d8e3d6"

[states.selected]
bg = "#403e24"
fg = "#d8e3d6"
[states.hover]
bg = "#243228"
[states.disabled]
fg = "#919d91"

[footer]
hint_color = "#919d91"
