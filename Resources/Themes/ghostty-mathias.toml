# Ported from Ghostty's bundled "Mathias" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Mathias"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#bbbbbb"
fg_muted = "#7a7a7a"
accent = "#c48dff"
accent_fg = "#000000"
selection_bg = "#555555"
selection_fg = "#f2f2f2"
match_fg = "#ff55ff"
border = "#252525"
separator = "#1a1a1a80"
danger = "#e52222"
warning = "#fc951e"
success = "#a6e32d"
info = "#c48dff"
badge_bg = "#1a1a1a"
badge_fg = "#bbbbbb"

[states.selected]
bg = "#555555"
fg = "#f2f2f2"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#7a7a7a"

[footer]
hint_color = "#7a7a7a"
