# Ported from Ghostty's bundled "Driftwood" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Driftwood"
appearance = "dark"

[palette]
bg = "#2a2622"
surface = "#1e1b18"
elevated = "#3f3c38"
fg = "#e6ddd0"
fg_muted = "#a49d93"
accent = "#92c6c7"
accent_fg = "#000000"
selection_bg = "#39332b"
selection_fg = "#9e9b99"
match_fg = "#dab6d1"
border = "#504b45"
separator = "#3f3c3880"
danger = "#e77467"
warning = "#e1b869"
success = "#aab971"
info = "#78b3b5"
badge_bg = "#3f3c38"
badge_fg = "#e6ddd0"

[states.selected]
bg = "#39332b"
fg = "#9e9b99"
[states.hover]
bg = "#3f3c38"
[states.disabled]
fg = "#a49d93"

[footer]
hint_color = "#a49d93"
