# Ported from Ghostty's bundled "Vesper" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Vesper"
appearance = "dark"

[palette]
bg = "#101010"
surface = "#0c0c0c"
elevated = "#282828"
fg = "#ffffff"
fg_muted = "#ababab"
accent = "#b9aeda"
accent_fg = "#000000"
selection_bg = "#988049"
selection_fg = "#161716"
match_fg = "#ecaad6"
border = "#404040"
separator = "#28282880"
danger = "#f5a191"
warning = "#e6b99d"
success = "#90b99f"
info = "#aca1cf"
badge_bg = "#282828"
badge_fg = "#ffffff"

[states.selected]
bg = "#988049"
fg = "#161716"
[states.hover]
bg = "#282828"
[states.disabled]
fg = "#ababab"

[footer]
hint_color = "#ababab"
