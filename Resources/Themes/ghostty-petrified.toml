# Ported from Ghostty's bundled "Petrified" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Petrified"
appearance = "dark"

[palette]
bg = "#403637"
surface = "#2e2728"
elevated = "#534a4b"
fg = "#fff0dc"
fg_muted = "#bcafa2"
accent = "#9dcddd"
accent_fg = "#000000"
selection_bg = "#625456"
selection_fg = "#fff8ea"
match_fg = "#dab6cf"
border = "#665b58"
separator = "#534a4b80"
danger = "#ee9676"
warning = "#e5c05c"
success = "#82c794"
info = "#80bdd2"
badge_bg = "#534a4b"
badge_fg = "#fff0dc"

[states.selected]
bg = "#625456"
fg = "#fff8ea"
[states.hover]
bg = "#534a4b"
[states.disabled]
fg = "#bcafa2"

[footer]
hint_color = "#bcafa2"
