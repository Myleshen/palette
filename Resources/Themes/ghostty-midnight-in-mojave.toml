# Ported from Ghostty's bundled "Midnight In Mojave" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Midnight In Mojave"
appearance = "dark"

[palette]
bg = "#1e1e1e"
surface = "#161616"
elevated = "#343434"
fg = "#ffffff"
fg_muted = "#b0b0b0"
accent = "#32d74b"
accent_fg = "#000000"
selection_bg = "#4a504d"
selection_fg = "#ffffff"
match_fg = "#bf5af2"
border = "#4b4b4b"
separator = "#34343480"
danger = "#ff453a"
warning = "#ffd60a"
success = "#32d74b"
info = "#0a84ff"
badge_bg = "#343434"
badge_fg = "#ffffff"

[states.selected]
bg = "#4a504d"
fg = "#ffffff"
[states.hover]
bg = "#343434"
[states.disabled]
fg = "#b0b0b0"

[footer]
hint_color = "#b0b0b0"
