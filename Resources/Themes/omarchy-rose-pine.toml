# Ported from Omarchy's bundled "Rose Pine" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/rose-pine/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Rose Pine"
appearance = "light"

[palette]
bg = "#faf4ed"
surface = "#eee8e1"
elevated = "#fdfbf8"
fg = "#575279"
fg_muted = "#908ba2"
accent = "#56949f"
accent_fg = "#000000"
selection_bg = "#dfdad9"
selection_fg = "#575279"
match_fg = "#907aa9"
border = "#d9d4d6"
separator = "#fdfbf880"
danger = "#b4637a"
warning = "#ea9d34"
success = "#286983"
info = "#56949f"
badge_bg = "#fdfbf8"
badge_fg = "#575279"

[states.selected]
bg = "#dfdad9"
fg = "#575279"
[states.hover]
bg = "#fdfbf8"
[states.disabled]
fg = "#908ba2"

[window]
material = "popover"

[footer]
hint_color = "#908ba2"
