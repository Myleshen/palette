# Ported from Ghostty's bundled "Doom One" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Doom One"
appearance = "dark"

[palette]
bg = "#282c34"
surface = "#1d2025"
elevated = "#3e4148"
fg = "#bbc2cf"
fg_muted = "#8c939e"
accent = "#aca5e5"
accent_fg = "#000000"
selection_bg = "#42444b"
selection_fg = "#bbc2cf"
match_fg = "#c678dd"
border = "#454a53"
separator = "#3e414880"
danger = "#ff6c6b"
warning = "#ecbe7b"
success = "#98be65"
info = "#a9a1e1"
badge_bg = "#3e4148"
badge_fg = "#bbc2cf"

[states.selected]
bg = "#42444b"
fg = "#bbc2cf"
[states.hover]
bg = "#3e4148"
[states.disabled]
fg = "#888e99"

[footer]
hint_color = "#888e99"
