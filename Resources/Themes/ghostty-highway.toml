# Ported from Ghostty's bundled "Highway" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Highway"
appearance = "dark"

[palette]
bg = "#222225"
surface = "#18181b"
elevated = "#38383b"
fg = "#ededed"
fg_muted = "#a6a6a7"
accent = "#4fc2fd"
accent_fg = "#000000"
selection_bg = "#384564"
selection_fg = "#ededed"
match_fg = "#de0071"
border = "#4b4b4d"
separator = "#38383b80"
danger = "#d5181d"
warning = "#ffcb3e"
success = "#138034"
info = "#0a6fb8"
badge_bg = "#38383b"
badge_fg = "#ededed"

[states.selected]
bg = "#384564"
fg = "#ededed"
[states.hover]
bg = "#38383b"
[states.disabled]
fg = "#a6a6a7"

[footer]
hint_color = "#a6a6a7"
