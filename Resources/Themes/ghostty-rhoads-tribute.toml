# Ported from Ghostty's bundled "Rhoads Tribute" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rhoads Tribute"
appearance = "dark"

[palette]
bg = "#29212f"
surface = "#1e1822"
elevated = "#3e3744"
fg = "#fff0d2"
fg_muted = "#b4a899"
accent = "#b8cbef"
accent_fg = "#000000"
selection_bg = "#563a60"
selection_fg = "#fff8e9"
match_fg = "#d8b9ef"
border = "#544a50"
separator = "#3e374480"
danger = "#ed8b8e"
warning = "#eac06a"
success = "#a9cb92"
info = "#a4b9e4"
badge_bg = "#3e3744"
badge_fg = "#fff0d2"

[states.selected]
bg = "#563a60"
fg = "#fff8e9"
[states.hover]
bg = "#3e3744"
[states.disabled]
fg = "#b4a899"

[footer]
hint_color = "#b4a899"
