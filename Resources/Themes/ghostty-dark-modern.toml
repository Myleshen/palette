# Ported from Ghostty's bundled "Dark Modern" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Dark Modern"
appearance = "dark"

[palette]
bg = "#1f1f1f"
surface = "#161616"
elevated = "#353535"
fg = "#cccccc"
fg_muted = "#8f8f8f"
accent = "#4da0fd"
accent_fg = "#000000"
selection_bg = "#3a3d41"
selection_fg = "#e0e0e0"
match_fg = "#d670d6"
border = "#424242"
separator = "#35353580"
danger = "#cd3131"
warning = "#e5e510"
success = "#0dbc79"
info = "#2472c8"
badge_bg = "#353535"
badge_fg = "#cccccc"

[states.selected]
bg = "#3a3d41"
fg = "#e0e0e0"
[states.hover]
bg = "#353535"
[states.disabled]
fg = "#8f8f8f"

[footer]
hint_color = "#8f8f8f"
