# Ported from Ghostty's bundled "Rainbows and Unicorns Sorbet" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rainbows and Unicorns Sorbet"
appearance = "dark"

[palette]
bg = "#241b2f"
surface = "#1a1322"
elevated = "#3a3244"
fg = "#f3e8f5"
fg_muted = "#aba0b0"
accent = "#c7dbff"
accent_fg = "#000000"
selection_bg = "#d7b3ff"
selection_fg = "#241b2f"
match_fg = "#e8d1ff"
border = "#4d4457"
separator = "#3a324480"
danger = "#ff9eb5"
warning = "#ffe8a3"
success = "#a8e6c3"
info = "#a7c7ff"
badge_bg = "#3a3244"
badge_fg = "#f3e8f5"

[states.selected]
bg = "#d7b3ff"
fg = "#241b2f"
[states.hover]
bg = "#3a3244"
[states.disabled]
fg = "#aba0b0"

[footer]
hint_color = "#aba0b0"
