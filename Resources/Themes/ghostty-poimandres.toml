# Ported from Ghostty's bundled "Poimandres" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Poimandres"
appearance = "dark"

[palette]
bg = "#1a1e28"
surface = "#13161d"
elevated = "#31343e"
fg = "#a6accd"
fg_muted = "#757a93"
accent = "#add7ff"
accent_fg = "#000000"
selection_bg = "#a6accd"
selection_fg = "#3d3d3d"
match_fg = "#fae4fc"
border = "#363a49"
separator = "#31343e80"
danger = "#d0679d"
warning = "#fffac2"
success = "#5de4c7"
info = "#89ddff"
badge_bg = "#31343e"
badge_fg = "#a6accd"

[states.selected]
bg = "#a6accd"
fg = "#3d3d3d"
[states.hover]
bg = "#31343e"
[states.disabled]
fg = "#757a93"

[footer]
hint_color = "#757a93"
