# Ported from Ghostty's bundled "Syncopation" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Syncopation"
appearance = "dark"

[palette]
bg = "#0e1317"
surface = "#0a0e11"
elevated = "#262b2e"
fg = "#d6dad4"
fg_muted = "#909492"
accent = "#98c4f2"
accent_fg = "#000000"
selection_bg = "#23384a"
selection_fg = "#f0f2ec"
match_fg = "#f2afc2"
border = "#363b3d"
separator = "#262b2e80"
danger = "#e8705e"
warning = "#e9ad4e"
success = "#94c27e"
info = "#6fa3d8"
badge_bg = "#262b2e"
badge_fg = "#d6dad4"

[states.selected]
bg = "#23384a"
fg = "#f0f2ec"
[states.hover]
bg = "#262b2e"
[states.disabled]
fg = "#909492"

[footer]
hint_color = "#909492"
