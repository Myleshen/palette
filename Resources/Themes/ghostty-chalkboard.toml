# Ported from Ghostty's bundled "Chalkboard" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Chalkboard"
appearance = "dark"

[palette]
bg = "#29262f"
surface = "#1e1b22"
elevated = "#3e3c44"
fg = "#d9e6f2"
fg_muted = "#9ba3ae"
accent = "#aaaadb"
accent_fg = "#000000"
selection_bg = "#3e3c44"
selection_fg = "#ffffff"
match_fg = "#dbaada"
border = "#4c4c56"
separator = "#3e3c4480"
danger = "#c37372"
warning = "#c2c372"
success = "#72c373"
info = "#7372c3"
badge_bg = "#3e3c44"
badge_fg = "#d9e6f2"

[states.selected]
bg = "#3e3c44"
fg = "#ffffff"
[states.hover]
bg = "#3e3c44"
[states.disabled]
fg = "#9ba3ae"

[footer]
hint_color = "#9ba3ae"
