# Ported from Ghostty's bundled "Front End Delight" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Front End Delight"
appearance = "dark"

[palette]
bg = "#1b1c1d"
surface = "#131415"
elevated = "#323334"
fg = "#adadad"
fg_muted = "#838384"
accent = "#45a3da"
accent_fg = "#000000"
selection_bg = "#ea6154"
selection_fg = "#1b1c1d"
match_fg = "#e75e4f"
border = "#38393a"
separator = "#32333480"
danger = "#f8511b"
warning = "#fa771d"
success = "#676857"
info = "#2c70b7"
badge_bg = "#323334"
badge_fg = "#adadad"

[states.selected]
bg = "#ea6154"
fg = "#1b1c1d"
[states.hover]
bg = "#323334"
[states.disabled]
fg = "#7a7a7b"

[footer]
hint_color = "#7a7a7b"
