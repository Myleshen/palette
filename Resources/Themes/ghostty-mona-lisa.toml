# Ported from Ghostty's bundled "Mona Lisa" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Mona Lisa"
appearance = "dark"

[palette]
bg = "#120b0d"
surface = "#0d0809"
elevated = "#2a2325"
fg = "#f7d66a"
fg_muted = "#a78f49"
accent = "#9eb2b4"
accent_fg = "#000000"
selection_bg = "#f7d66a"
selection_fg = "#120b0d"
match_fg = "#ff5b6a"
border = "#403420"
separator = "#2a232580"
danger = "#9b291c"
warning = "#c36e28"
success = "#636232"
info = "#515c5d"
badge_bg = "#2a2325"
badge_fg = "#f7d66a"

[states.selected]
bg = "#f7d66a"
fg = "#120b0d"
[states.hover]
bg = "#2a2325"
[states.disabled]
fg = "#a78f49"

[footer]
hint_color = "#a78f49"
