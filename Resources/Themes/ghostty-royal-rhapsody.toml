# Ported from Ghostty's bundled "Royal Rhapsody" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Royal Rhapsody"
appearance = "light"

[palette]
bg = "#f0e6d8"
surface = "#e4dbcd"
elevated = "#f8f4ed"
fg = "#2d2b3b"
fg_muted = "#716c72"
accent = "#26496c"
accent_fg = "#ffffff"
selection_bg = "#dbc7c3"
selection_fg = "#2d2b3b"
match_fg = "#603c62"
border = "#c9c1b9"
separator = "#f8f4ed80"
danger = "#843344"
warning = "#735417"
success = "#386f55"
info = "#2b537b"
badge_bg = "#f8f4ed"
badge_fg = "#2d2b3b"

[states.selected]
bg = "#dbc7c3"
fg = "#2d2b3b"
[states.hover]
bg = "#f8f4ed"
[states.disabled]
fg = "#716c72"

[window]
material = "popover"

[footer]
hint_color = "#716c72"
