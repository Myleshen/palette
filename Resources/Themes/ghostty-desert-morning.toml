# Ported from Ghostty's bundled "Desert Morning" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Desert Morning"
appearance = "dark"

[palette]
bg = "#d8b590"
surface = "#9c8268"
elevated = "#dcbc9b"
fg = "#352417"
fg_muted = "#5e4732"
accent = "#001f48"
accent_fg = "#ffffff"
selection_bg = "#5b3c28"
selection_fg = "#fff8e8"
match_fg = "#61386a"
border = "#b79878"
separator = "#dcbc9b80"
danger = "#7e2c23"
warning = "#62430b"
success = "#294f2e"
info = "#274978"
badge_bg = "#dcbc9b"
badge_fg = "#352417"

[states.selected]
bg = "#5b3c28"
fg = "#fff8e8"
[states.hover]
bg = "#dcbc9b"
[states.disabled]
fg = "#6e5741"

[footer]
hint_color = "#6e5741"
