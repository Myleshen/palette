# Ported from Ghostty's bundled "Icy Glacier" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Icy Glacier"
appearance = "light"

[palette]
bg = "#eef6ff"
surface = "#e2eaf2"
elevated = "#f7fbff"
fg = "#0f172a"
fg_muted = "#5d6575"
accent = "#123b78"
accent_fg = "#ffffff"
selection_bg = "#f7fbff"
selection_fg = "#0f172a"
match_fg = "#503075"
border = "#c1c9d4"
separator = "#f7fbff80"
danger = "#8f2424"
warning = "#6e5500"
success = "#17613c"
info = "#174c9b"
badge_bg = "#f7fbff"
badge_fg = "#0f172a"

[states.selected]
bg = "#f7fbff"
fg = "#0f172a"
[states.hover]
bg = "#f7fbff"
[states.disabled]
fg = "#5d6575"

[window]
material = "popover"

[footer]
hint_color = "#5d6575"
