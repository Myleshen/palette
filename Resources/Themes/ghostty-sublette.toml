# Ported from Ghostty's bundled "Sublette" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sublette"
appearance = "dark"

[palette]
bg = "#202535"
surface = "#171b26"
elevated = "#363b49"
fg = "#ccced0"
fg_muted = "#90939a"
accent = "#77bbff"
accent_fg = "#000000"
selection_bg = "#ccced0"
selection_fg = "#202535"
match_fg = "#ff77cc"
border = "#424754"
separator = "#363b4980"
danger = "#ee5577"
warning = "#ffdd88"
success = "#55ee77"
info = "#5588ff"
badge_bg = "#363b49"
badge_fg = "#ccced0"

[states.selected]
bg = "#ccced0"
fg = "#202535"
[states.hover]
bg = "#363b49"
[states.disabled]
fg = "#90939a"

[footer]
hint_color = "#90939a"
