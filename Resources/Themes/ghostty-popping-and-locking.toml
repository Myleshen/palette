# Ported from Ghostty's bundled "Popping And Locking" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Popping And Locking"
appearance = "dark"

[palette]
bg = "#181921"
surface = "#111218"
elevated = "#2f3037"
fg = "#ebdbb2"
fg_muted = "#a1977f"
accent = "#99c6ca"
accent_fg = "#000000"
selection_bg = "#ebdbb2"
selection_fg = "#695e54"
match_fg = "#d3869b"
border = "#42403e"
separator = "#2f303780"
danger = "#cc241d"
warning = "#d79921"
success = "#98971a"
info = "#458588"
badge_bg = "#2f3037"
badge_fg = "#ebdbb2"

[states.selected]
bg = "#ebdbb2"
fg = "#695e54"
[states.hover]
bg = "#2f3037"
[states.disabled]
fg = "#a1977f"

[footer]
hint_color = "#a1977f"
