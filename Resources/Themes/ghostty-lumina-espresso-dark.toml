# Ported from Ghostty's bundled "Lumina Espresso Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Espresso Dark"
appearance = "dark"

[palette]
bg = "#1e150e"
surface = "#160f0a"
elevated = "#342c26"
fg = "#e5dfd6"
fg_muted = "#9f9890"
accent = "#b5d8fd"
accent_fg = "#000000"
selection_bg = "#45383f"
selection_fg = "#e5dfd6"
match_fg = "#f6c6f1"
border = "#463d36"
separator = "#342c2680"
danger = "#cd766e"
warning = "#efca86"
success = "#95d3b1"
info = "#96bfe9"
badge_bg = "#342c26"
badge_fg = "#e5dfd6"

[states.selected]
bg = "#45383f"
fg = "#e5dfd6"
[states.hover]
bg = "#342c26"
[states.disabled]
fg = "#9f9890"

[footer]
hint_color = "#9f9890"
