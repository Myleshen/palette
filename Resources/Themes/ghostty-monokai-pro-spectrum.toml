# Ported from Ghostty's bundled "Monokai Pro Spectrum" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Monokai Pro Spectrum"
appearance = "dark"

[palette]
bg = "#222222"
surface = "#181818"
elevated = "#383838"
fg = "#f7f1ff"
fg_muted = "#aca9b2"
accent = "#fd9353"
accent_fg = "#000000"
selection_bg = "#525053"
selection_fg = "#f7f1ff"
match_fg = "#948ae3"
border = "#4d4b4e"
separator = "#38383880"
danger = "#fc618d"
warning = "#fce566"
success = "#7bd88f"
info = "#fd9353"
badge_bg = "#383838"
badge_fg = "#f7f1ff"

[states.selected]
bg = "#525053"
fg = "#f7f1ff"
[states.hover]
bg = "#383838"
[states.disabled]
fg = "#aca9b2"

[footer]
hint_color = "#aca9b2"
