# Ported from Ghostty's bundled "Graphite" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Graphite"
appearance = "dark"

[palette]
bg = "#1c1e22"
surface = "#141618"
elevated = "#333438"
fg = "#d2d6dc"
fg_muted = "#92969b"
accent = "#a5c6de"
accent_fg = "#000000"
selection_bg = "#2e333b"
selection_fg = "#9d9ea1"
match_fg = "#ccbedd"
border = "#404347"
separator = "#33343880"
danger = "#e58888"
warning = "#cec59d"
success = "#a7c59f"
info = "#8db4d0"
badge_bg = "#333438"
badge_fg = "#d2d6dc"

[states.selected]
bg = "#2e333b"
fg = "#9d9ea1"
[states.hover]
bg = "#333438"
[states.disabled]
fg = "#92969b"

[footer]
hint_color = "#92969b"
