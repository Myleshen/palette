# Ported from Ghostty's bundled "Springfield Resident Hight Contrast" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Springfield Resident Hight Contrast"
appearance = "light"

[palette]
bg = "#ffdd32"
surface = "#f2d230"
elevated = "#fff0a3"
fg = "#062f63"
fg_muted = "#5d6c52"
accent = "#063d82"
accent_fg = "#ffffff"
selection_bg = "#0b4b94"
selection_fg = "#fff3a3"
match_fg = "#67145d"
border = "#cdba3c"
separator = "#fff0a380"
danger = "#7a1026"
warning = "#5d3e00"
success = "#134e24"
info = "#063d82"
badge_bg = "#fff0a3"
badge_fg = "#062f63"

[states.selected]
bg = "#0b4b94"
fg = "#fff3a3"
[states.hover]
bg = "#fff0a3"
[states.disabled]
fg = "#5d6c52"

[window]
material = "popover"

[footer]
hint_color = "#5d6c52"
