# Ported from Ghostty's bundled "Lumina Dusk Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Dusk Dark"
appearance = "dark"

[palette]
bg = "#1a1825"
surface = "#13111b"
elevated = "#312f3b"
fg = "#e0dcea"
fg_muted = "#9b97a5"
accent = "#bdd8ff"
accent_fg = "#000000"
selection_bg = "#4c373f"
selection_fg = "#e0dcea"
match_fg = "#fcc9f7"
border = "#423f4c"
separator = "#312f3b80"
danger = "#d0746c"
warning = "#efcb7b"
success = "#a0d1a9"
info = "#9bbef2"
badge_bg = "#312f3b"
badge_fg = "#e0dcea"

[states.selected]
bg = "#4c373f"
fg = "#e0dcea"
[states.hover]
bg = "#312f3b"
[states.disabled]
fg = "#9b97a5"

[footer]
hint_color = "#9b97a5"
