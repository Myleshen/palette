# Ported from Ghostty's bundled "Dogxi Misty" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Dogxi Misty"
appearance = "dark"

[palette]
bg = "#282a36"
surface = "#1d1e27"
elevated = "#3e3f4a"
fg = "#eff0eb"
fg_muted = "#a9abac"
accent = "#99ecfe"
accent_fg = "#000000"
selection_bg = "#92bcd0"
selection_fg = "#000000"
match_fg = "#ff6ac1"
border = "#50525a"
separator = "#3e3f4a80"
danger = "#ff5c57"
warning = "#eebd70"
success = "#94e362"
info = "#99ecfe"
badge_bg = "#3e3f4a"
badge_fg = "#eff0eb"

[states.selected]
bg = "#92bcd0"
fg = "#000000"
[states.hover]
bg = "#3e3f4a"
[states.disabled]
fg = "#a9abac"

[footer]
hint_color = "#a9abac"
