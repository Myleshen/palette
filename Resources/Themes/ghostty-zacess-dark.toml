# Ported from Ghostty's bundled "Zacess Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zacess Dark"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#f5f5f5"
fg_muted = "#a6a6a6"
accent = "#c9e0ff"
accent_fg = "#000000"
selection_bg = "#4fbdff"
selection_fg = "#121212"
match_fg = "#ffd0fa"
border = "#3f3f3f"
separator = "#2a2a2a80"
danger = "#ffa79b"
warning = "#f0b40b"
success = "#1bdb41"
info = "#90c1ff"
badge_bg = "#2a2a2a"
badge_fg = "#f5f5f5"

[states.selected]
bg = "#4fbdff"
fg = "#121212"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
