# Ported from Ghostty's bundled "Analog Heartbeat: Phosphor" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Analog Heartbeat: Phosphor"
appearance = "dark"

[palette]
bg = "#101c14"
surface = "#0c140e"
elevated = "#28332c"
fg = "#c5e6ac"
fg_muted = "#869f77"
accent = "#f0bb6d"
accent_fg = "#000000"
selection_bg = "#344637"
selection_fg = "#abb2ad"
match_fg = "#c5ac92"
border = "#344432"
separator = "#28332c80"
danger = "#a96757"
warning = "#b8a35b"
success = "#79b95d"
info = "#7b9c86"
badge_bg = "#28332c"
badge_fg = "#c5e6ac"

[states.selected]
bg = "#344637"
fg = "#abb2ad"
[states.hover]
bg = "#28332c"
[states.disabled]
fg = "#869f77"

[footer]
hint_color = "#869f77"
