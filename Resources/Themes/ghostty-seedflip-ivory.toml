# Ported from Ghostty's bundled "SeedFlip Ivory" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · SeedFlip Ivory"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#0a2540"
fg_muted = "#607183"
accent = "#0f58bd"
accent_fg = "#ffffff"
selection_bg = "#ffffff"
selection_fg = "#0a2540"
match_fg = "#bd0fbd"
border = "#ced3d9"
separator = "#ffffff80"
danger = "#bd0f0f"
warning = "#bda00f"
success = "#0fbd49"
info = "#0f58bd"
badge_bg = "#ffffff"
badge_fg = "#0a2540"

[states.selected]
bg = "#ffffff"
fg = "#0a2540"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#607183"

[window]
material = "popover"

[footer]
hint_color = "#607183"
