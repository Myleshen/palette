# Ported from Ghostty's bundled "Pharaoh's Voltage" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Pharaoh's Voltage"
appearance = "dark"

[palette]
bg = "#102c3c"
surface = "#0c202b"
elevated = "#284150"
fg = "#f8e9ca"
fg_muted = "#a7a798"
accent = "#ecca78"
accent_fg = "#000000"
selection_bg = "#3e4556"
selection_fg = "#f8e9ca"
match_fg = "#cea8de"
border = "#3e5258"
separator = "#28415080"
danger = "#ea9166"
warning = "#e9c366"
success = "#8bc49c"
info = "#78b9e8"
badge_bg = "#284150"
badge_fg = "#f8e9ca"

[states.selected]
bg = "#3e4556"
fg = "#f8e9ca"
[states.hover]
bg = "#284150"
[states.disabled]
fg = "#a7a798"

[footer]
hint_color = "#a7a798"
