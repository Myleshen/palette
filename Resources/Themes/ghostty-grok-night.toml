# Ported from Ghostty's bundled "Grok Night" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Grok Night"
appearance = "dark"

[palette]
bg = "#141414"
surface = "#0e0e0e"
elevated = "#2c2c2c"
fg = "#e1e1e1"
fg_muted = "#999999"
accent = "#e0af68"
accent_fg = "#000000"
selection_bg = "#242424"
selection_fg = "#e1e1e1"
match_fg = "#bb9af7"
border = "#3d3d3d"
separator = "#2c2c2c80"
danger = "#f7768e"
warning = "#e0af68"
success = "#9ece6a"
info = "#7aa2f7"
badge_bg = "#2c2c2c"
badge_fg = "#e1e1e1"

[states.selected]
bg = "#242424"
fg = "#e1e1e1"
[states.hover]
bg = "#2c2c2c"
[states.disabled]
fg = "#999999"

[footer]
hint_color = "#999999"
