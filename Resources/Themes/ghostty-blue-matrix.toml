# Ported from Ghostty's bundled "Blue Matrix" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Blue Matrix"
appearance = "dark"

[palette]
bg = "#101116"
surface = "#0c0c10"
elevated = "#28292d"
fg = "#1aa4ff"
fg_muted = "#2782c1"
accent = "#76ff9f"
accent_fg = "#000000"
selection_bg = "#c1deff"
selection_fg = "#000000"
match_fg = "#d682ec"
border = "#0d2e45"
separator = "#28292d80"
danger = "#ff5680"
warning = "#fffc58"
success = "#00ff9c"
info = "#00b0ff"
badge_bg = "#28292d"
badge_fg = "#00a2ff"

[states.selected]
bg = "#c1deff"
fg = "#000000"
[states.hover]
bg = "#28292d"
[states.disabled]
fg = "#066fad"

[footer]
hint_color = "#066fad"
