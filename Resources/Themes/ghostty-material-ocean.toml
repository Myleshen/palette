# Ported from Ghostty's bundled "Material Ocean" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Material Ocean"
appearance = "dark"

[palette]
bg = "#0f111a"
surface = "#0b0c13"
elevated = "#272931"
fg = "#999ead"
fg_muted = "#777c88"
accent = "#ffcc00"
accent_fg = "#000000"
selection_bg = "#1f2233"
selection_fg = "#8f93a2"
match_fg = "#c792ea"
border = "#292b35"
separator = "#27293180"
danger = "#ff5370"
warning = "#ffcb6b"
success = "#c3e88d"
info = "#82aaff"
badge_bg = "#272931"
badge_fg = "#8f93a2"

[states.selected]
bg = "#1f2233"
fg = "#8f93a2"
[states.hover]
bg = "#272931"
[states.disabled]
fg = "#626672"

[footer]
hint_color = "#626672"
