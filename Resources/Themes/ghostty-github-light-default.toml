# Ported from Ghostty's bundled "GitHub Light Default" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · GitHub Light Default"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#1f2328"
fg_muted = "#6d7073"
accent = "#0969da"
accent_fg = "#ffffff"
selection_bg = "#1f2328"
selection_fg = "#ffffff"
match_fg = "#8250df"
border = "#d2d3d4"
separator = "#ffffff80"
danger = "#cf222e"
warning = "#4d2d00"
success = "#116329"
info = "#0969da"
badge_bg = "#ffffff"
badge_fg = "#1f2328"

[states.selected]
bg = "#1f2328"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#6d7073"

[window]
material = "popover"

[footer]
hint_color = "#6d7073"
