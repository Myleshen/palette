# Ported from Ghostty's bundled "Sumi Linen" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sumi Linen"
appearance = "light"

[palette]
bg = "#e6dfd0"
surface = "#dbd4c6"
elevated = "#f4f1ea"
fg = "#1c1814"
fg_muted = "#635e56"
accent = "#3060a0"
accent_fg = "#ffffff"
selection_bg = "#9ec4ba"
selection_fg = "#14100c"
match_fg = "#704890"
border = "#beb7aa"
separator = "#f4f1ea80"
danger = "#b83830"
warning = "#a87820"
success = "#2e8050"
info = "#3060a0"
badge_bg = "#f4f1ea"
badge_fg = "#1c1814"

[states.selected]
bg = "#9ec4ba"
fg = "#14100c"
[states.hover]
bg = "#f4f1ea"
[states.disabled]
fg = "#635e56"

[window]
material = "popover"

[footer]
hint_color = "#635e56"
