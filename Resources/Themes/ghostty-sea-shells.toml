# Ported from Ghostty's bundled "Sea Shells" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Sea Shells"
appearance = "dark"

[palette]
bg = "#09141b"
surface = "#060e13"
elevated = "#222c32"
fg = "#deb88d"
fg_muted = "#937f65"
accent = "#fca02f"
accent_fg = "#000000"
selection_bg = "#1e4962"
selection_fg = "#fee4ce"
match_fg = "#bbe3ee"
border = "#343532"
separator = "#222c3280"
danger = "#d15123"
warning = "#fca02f"
success = "#027c9b"
info = "#3d686f"
badge_bg = "#222c32"
badge_fg = "#deb88d"

[states.selected]
bg = "#1e4962"
fg = "#fee4ce"
[states.hover]
bg = "#222c32"
[states.disabled]
fg = "#937f65"

[footer]
hint_color = "#937f65"
