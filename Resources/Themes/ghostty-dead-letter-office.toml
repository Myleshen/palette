# Ported from Ghostty's bundled "Dead Letter Office" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Dead Letter Office"
appearance = "dark"

[palette]
bg = "#090d12"
surface = "#06090d"
elevated = "#22252a"
fg = "#eef2f6"
fg_muted = "#9ea2a6"
accent = "#a9caff"
accent_fg = "#000000"
selection_bg = "#26313d"
selection_fg = "#f7fafc"
match_fg = "#e8beff"
border = "#373b40"
separator = "#22252a80"
danger = "#ff8178"
warning = "#ffd36a"
success = "#79d5a7"
info = "#88b6ff"
badge_bg = "#22252a"
badge_fg = "#eef2f6"

[states.selected]
bg = "#26313d"
fg = "#f7fafc"
[states.hover]
bg = "#22252a"
[states.disabled]
fg = "#9ea2a6"

[footer]
hint_color = "#9ea2a6"
