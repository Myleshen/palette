# Ported from Ghostty's bundled "Dark 2026" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Dark 2026"
appearance = "dark"

[palette]
bg = "#191a1b"
surface = "#121313"
elevated = "#303132"
fg = "#cccccc"
fg_muted = "#8d8e8e"
accent = "#489af8"
accent_fg = "#000000"
selection_bg = "#1f323b"
selection_fg = "#cccccc"
match_fg = "#d670d6"
border = "#3d3e3e"
separator = "#30313280"
danger = "#cd3131"
warning = "#e5e510"
success = "#0dbc79"
info = "#2472c8"
badge_bg = "#303132"
badge_fg = "#cccccc"

[states.selected]
bg = "#1f323b"
fg = "#cccccc"
[states.hover]
bg = "#303132"
[states.disabled]
fg = "#8d8e8e"

[footer]
hint_color = "#8d8e8e"
