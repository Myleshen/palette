# Ported from Omarchy's bundled "Lumon" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/lumon/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Lumon"
appearance = "dark"

[palette]
bg = "#16242d"
surface = "#101a20"
elevated = "#2d3a42"
fg = "#d6e2ee"
fg_muted = "#93a0aa"
accent = "#8bc9eb"
accent_fg = "#000000"
selection_bg = "#4d9ed3"
selection_fg = "#1b2d40"
match_fg = "#b1d8ee"
border = "#3c4a54"
separator = "#2d3a4280"
danger = "#4d86b0"
warning = "#6fa4c9"
success = "#5e95bc"
info = "#6fb8e3"
badge_bg = "#2d3a42"
badge_fg = "#d6e2ee"

[states.selected]
bg = "#4d9ed3"
fg = "#1b2d40"
[states.hover]
bg = "#2d3a42"
[states.disabled]
fg = "#93a0aa"

[footer]
hint_color = "#93a0aa"
