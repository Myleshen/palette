# Ported from Ghostty's bundled "Snazzy" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Snazzy"
appearance = "dark"

[palette]
bg = "#1e1f29"
surface = "#16161e"
elevated = "#34353e"
fg = "#ebece6"
fg_muted = "#a3a4a4"
accent = "#49baff"
accent_fg = "#000000"
selection_bg = "#81aec6"
selection_fg = "#000000"
match_fg = "#fc4cb4"
border = "#47484f"
separator = "#34353e80"
danger = "#fc4346"
warning = "#f0fb8c"
success = "#50fb7c"
info = "#49baff"
badge_bg = "#34353e"
badge_fg = "#ebece6"

[states.selected]
bg = "#81aec6"
fg = "#000000"
[states.hover]
bg = "#34353e"
[states.disabled]
fg = "#a3a4a4"

[footer]
hint_color = "#a3a4a4"
