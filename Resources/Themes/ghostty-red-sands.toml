# Ported from Ghostty's bundled "Red Sands" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Red Sands"
appearance = "dark"

[palette]
bg = "#7a251e"
surface = "#581b16"
elevated = "#873b34"
fg = "#d7c9a7"
fg_muted = "#b69077"
accent = "#0072ff"
accent_fg = "#000000"
selection_bg = "#a4a390"
selection_fg = "#000000"
match_fg = "#ff55ff"
border = "#8d4639"
separator = "#873b3480"
danger = "#ff3f00"
warning = "#e7b000"
success = "#00bb00"
info = "#0072ff"
badge_bg = "#873b34"
badge_fg = "#d7c9a7"

[states.selected]
bg = "#a4a390"
fg = "#000000"
[states.hover]
bg = "#873b34"
[states.disabled]
fg = "#b69077"

[footer]
hint_color = "#b69077"
