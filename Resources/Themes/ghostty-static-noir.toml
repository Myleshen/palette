# Ported from Ghostty's bundled "Static Noir" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Static Noir"
appearance = "dark"

[palette]
bg = "#0a0a0a"
surface = "#070707"
elevated = "#232323"
fg = "#ededed"
fg_muted = "#9e9e9e"
accent = "#9dc7f2"
accent_fg = "#000000"
selection_bg = "#333333"
selection_fg = "#ffffff"
match_fg = "#e0aede"
border = "#373737"
separator = "#23232380"
danger = "#ff4d42"
warning = "#e6c15c"
success = "#9fd08a"
info = "#7fb2e8"
badge_bg = "#232323"
badge_fg = "#ededed"

[states.selected]
bg = "#333333"
fg = "#ffffff"
[states.hover]
bg = "#232323"
[states.disabled]
fg = "#9e9e9e"

[footer]
hint_color = "#9e9e9e"
