# Ported from Ghostty's bundled "Kanso Zen" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Kanso Zen"
appearance = "dark"

[palette]
bg = "#090e13"
surface = "#060a0e"
elevated = "#22262b"
fg = "#c5c9c7"
fg_muted = "#838888"
accent = "#7fb4ca"
accent_fg = "#000000"
selection_bg = "#393b44"
selection_fg = "#c5c9c7"
match_fg = "#a292a3"
border = "#2f3337"
separator = "#22262b80"
danger = "#c4746e"
warning = "#c4b28a"
success = "#8a9a7b"
info = "#8ba4b0"
badge_bg = "#22262b"
badge_fg = "#c5c9c7"

[states.selected]
bg = "#393b44"
fg = "#c5c9c7"
[states.hover]
bg = "#22262b"
[states.disabled]
fg = "#838888"

[footer]
hint_color = "#838888"
