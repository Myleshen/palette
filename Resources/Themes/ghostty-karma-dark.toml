# Ported from Ghostty's bundled "Karma Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Karma Dark"
appearance = "dark"

[palette]
bg = "#0a0e14"
surface = "#070a0e"
elevated = "#23262c"
fg = "#f7f1ff"
fg_muted = "#a4a2ad"
accent = "#fce566"
accent_fg = "#000000"
selection_bg = "#3a384a"
selection_fg = "#f7f1ff"
match_fg = "#c3b0f0"
border = "#393b43"
separator = "#23262c80"
danger = "#fc618d"
warning = "#fce566"
success = "#7bd88f"
info = "#5ad4e6"
badge_bg = "#23262c"
badge_fg = "#f7f1ff"

[states.selected]
bg = "#3a384a"
fg = "#f7f1ff"
[states.hover]
bg = "#23262c"
[states.disabled]
fg = "#a4a2ad"

[footer]
hint_color = "#a4a2ad"
