# Ported from Ghostty's bundled "Novel" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Novel"
appearance = "light"

[palette]
bg = "#dfdbc3"
surface = "#d4d0b9"
elevated = "#f1efe4"
fg = "#3b2322"
fg_muted = "#74635a"
accent = "#0000cc"
accent_fg = "#ffffff"
selection_bg = "#a4a390"
selection_fg = "#000000"
match_fg = "#cc00cc"
border = "#beb6a3"
separator = "#f1efe480"
danger = "#cc0000"
warning = "#d06b00"
success = "#009600"
info = "#0000cc"
badge_bg = "#f1efe4"
badge_fg = "#3b2322"

[states.selected]
bg = "#a4a390"
fg = "#000000"
[states.hover]
bg = "#f1efe4"
[states.disabled]
fg = "#74635a"

[window]
material = "popover"

[footer]
hint_color = "#74635a"
