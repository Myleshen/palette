# Ported from Ghostty's bundled "Wez" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Wez"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#b3b3b3"
fg_muted = "#757474"
accent = "#53ae71"
accent_fg = "#000000"
selection_bg = "#4d52f8"
selection_fg = "#ebebeb"
match_fg = "#ff55ff"
border = "#242424"
separator = "#1a1a1a80"
danger = "#cc5555"
warning = "#cdcd55"
success = "#55cc55"
info = "#5555cc"
badge_bg = "#1a1a1a"
badge_fg = "#b3b3b3"

[states.selected]
bg = "#4d52f8"
fg = "#ebebeb"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#747474"

[footer]
hint_color = "#747474"
