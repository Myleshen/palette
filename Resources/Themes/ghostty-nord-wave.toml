# Ported from Ghostty's bundled "Nord Wave" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Nord Wave"
appearance = "dark"

[palette]
bg = "#212121"
surface = "#181818"
elevated = "#373737"
fg = "#d8dee9"
fg_muted = "#989ca3"
accent = "#81a1c1"
accent_fg = "#000000"
selection_bg = "#d8dee9"
selection_fg = "#212121"
match_fg = "#b48ead"
border = "#464749"
separator = "#37373780"
danger = "#bf616a"
warning = "#ebcb8b"
success = "#a3be8c"
info = "#81a1c1"
badge_bg = "#373737"
badge_fg = "#d8dee9"

[states.selected]
bg = "#d8dee9"
fg = "#212121"
[states.hover]
bg = "#373737"
[states.disabled]
fg = "#989ca3"

[footer]
hint_color = "#989ca3"
