# Ported from Ghostty's bundled "Lumina Vitrail Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Vitrail Light"
appearance = "light"

[palette]
bg = "#fcfaf4"
surface = "#efede8"
elevated = "#fefdfa"
fg = "#0f141d"
fg_muted = "#626468"
accent = "#12247b"
accent_fg = "#ffffff"
selection_bg = "#bac7e8"
selection_fg = "#0f141d"
match_fg = "#480d5e"
border = "#cdccc9"
separator = "#fefdfa80"
danger = "#752200"
warning = "#7c4700"
success = "#00490f"
info = "#1729b2"
badge_bg = "#fefdfa"
badge_fg = "#0f141d"

[states.selected]
bg = "#bac7e8"
fg = "#0f141d"
[states.hover]
bg = "#fefdfa"
[states.disabled]
fg = "#626468"

[window]
material = "popover"

[footer]
hint_color = "#626468"
