# Ported from Ghostty's bundled "Hysterical Frequency" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Hysterical Frequency"
appearance = "dark"

[palette]
bg = "#202444"
surface = "#171a31"
elevated = "#363a57"
fg = "#f1ebfa"
fg_muted = "#a8a5ba"
accent = "#efcf7f"
accent_fg = "#000000"
selection_bg = "#493f5c"
selection_fg = "#f1ebfa"
match_fg = "#d7aced"
border = "#4a4c68"
separator = "#363a5780"
danger = "#e77b9c"
warning = "#edc86e"
success = "#8dc8a0"
info = "#82baf0"
badge_bg = "#363a57"
badge_fg = "#f1ebfa"

[states.selected]
bg = "#493f5c"
fg = "#f1ebfa"
[states.hover]
bg = "#363a57"
[states.disabled]
fg = "#a8a5ba"

[footer]
hint_color = "#a8a5ba"
