# Ported from Ghostty's bundled "Hadal Bloom" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Hadal Bloom"
appearance = "dark"

[palette]
bg = "#091923"
surface = "#061219"
elevated = "#223039"
fg = "#d6eaf0"
fg_muted = "#8ea1a8"
accent = "#94bef6"
accent_fg = "#000000"
selection_bg = "#214454"
selection_fg = "#a7b0b6"
match_fg = "#c9b5ff"
border = "#32434c"
separator = "#22303980"
danger = "#d97494"
warning = "#c7b87c"
success = "#65bfa7"
info = "#6e9cd6"
badge_bg = "#223039"
badge_fg = "#d6eaf0"

[states.selected]
bg = "#214454"
fg = "#a7b0b6"
[states.hover]
bg = "#223039"
[states.disabled]
fg = "#8ea1a8"

[footer]
hint_color = "#8ea1a8"
