# Ported from Ghostty's bundled "Midnight Arcade" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Midnight Arcade"
appearance = "dark"

[palette]
bg = "#0b1220"
surface = "#080d17"
elevated = "#232a36"
fg = "#f8fafc"
fg_muted = "#a5a9af"
accent = "#80b7fb"
accent_fg = "#000000"
selection_bg = "#f8fafc"
selection_fg = "#0b1220"
match_fg = "#ed94fa"
border = "#3a404c"
separator = "#232a3680"
danger = "#fb7185"
warning = "#fbbf24"
success = "#22c55e"
info = "#60a5fa"
badge_bg = "#232a36"
badge_fg = "#f8fafc"

[states.selected]
bg = "#f8fafc"
fg = "#0b1220"
[states.hover]
bg = "#232a36"
[states.disabled]
fg = "#a5a9af"

[footer]
hint_color = "#a5a9af"
