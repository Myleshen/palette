# Ported from Ghostty's bundled "Painted Desert" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Painted Desert"
appearance = "dark"

[palette]
bg = "#593148"
surface = "#402334"
elevated = "#6a465a"
fg = "#fff0df"
fg_muted = "#c5adaa"
accent = "#b7daf2"
accent_fg = "#000000"
selection_bg = "#774b63"
selection_fg = "#fff7ec"
match_fg = "#f0c2e0"
border = "#7a5766"
separator = "#6a465a80"
danger = "#ffa08e"
warning = "#f2d071"
success = "#99d6a8"
info = "#9ccbed"
badge_bg = "#6a465a"
badge_fg = "#fff0df"

[states.selected]
bg = "#774b63"
fg = "#fff7ec"
[states.hover]
bg = "#6a465a"
[states.disabled]
fg = "#c5adaa"

[footer]
hint_color = "#c5adaa"
