# Ported from Ghostty's bundled "Sumi Ink" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sumi Ink"
appearance = "dark"

[palette]
bg = "#1e1b18"
surface = "#161311"
elevated = "#34322f"
fg = "#e6dcc6"
fg_muted = "#a09889"
accent = "#8ea2c0"
accent_fg = "#000000"
selection_bg = "#a3362a"
selection_fg = "#efe5d1"
match_fg = "#c08aa2"
border = "#46423b"
separator = "#34322f80"
danger = "#c0503f"
warning = "#c9a45c"
success = "#7f9a6a"
info = "#6f86a8"
badge_bg = "#34322f"
badge_fg = "#e6dcc6"

[states.selected]
bg = "#a3362a"
fg = "#efe5d1"
[states.hover]
bg = "#34322f"
[states.disabled]
fg = "#a09889"

[footer]
hint_color = "#a09889"
