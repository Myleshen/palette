# Ported from Ghostty's bundled "Zacess Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zacess Light"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#111111"
fg_muted = "#646464"
accent = "#005fcc"
accent_fg = "#ffffff"
selection_bg = "#0150b2"
selection_fg = "#ffffff"
match_fg = "#b301ae"
border = "#cfcfcf"
separator = "#ffffff80"
danger = "#ca010e"
warning = "#885a00"
success = "#01751c"
info = "#005fcc"
badge_bg = "#ffffff"
badge_fg = "#111111"

[states.selected]
bg = "#0150b2"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#646464"

[window]
material = "popover"

[footer]
hint_color = "#646464"
