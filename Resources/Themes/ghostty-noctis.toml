# Ported from Ghostty's bundled "Noctis" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Noctis"
appearance = "dark"

[palette]
bg = "#052529"
surface = "#041b1e"
elevated = "#1e3b3e"
fg = "#b2cacd"
fg_muted = "#759094"
accent = "#60b6eb"
accent_fg = "#000000"
selection_bg = "#0f3a3f"
selection_fg = "#b2cacd"
match_fg = "#e798b3"
border = "#28464a"
separator = "#1e3b3e80"
danger = "#e66533"
warning = "#e4b781"
success = "#49e9a6"
info = "#49ace9"
badge_bg = "#1e3b3e"
badge_fg = "#b2cacd"

[states.selected]
bg = "#0f3a3f"
fg = "#b2cacd"
[states.hover]
bg = "#1e3b3e"
[states.disabled]
fg = "#759094"

[footer]
hint_color = "#759094"
