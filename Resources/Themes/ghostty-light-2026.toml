# Ported from Ghostty's bundled "Light 2026" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Light 2026"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#3b3b3b"
fg_muted = "#808080"
accent = "#0451a5"
accent_fg = "#ffffff"
selection_bg = "#d9e9f7"
selection_fg = "#3b3b3b"
match_fg = "#bc05bc"
border = "#d8d8d8"
separator = "#ffffff80"
danger = "#cd3131"
warning = "#949800"
success = "#107c10"
info = "#0451a5"
badge_bg = "#ffffff"
badge_fg = "#3b3b3b"

[states.selected]
bg = "#d9e9f7"
fg = "#3b3b3b"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#808080"

[window]
material = "popover"

[footer]
hint_color = "#808080"
