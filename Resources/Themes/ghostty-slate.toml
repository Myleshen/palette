# Ported from Ghostty's bundled "Slate" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Slate"
appearance = "dark"

[palette]
bg = "#222222"
surface = "#181818"
elevated = "#383838"
fg = "#35b1d2"
fg_muted = "#2e7f94"
accent = "#7ab0d2"
accent_fg = "#000000"
selection_bg = "#0f3754"
selection_fg = "#2dffc0"
match_fg = "#c5a7d9"
border = "#263f45"
separator = "#38383880"
danger = "#e2a8bf"
warning = "#c4c9c0"
success = "#81d778"
info = "#335856"
badge_bg = "#383838"
badge_fg = "#35b1d2"

[states.selected]
bg = "#0f3754"
fg = "#2dffc0"
[states.hover]
bg = "#383838"
[states.disabled]
fg = "#2e7f94"

[footer]
hint_color = "#2e7f94"
