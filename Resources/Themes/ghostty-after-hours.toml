# Ported from Ghostty's bundled "After Hours" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · After Hours"
appearance = "dark"

[palette]
bg = "#0f0b0a"
surface = "#0b0807"
elevated = "#272323"
fg = "#e6e1d9"
fg_muted = "#9b9691"
accent = "#93c5fd"
accent_fg = "#000000"
selection_bg = "#3d2f27"
selection_fg = "#e6e1d9"
match_fg = "#d8b4fe"
border = "#3a3633"
separator = "#27232380"
danger = "#ff6b6b"
warning = "#f59e0b"
success = "#4ade80"
info = "#60a5fa"
badge_bg = "#272323"
badge_fg = "#e6e1d9"

[states.selected]
bg = "#3d2f27"
fg = "#e6e1d9"
[states.hover]
bg = "#272323"
[states.disabled]
fg = "#9b9691"

[footer]
hint_color = "#9b9691"
