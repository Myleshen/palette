# Ported from Ghostty's bundled "Noctis Minimus" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Noctis Minimus"
appearance = "dark"

[palette]
bg = "#1b2932"
surface = "#131e24"
elevated = "#323e46"
fg = "#c5cdd3"
fg_muted = "#8a949b"
accent = "#71add3"
accent_fg = "#000000"
selection_bg = "#263c4a"
selection_fg = "#c5cdd3"
match_fg = "#c88da2"
border = "#3d4a52"
separator = "#323e4680"
danger = "#c08872"
warning = "#c8a984"
success = "#72c09f"
info = "#6196b8"
badge_bg = "#323e46"
badge_fg = "#c5cdd3"

[states.selected]
bg = "#263c4a"
fg = "#c5cdd3"
[states.hover]
bg = "#323e46"
[states.disabled]
fg = "#8a949b"

[footer]
hint_color = "#8a949b"
