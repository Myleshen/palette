# Ported from Ghostty's bundled "Sleepy Hollow" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Sleepy Hollow"
appearance = "dark"

[palette]
bg = "#121214"
surface = "#0d0d0e"
elevated = "#2a2a2c"
fg = "#af9a91"
fg_muted = "#786a65"
accent = "#8086ef"
accent_fg = "#000000"
selection_bg = "#575256"
selection_fg = "#d2c7a9"
match_fg = "#e2c2bb"
border = "#312d2d"
separator = "#2a2a2c80"
danger = "#ba3934"
warning = "#b55600"
success = "#91773f"
info = "#5f63b4"
badge_bg = "#2a2a2c"
badge_fg = "#af9a91"

[states.selected]
bg = "#575256"
fg = "#d2c7a9"
[states.hover]
bg = "#2a2a2c"
[states.disabled]
fg = "#786a65"

[footer]
hint_color = "#786a65"
