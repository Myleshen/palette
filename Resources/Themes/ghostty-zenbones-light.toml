# Ported from Ghostty's bundled "Zenbones Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zenbones Light"
appearance = "light"

[palette]
bg = "#f0edec"
surface = "#e4e1e0"
elevated = "#f8f7f6"
fg = "#2c363c"
fg_muted = "#686c70"
accent = "#1d5573"
accent_fg = "#ffffff"
selection_bg = "#cbd9e3"
selection_fg = "#2c363c"
match_fg = "#7b3b70"
border = "#c9c8c9"
separator = "#f8f7f680"
danger = "#a8334c"
warning = "#944927"
success = "#4f6c31"
info = "#286486"
badge_bg = "#f8f7f6"
badge_fg = "#2c363c"

[states.selected]
bg = "#cbd9e3"
fg = "#2c363c"
[states.hover]
bg = "#f8f7f6"
[states.disabled]
fg = "#71767a"

[window]
material = "popover"

[footer]
hint_color = "#71767a"
