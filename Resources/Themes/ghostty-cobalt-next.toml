# Ported from Ghostty's bundled "Cobalt Next" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Cobalt Next"
appearance = "dark"

[palette]
bg = "#162c35"
surface = "#102026"
elevated = "#2d4149"
fg = "#d7deea"
fg_muted = "#93a0ab"
accent = "#ffc64c"
accent_fg = "#000000"
selection_bg = "#4c5b67"
selection_fg = "#ffffff"
match_fg = "#f3ccef"
border = "#3d5059"
separator = "#2d414980"
danger = "#ff527b"
warning = "#ffc64c"
success = "#8cc98f"
info = "#409dd4"
badge_bg = "#2d4149"
badge_fg = "#d7deea"

[states.selected]
bg = "#4c5b67"
fg = "#ffffff"
[states.hover]
bg = "#2d4149"
[states.disabled]
fg = "#93a0ab"

[footer]
hint_color = "#93a0ab"
