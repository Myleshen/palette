# Ported from Ghostty's bundled "Jubi" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Jubi"
appearance = "dark"

[palette]
bg = "#262b33"
surface = "#1b1f25"
elevated = "#3c4047"
fg = "#c3d3de"
fg_muted = "#8c98a2"
accent = "#97abd9"
accent_fg = "#000000"
selection_bg = "#5b5184"
selection_fg = "#d2d1d5"
match_fg = "#e16c87"
border = "#454d55"
separator = "#3c404780"
danger = "#cf7b98"
warning = "#6ebfc0"
success = "#90a94b"
info = "#5b72aa"
badge_bg = "#3c4047"
badge_fg = "#c3d3de"

[states.selected]
bg = "#5b5184"
fg = "#d2d1d5"
[states.hover]
bg = "#3c4047"
[states.disabled]
fg = "#8c98a2"

[footer]
hint_color = "#8c98a2"
