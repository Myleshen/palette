# Ported from Ghostty's bundled "Electric Voodoo" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Electric Voodoo"
appearance = "dark"

[palette]
bg = "#40213c"
surface = "#2e182b"
elevated = "#533750"
fg = "#fae6ce"
fg_muted = "#b9a19b"
accent = "#9fc2e4"
accent_fg = "#000000"
selection_bg = "#603d56"
selection_fg = "#fae6ce"
match_fg = "#deabe7"
border = "#654859"
separator = "#53375080"
danger = "#f08b76"
warning = "#edc077"
success = "#a9ca89"
info = "#92bae0"
badge_bg = "#533750"
badge_fg = "#fae6ce"

[states.selected]
bg = "#603d56"
fg = "#fae6ce"
[states.hover]
bg = "#533750"
[states.disabled]
fg = "#b9a19b"

[footer]
hint_color = "#b9a19b"
