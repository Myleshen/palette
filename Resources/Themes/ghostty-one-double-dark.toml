# Ported from Ghostty's bundled "One Double Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · One Double Dark"
appearance = "dark"

[palette]
bg = "#282c34"
surface = "#1d2025"
elevated = "#3e4148"
fg = "#dbdfe5"
fg_muted = "#9ca0a7"
accent = "#6dcaff"
accent_fg = "#000000"
selection_bg = "#585b70"
selection_fg = "#cdd6f4"
match_fg = "#ff7bf4"
border = "#4c5057"
separator = "#3e414880"
danger = "#f16372"
warning = "#ecbe70"
success = "#8cc570"
info = "#3fb1f5"
badge_bg = "#3e4148"
badge_fg = "#dbdfe5"

[states.selected]
bg = "#585b70"
fg = "#cdd6f4"
[states.hover]
bg = "#3e4148"
[states.disabled]
fg = "#9ca0a7"

[footer]
hint_color = "#9ca0a7"
