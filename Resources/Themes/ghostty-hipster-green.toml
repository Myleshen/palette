# Ported from Ghostty's bundled "Hipster Green" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Hipster Green"
appearance = "dark"

[palette]
bg = "#100b05"
surface = "#0c0804"
elevated = "#28231e"
fg = "#84c138"
fg_muted = "#5e852a"
accent = "#23ff18"
accent_fg = "#000000"
selection_bg = "#083905"
selection_fg = "#ffffff"
match_fg = "#e500e5"
border = "#272f0f"
separator = "#28231e80"
danger = "#b6214a"
warning = "#bfbf00"
success = "#00a600"
info = "#246eb2"
badge_bg = "#28231e"
badge_fg = "#84c138"

[states.selected]
bg = "#083905"
fg = "#ffffff"
[states.hover]
bg = "#28231e"
[states.disabled]
fg = "#5b8126"

[footer]
hint_color = "#5b8126"
