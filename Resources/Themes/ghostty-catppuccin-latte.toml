# Ported from Ghostty's bundled "Catppuccin Latte" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Catppuccin Latte"
appearance = "light"

[palette]
bg = "#eff1f5"
surface = "#e3e5e9"
elevated = "#f8f9fb"
fg = "#4c4f69"
fg_muted = "#85889a"
accent = "#1e66f5"
accent_fg = "#ffffff"
selection_bg = "#dc8a78"
selection_fg = "#303031"
match_fg = "#ea76cb"
border = "#ced1d9"
separator = "#f8f9fb80"
danger = "#d20f39"
warning = "#df8e1d"
success = "#40a02b"
info = "#1e66f5"
badge_bg = "#f8f9fb"
badge_fg = "#4c4f69"

[states.selected]
bg = "#dc8a78"
fg = "#303031"
[states.hover]
bg = "#f8f9fb"
[states.disabled]
fg = "#85889a"

[window]
material = "popover"

[footer]
hint_color = "#85889a"
