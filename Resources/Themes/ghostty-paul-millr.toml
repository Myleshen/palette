# Ported from Ghostty's bundled "Paul Millr" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Paul Millr"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#f2f2f2"
fg_muted = "#9d9d9d"
accent = "#709aed"
accent_fg = "#000000"
selection_bg = "#414141"
selection_fg = "#ffffff"
match_fg = "#db67e6"
border = "#303030"
separator = "#1a1a1a80"
danger = "#ff0000"
warning = "#e7bf00"
success = "#79ff0f"
info = "#396bd7"
badge_bg = "#1a1a1a"
badge_fg = "#f2f2f2"

[states.selected]
bg = "#414141"
fg = "#ffffff"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#9d9d9d"

[footer]
hint_color = "#9d9d9d"
