# Ported from Ghostty's bundled "Noctis Azureus" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Noctis Azureus"
appearance = "dark"

[palette]
bg = "#07273b"
surface = "#051c2a"
elevated = "#203d4f"
fg = "#becfda"
fg_muted = "#7e94a2"
accent = "#60b6eb"
accent_fg = "#000000"
selection_bg = "#103850"
selection_fg = "#becfda"
match_fg = "#e798b3"
border = "#2c495b"
separator = "#203d4f80"
danger = "#e66533"
warning = "#e4b781"
success = "#49e9a6"
info = "#49ace9"
badge_bg = "#203d4f"
badge_fg = "#becfda"

[states.selected]
bg = "#103850"
fg = "#becfda"
[states.hover]
bg = "#203d4f"
[states.disabled]
fg = "#7e94a2"

[footer]
hint_color = "#7e94a2"
