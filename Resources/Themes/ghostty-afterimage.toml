# Ported from Ghostty's bundled "Afterimage" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Afterimage"
appearance = "light"

[palette]
bg = "#fff7fb"
surface = "#f2ebee"
elevated = "#fffbfd"
fg = "#211522"
fg_muted = "#6f646e"
accent = "#143b77"
accent_fg = "#ffffff"
selection_bg = "#ecdde6"
selection_fg = "#211522"
match_fg = "#623080"
border = "#d3cad0"
separator = "#fffbfd80"
danger = "#881f3b"
warning = "#695000"
success = "#175b36"
info = "#1a478e"
badge_bg = "#fffbfd"
badge_fg = "#211522"

[states.selected]
bg = "#ecdde6"
fg = "#211522"
[states.hover]
bg = "#fffbfd"
[states.disabled]
fg = "#6f646e"

[window]
material = "popover"

[footer]
hint_color = "#6f646e"
