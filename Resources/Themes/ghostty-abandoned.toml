# Ported from Ghostty's bundled "Abandoned" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Abandoned"
appearance = "dark"

[palette]
bg = "#433d2d"
surface = "#302c20"
elevated = "#565042"
fg = "#eee9d7"
fg_muted = "#b2ad9c"
accent = "#9cb9c1"
accent_fg = "#000000"
selection_bg = "#c9c8b8"
selection_fg = "#555249"
match_fg = "#bea6b4"
border = "#655f4f"
separator = "#56504280"
danger = "#e69a79"
warning = "#d7c06e"
success = "#9db692"
info = "#8eafb8"
badge_bg = "#565042"
badge_fg = "#eee9d7"

[states.selected]
bg = "#c9c8b8"
fg = "#555249"
[states.hover]
bg = "#565042"
[states.disabled]
fg = "#b2ad9c"

[footer]
hint_color = "#b2ad9c"
