# Ported from Ghostty's bundled "Pissed Off Pancakes" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Pissed Off Pancakes"
appearance = "dark"

[palette]
bg = "#1a1208"
surface = "#130d06"
elevated = "#312a21"
fg = "#f8edd7"
fg_muted = "#aaa08f"
accent = "#f4d35e"
accent_fg = "#000000"
selection_bg = "#5a3b1a"
selection_fg = "#fff7e8"
match_fg = "#cd8aff"
border = "#463e31"
separator = "#312a2180"
danger = "#db533e"
warning = "#e4b33f"
success = "#7cb85b"
info = "#4aa3ff"
badge_bg = "#312a21"
badge_fg = "#f8edd7"

[states.selected]
bg = "#5a3b1a"
fg = "#fff7e8"
[states.hover]
bg = "#312a21"
[states.disabled]
fg = "#aaa08f"

[footer]
hint_color = "#aaa08f"
