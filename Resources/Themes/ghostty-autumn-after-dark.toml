# Ported from Ghostty's bundled "Autumn After Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Autumn After Dark"
appearance = "dark"

[palette]
bg = "#57210d"
surface = "#3f1809"
elevated = "#683725"
fg = "#f8e9cf"
fg_muted = "#c0a38b"
accent = "#92c1d6"
accent_fg = "#000000"
selection_bg = "#cfbfb1"
selection_fg = "#524b3e"
match_fg = "#cea1b9"
border = "#774934"
separator = "#68372580"
danger = "#f18f67"
warning = "#e9bf55"
success = "#9ac47c"
info = "#83b8d0"
badge_bg = "#683725"
badge_fg = "#f8e9cf"

[states.selected]
bg = "#cfbfb1"
fg = "#524b3e"
[states.hover]
bg = "#683725"
[states.disabled]
fg = "#c0a38b"

[footer]
hint_color = "#c0a38b"
