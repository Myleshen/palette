# Ported from Ghostty's bundled "Canyon Walnut" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Canyon Walnut"
appearance = "dark"

[palette]
bg = "#332014"
surface = "#25170e"
elevated = "#47362c"
fg = "#f8e4c6"
fg_muted = "#b39f88"
accent = "#ffd27e"
accent_fg = "#000000"
selection_bg = "#8e684a"
selection_fg = "#fff8e8"
match_fg = "#ddb7eb"
border = "#5a4738"
separator = "#47362c80"
danger = "#ed9371"
warning = "#f2bb5f"
success = "#b3c98a"
info = "#8fbde7"
badge_bg = "#47362c"
badge_fg = "#f8e4c6"

[states.selected]
bg = "#8e684a"
fg = "#fff8e8"
[states.hover]
bg = "#47362c"
[states.disabled]
fg = "#b39f88"

[footer]
hint_color = "#b39f88"
