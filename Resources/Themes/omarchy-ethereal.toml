# Ported from Omarchy's bundled "Ethereal" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/ethereal/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Ethereal"
appearance = "dark"

[palette]
bg = "#060b1e"
surface = "#040816"
elevated = "#1f2334"
fg = "#ffcead"
fg_muted = "#a88a7b"
accent = "#7d82da"
accent_fg = "#000000"
selection_bg = "#ffcead"
selection_fg = "#060b1e"
match_fg = "#ead7e7"
border = "#38323b"
separator = "#1f233480"
danger = "#ED5B5A"
warning = "#E9BB4F"
success = "#92a593"
info = "#7d82d9"
badge_bg = "#1f2334"
badge_fg = "#ffcead"

[states.selected]
bg = "#ffcead"
fg = "#060b1e"
[states.hover]
bg = "#1f2334"
[states.disabled]
fg = "#a88a7b"

[footer]
hint_color = "#a88a7b"
