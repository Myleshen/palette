# Ported from Ghostty's bundled "Zacess Cream" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zacess Cream"
appearance = "light"

[palette]
bg = "#fdf6e3"
surface = "#f0ead8"
elevated = "#fefbf2"
fg = "#000000"
fg_muted = "#59564f"
accent = "#015ac2"
accent_fg = "#ffffff"
selection_bg = "#7401ca"
selection_fg = "#fdf6e3"
match_fg = "#a901a6"
border = "#cac5b6"
separator = "#fefbf280"
danger = "#c1000a"
warning = "#815601"
success = "#016f1b"
info = "#015ac2"
badge_bg = "#fefbf2"
badge_fg = "#000000"

[states.selected]
bg = "#7401ca"
fg = "#fdf6e3"
[states.hover]
bg = "#fefbf2"
[states.disabled]
fg = "#59564f"

[window]
material = "popover"

[footer]
hint_color = "#59564f"
