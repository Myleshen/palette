# Ported from Ghostty's bundled "Salem" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Salem"
appearance = "dark"

[palette]
bg = "#0f2a33"
surface = "#0b1e25"
elevated = "#273f47"
fg = "#e6dcc1"
fg_muted = "#9b9e8f"
accent = "#94b9f4"
accent_fg = "#000000"
selection_bg = "#29434e"
selection_fg = "#fff4da"
match_fg = "#c98de0"
border = "#3a4e4f"
separator = "#273f4780"
danger = "#e36b61"
warning = "#e6bc62"
success = "#94c17f"
info = "#78a9f0"
badge_bg = "#273f47"
badge_fg = "#e6dcc1"

[states.selected]
bg = "#29434e"
fg = "#fff4da"
[states.hover]
bg = "#273f47"
[states.disabled]
fg = "#9b9e8f"

[footer]
hint_color = "#9b9e8f"
