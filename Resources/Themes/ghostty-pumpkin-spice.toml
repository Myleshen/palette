# Ported from Ghostty's bundled "Pumpkin Spice" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Pumpkin Spice"
appearance = "dark"

[palette]
bg = "#9a3d08"
surface = "#6f2c06"
elevated = "#a45021"
fg = "#ffffff"
fg_muted = "#f5c9a6"
accent = "#dfe8eb"
accent_fg = "#000000"
selection_bg = "#d7d3d1"
selection_fg = "#5d564a"
match_fg = "#dad3db"
border = "#ae6132"
separator = "#a4502180"
danger = "#dbd1ce"
warning = "#d9d4c8"
success = "#d1d7cf"
info = "#ced5d9"
badge_bg = "#a45021"
badge_fg = "#fff0d8"

[states.selected]
bg = "#d7d3d1"
fg = "#5d564a"
[states.hover]
bg = "#a45021"
[states.disabled]
fg = "#dcb18f"

[footer]
hint_color = "#dcb18f"
