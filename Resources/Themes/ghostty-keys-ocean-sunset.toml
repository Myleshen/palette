# Ported from Ghostty's bundled "Keys Ocean Sunset" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Keys Ocean Sunset"
appearance = "dark"

[palette]
bg = "#0a1018"
surface = "#070c11"
elevated = "#23282f"
fg = "#b8c8dc"
fg_muted = "#7b8897"
accent = "#fc9077"
accent_fg = "#000000"
selection_bg = "#1a2430"
selection_fg = "#fff5be"
match_fg = "#fdbfde"
border = "#2d353f"
separator = "#23282f80"
danger = "#e85a52"
warning = "#e89a2e"
success = "#4a9a72"
info = "#5288b8"
badge_bg = "#23282f"
badge_fg = "#b8c8dc"

[states.selected]
bg = "#1a2430"
fg = "#fff5be"
[states.hover]
bg = "#23282f"
[states.disabled]
fg = "#7b8897"

[footer]
hint_color = "#7b8897"
