# Ported from Ghostty's bundled "Hardcore" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Hardcore"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#a0a0a0"
fg_muted = "#7d7c7c"
accent = "#66d9ef"
accent_fg = "#000000"
selection_bg = "#453b39"
selection_fg = "#b6bbc0"
match_fg = "#9e6ffe"
border = "#2e2e2e"
separator = "#2a2a2a80"
danger = "#f92672"
warning = "#fd971f"
success = "#a6e22e"
info = "#66d9ef"
badge_bg = "#2a2a2a"
badge_fg = "#a0a0a0"

[states.selected]
bg = "#453b39"
fg = "#b6bbc0"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#6e6e6e"

[footer]
hint_color = "#6e6e6e"
