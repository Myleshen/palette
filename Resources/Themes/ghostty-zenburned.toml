# Ported from Ghostty's bundled "Zenburned" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Zenburned"
appearance = "dark"

[palette]
bg = "#404040"
surface = "#2e2e2e"
elevated = "#535353"
fg = "#f0e4cf"
fg_muted = "#b2ab9d"
accent = "#84cfff"
accent_fg = "#000000"
selection_bg = "#746956"
selection_fg = "#f4eadb"
match_fg = "#cf86c1"
border = "#63615d"
separator = "#53535380"
danger = "#e3716e"
warning = "#b77e64"
success = "#819b69"
info = "#6099c0"
badge_bg = "#535353"
badge_fg = "#f0e4cf"

[states.selected]
bg = "#746956"
fg = "#f4eadb"
[states.hover]
bg = "#535353"
[states.disabled]
fg = "#b2ab9d"

[footer]
hint_color = "#b2ab9d"
