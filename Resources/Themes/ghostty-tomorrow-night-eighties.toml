# Ported from Ghostty's bundled "Tomorrow Night Eighties" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Tomorrow Night Eighties"
appearance = "dark"

[palette]
bg = "#2d2d2d"
surface = "#202020"
elevated = "#424242"
fg = "#cccccc"
fg_muted = "#949494"
accent = "#6699cc"
accent_fg = "#000000"
selection_bg = "#515151"
selection_fg = "#cccccc"
match_fg = "#cc99cc"
border = "#4d4d4d"
separator = "#42424280"
danger = "#f2777a"
warning = "#ffcc66"
success = "#99cc99"
info = "#6699cc"
badge_bg = "#424242"
badge_fg = "#cccccc"

[states.selected]
bg = "#515151"
fg = "#cccccc"
[states.hover]
bg = "#424242"
[states.disabled]
fg = "#949494"

[footer]
hint_color = "#949494"
