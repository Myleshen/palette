# Ported from Ghostty's bundled "Lumina Vitrail Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Vitrail Dark"
appearance = "dark"

[palette]
bg = "#070912"
surface = "#05060d"
elevated = "#20222a"
fg = "#f1eee6"
fg_muted = "#9f9e9c"
accent = "#97b6ff"
accent_fg = "#000000"
selection_bg = "#1f2946"
selection_fg = "#f1eee6"
match_fg = "#efb2ff"
border = "#36373c"
separator = "#20222a80"
danger = "#ff763b"
warning = "#fbca3f"
success = "#76d983"
info = "#7299ff"
badge_bg = "#20222a"
badge_fg = "#f1eee6"

[states.selected]
bg = "#1f2946"
fg = "#f1eee6"
[states.hover]
bg = "#20222a"
[states.disabled]
fg = "#9f9e9c"

[footer]
hint_color = "#9f9e9c"
