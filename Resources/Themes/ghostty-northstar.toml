# Ported from Ghostty's bundled "Northstar" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Northstar"
appearance = "dark"

[palette]
bg = "#0b0f1a"
surface = "#080b13"
elevated = "#232731"
fg = "#f5f7fb"
fg_muted = "#a3a6ac"
accent = "#fcd34d"
accent_fg = "#000000"
selection_bg = "#1f2937"
selection_fg = "#ffffff"
match_fg = "#e5b0f8"
border = "#3a3d47"
separator = "#23273180"
danger = "#ff6f73"
warning = "#f7d66d"
success = "#6ed99a"
info = "#7ea8ff"
badge_bg = "#232731"
badge_fg = "#f5f7fb"

[states.selected]
bg = "#1f2937"
fg = "#ffffff"
[states.hover]
bg = "#232731"
[states.disabled]
fg = "#a3a6ac"

[footer]
hint_color = "#a3a6ac"
