# Ported from Ghostty's bundled "Karma Dark HC" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Karma Dark HC"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#fce566"
accent_fg = "#000000"
selection_bg = "#4d4a5e"
selection_fg = "#ffffff"
match_fg = "#cab6f4"
border = "#333333"
separator = "#1a1a1a80"
danger = "#ff5c87"
warning = "#fce566"
success = "#80e598"
info = "#61dceb"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#4d4a5e"
fg = "#ffffff"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
