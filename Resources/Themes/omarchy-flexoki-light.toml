# Ported from Omarchy's bundled "Flexoki Light" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/flexoki-light/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Flexoki Light"
appearance = "light"

[palette]
bg = "#fffcf0"
surface = "#f2efe4"
elevated = "#fffef9"
fg = "#100f0f"
fg_muted = "#64625e"
accent = "#205ea6"
accent_fg = "#ffffff"
selection_bg = "#cecdc3"
selection_fg = "#100f0f"
match_fg = "#CE5D97"
border = "#cfcdc3"
separator = "#fffef980"
danger = "#D14D41"
warning = "#b68d00"
success = "#879A39"
info = "#205EA6"
badge_bg = "#fffef9"
badge_fg = "#100f0f"

[states.selected]
bg = "#cecdc3"
fg = "#100f0f"
[states.hover]
bg = "#fffef9"
[states.disabled]
fg = "#64625e"

[window]
material = "popover"

[footer]
hint_color = "#64625e"
