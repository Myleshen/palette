# Ported from Ghostty's bundled "Unalive 'Em All" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Unalive 'Em All"
appearance = "dark"

[palette]
bg = "#110c0b"
surface = "#0c0908"
elevated = "#292423"
fg = "#eee3dd"
fg_muted = "#a19893"
accent = "#96c3fa"
accent_fg = "#000000"
selection_bg = "#3f2223"
selection_fg = "#fff4e8"
match_fg = "#dba8e9"
border = "#3d3735"
separator = "#29242380"
danger = "#ec514a"
warning = "#e7b75d"
success = "#81bb7a"
info = "#78aef0"
badge_bg = "#292423"
badge_fg = "#eee3dd"

[states.selected]
bg = "#3f2223"
fg = "#fff4e8"
[states.hover]
bg = "#292423"
[states.disabled]
fg = "#a19893"

[footer]
hint_color = "#a19893"
