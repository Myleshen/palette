# Ported from Ghostty's bundled "Merino Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Merino Dark"
appearance = "dark"

[palette]
bg = "#0d1117"
surface = "#090c11"
elevated = "#25292e"
fg = "#e6edf3"
fg_muted = "#9aa0a6"
accent = "#79c0ff"
accent_fg = "#000000"
selection_bg = "#e6edf3"
selection_fg = "#0d1117"
match_fg = "#d2a8ff"
border = "#383d43"
separator = "#25292e80"
danger = "#ff7b72"
warning = "#d29922"
success = "#3fb950"
info = "#58a6ff"
badge_bg = "#25292e"
badge_fg = "#e6edf3"

[states.selected]
bg = "#e6edf3"
fg = "#0d1117"
[states.hover]
bg = "#25292e"
[states.disabled]
fg = "#9aa0a6"

[footer]
hint_color = "#9aa0a6"
