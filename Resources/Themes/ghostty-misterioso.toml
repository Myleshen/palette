# Ported from Ghostty's bundled "Misterioso" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Misterioso"
appearance = "dark"

[palette]
bg = "#2d3743"
surface = "#202830"
elevated = "#424b56"
fg = "#e1e1e0"
fg_muted = "#a2a6a9"
accent = "#23d7d7"
accent_fg = "#000000"
selection_bg = "#2d37ff"
selection_fg = "#d6d6d6"
match_fg = "#ff37ff"
border = "#515962"
separator = "#424b5680"
danger = "#ff4242"
warning = "#ffad29"
success = "#74af68"
info = "#338f86"
badge_bg = "#424b56"
badge_fg = "#e1e1e0"

[states.selected]
bg = "#2d37ff"
fg = "#d6d6d6"
[states.hover]
bg = "#424b56"
[states.disabled]
fg = "#a2a6a9"

[footer]
hint_color = "#a2a6a9"
