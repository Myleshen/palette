# Ported from Ghostty's bundled "Jellybeans" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Jellybeans"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#dedede"
fg_muted = "#979797"
accent = "#b1d8f6"
accent_fg = "#000000"
selection_bg = "#474e91"
selection_fg = "#f4f4f4"
match_fg = "#fbdaff"
border = "#3b3b3b"
separator = "#2a2a2a80"
danger = "#e27373"
warning = "#ffba7b"
success = "#94b979"
info = "#97bedc"
badge_bg = "#2a2a2a"
badge_fg = "#dedede"

[states.selected]
bg = "#474e91"
fg = "#f4f4f4"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#979797"

[footer]
hint_color = "#979797"
