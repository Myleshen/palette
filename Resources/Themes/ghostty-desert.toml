# Ported from Ghostty's bundled "Desert" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Desert"
appearance = "dark"

[palette]
bg = "#333333"
surface = "#252525"
elevated = "#474747"
fg = "#ffffff"
fg_muted = "#b8b8b8"
accent = "#00ff00"
accent_fg = "#000000"
selection_bg = "#b5d5ff"
selection_fg = "#000000"
match_fg = "#ffdead"
border = "#5c5c5c"
separator = "#47474780"
danger = "#ff2b2b"
warning = "#f0e68c"
success = "#98fb98"
info = "#cd853f"
badge_bg = "#474747"
badge_fg = "#ffffff"

[states.selected]
bg = "#b5d5ff"
fg = "#000000"
[states.hover]
bg = "#474747"
[states.disabled]
fg = "#b8b8b8"

[footer]
hint_color = "#b8b8b8"
