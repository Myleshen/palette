# Ported from Ghostty's bundled "Ayu Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
name = "Ghostty · Ayu Light"
appearance = "light"

[palette]
bg = "#f8f9fa"
surface = "#eceded"
elevated = "#fcfcfd"
fg = "#4d5156"
fg_muted = "#707377"
accent = "#0070af"
accent_fg = "#ececec"
selection_bg = "#035bd6"
selection_fg = "#f8f9fa"
match_fg = "#9e75c7"
border = "#d9dbdc"
separator = "#fcfcfd80"
danger = "#e7696b"
warning = "#c48308"
success = "#51a322"
info = "#2f97df"
badge_bg = "#fcfcfd"
badge_fg = "#5c6166"

[states.selected]
bg = "#035bd6"
fg = "#f8f9fa"
[states.hover]
bg = "#fcfcfd"
[states.disabled]
fg = "#8c9094"

[window]
material = "popover"

[footer]
hint_color = "#8c9094"
