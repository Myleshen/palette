# Ported from Ghostty's bundled "Kitty Low Contrast" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Kitty Low Contrast"
appearance = "dark"

[palette]
bg = "#333333"
surface = "#252525"
elevated = "#474747"
fg = "#ffffff"
fg_muted = "#b8b8b8"
accent = "#7db8ff"
accent_fg = "#000000"
selection_bg = "#fffacd"
selection_fg = "#000000"
match_fg = "#fd28ff"
border = "#5c5c5c"
separator = "#47474780"
danger = "#e93528"
warning = "#cecb00"
success = "#19cb00"
info = "#1f7ed7"
badge_bg = "#474747"
badge_fg = "#ffffff"

[states.selected]
bg = "#fffacd"
fg = "#000000"
[states.hover]
bg = "#474747"
[states.disabled]
fg = "#b8b8b8"

[footer]
hint_color = "#b8b8b8"
