# Ported from Ghostty's bundled "Nephrite Jade" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Nephrite Jade"
appearance = "dark"

[palette]
bg = "#132e20"
surface = "#0e2117"
elevated = "#2b4336"
fg = "#e7f2eb"
fg_muted = "#9dada4"
accent = "#96c9fe"
accent_fg = "#000000"
selection_bg = "#3c5346"
selection_fg = "#e7f2eb"
match_fg = "#d5b2ff"
border = "#3d5549"
separator = "#2b433680"
danger = "#ffaaa7"
warning = "#e0c262"
success = "#4dbf74"
info = "#96c9fe"
badge_bg = "#2b4336"
badge_fg = "#e7f2eb"

[states.selected]
bg = "#3c5346"
fg = "#e7f2eb"
[states.hover]
bg = "#2b4336"
[states.disabled]
fg = "#9dada4"

[footer]
hint_color = "#9dada4"
