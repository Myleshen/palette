# Ported from Ghostty's bundled "Molten Core" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Molten Core"
appearance = "dark"

[palette]
bg = "#0a0908"
surface = "#070606"
elevated = "#232221"
fg = "#f8f8f2"
fg_muted = "#a5a4a0"
accent = "#ffc37a"
accent_fg = "#000000"
selection_bg = "#392217"
selection_fg = "#fff2df"
match_fg = "#eca4f5"
border = "#3a3937"
separator = "#23222180"
danger = "#ff6b57"
warning = "#ffbf47"
success = "#68d391"
info = "#79aaff"
badge_bg = "#232221"
badge_fg = "#f8f8f2"

[states.selected]
bg = "#392217"
fg = "#fff2df"
[states.hover]
bg = "#232221"
[states.disabled]
fg = "#a5a4a0"

[footer]
hint_color = "#a5a4a0"
