# Ported from Ghostty's bundled "Blood Moon" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Blood Moon"
appearance = "dark"

[palette]
bg = "#4b080d"
surface = "#360609"
elevated = "#5d2125"
fg = "#fff0dc"
fg_muted = "#c09f94"
accent = "#a8cbe2"
accent_fg = "#000000"
selection_bg = "#741b22"
selection_fg = "#fff8ec"
match_fg = "#dab0c7"
border = "#6f3636"
separator = "#5d212580"
danger = "#f17c78"
warning = "#e5c36b"
success = "#9cca8e"
info = "#8db9d8"
badge_bg = "#5d2125"
badge_fg = "#fff0dc"

[states.selected]
bg = "#741b22"
fg = "#fff8ec"
[states.hover]
bg = "#5d2125"
[states.disabled]
fg = "#c09f94"

[footer]
hint_color = "#c09f94"
