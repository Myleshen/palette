# Ported from Ghostty's bundled "Lumina Harbor Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Harbor Light"
appearance = "light"

[palette]
bg = "#fbf5ec"
surface = "#eee9e0"
elevated = "#fdfbf6"
fg = "#1c2d4f"
fg_muted = "#697184"
accent = "#005486"
accent_fg = "#ffffff"
selection_bg = "#e3bcce"
selection_fg = "#1c2d4f"
match_fg = "#713b7d"
border = "#cecdcd"
separator = "#fdfbf680"
danger = "#8c1c1d"
warning = "#a25f06"
success = "#19784d"
info = "#0468a4"
badge_bg = "#fdfbf6"
badge_fg = "#1c2d4f"

[states.selected]
bg = "#e3bcce"
fg = "#1c2d4f"
[states.hover]
bg = "#fdfbf6"
[states.disabled]
fg = "#6a7386"

[window]
material = "popover"

[footer]
hint_color = "#6a7386"
