# Ported from Ghostty's bundled "Rhoads Legacy" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Rhoads Legacy"
appearance = "dark"

[palette]
bg = "#0a0614"
surface = "#07040e"
elevated = "#231f2c"
fg = "#c4b5fd"
fg_muted = "#8378ab"
accent = "#f4d03f"
accent_fg = "#000000"
selection_bg = "#4c1d95"
selection_fg = "#fff7d6"
match_fg = "#e9d5ff"
border = "#2f2943"
separator = "#231f2c80"
danger = "#7c3aed"
warning = "#f4d03f"
success = "#d946ef"
info = "#6366f1"
badge_bg = "#231f2c"
badge_fg = "#c4b5fd"

[states.selected]
bg = "#4c1d95"
fg = "#fff7d6"
[states.hover]
bg = "#231f2c"
[states.disabled]
fg = "#8378ab"

[footer]
hint_color = "#8378ab"
