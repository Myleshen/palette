# Ported from Ghostty's bundled "Twilight" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Twilight"
appearance = "dark"

[palette]
bg = "#141414"
surface = "#0e0e0e"
elevated = "#2c2c2c"
fg = "#ffffd4"
fg_muted = "#adad91"
accent = "#5a5e62"
accent_fg = "#ffffff"
selection_bg = "#313131"
selection_fg = "#ffffd4"
match_fg = "#d0dc8e"
border = "#43433a"
separator = "#2c2c2c80"
danger = "#c06d44"
warning = "#c2a86c"
success = "#afb97a"
info = "#44474a"
badge_bg = "#2c2c2c"
badge_fg = "#ffffd4"

[states.selected]
bg = "#313131"
fg = "#ffffd4"
[states.hover]
bg = "#2c2c2c"
[states.disabled]
fg = "#adad91"

[footer]
hint_color = "#adad91"
