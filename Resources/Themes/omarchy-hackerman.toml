# Ported from Omarchy's bundled "Hackerman" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/hackerman/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Hackerman"
appearance = "dark"

[palette]
bg = "#0b0c16"
surface = "#080910"
elevated = "#23242d"
fg = "#ddf7ff"
fg_muted = "#94a5ad"
accent = "#82fb9c"
accent_fg = "#000000"
selection_bg = "#ddf7ff"
selection_fg = "#0b0c16"
match_fg = "#cddbf4"
border = "#353b45"
separator = "#23242d80"
danger = "#50f872"
warning = "#50f7d4"
success = "#4fe88f"
info = "#829dd4"
badge_bg = "#23242d"
badge_fg = "#ddf7ff"

[states.selected]
bg = "#ddf7ff"
fg = "#0b0c16"
[states.hover]
bg = "#23242d"
[states.disabled]
fg = "#94a5ad"

[footer]
hint_color = "#94a5ad"
