# Ported from Ghostty's bundled "Motel Vacancy" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Motel Vacancy"
appearance = "dark"

[palette]
bg = "#10070d"
surface = "#0c0509"
elevated = "#282025"
fg = "#f8edf4"
fg_muted = "#a79ca3"
accent = "#abc7ef"
accent_fg = "#000000"
selection_bg = "#3a1c2c"
selection_fg = "#fff5fa"
match_fg = "#e5b9eb"
border = "#3e353b"
separator = "#28202580"
danger = "#f3838e"
warning = "#ebca69"
success = "#7bd09e"
info = "#8db2e8"
badge_bg = "#282025"
badge_fg = "#f8edf4"

[states.selected]
bg = "#3a1c2c"
fg = "#fff5fa"
[states.hover]
bg = "#282025"
[states.disabled]
fg = "#a79ca3"

[footer]
hint_color = "#a79ca3"
