# Ported from Ghostty's bundled "Hocus Pocus" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Hocus Pocus"
appearance = "dark"

[palette]
bg = "#431455"
surface = "#300e3d"
elevated = "#562c66"
fg = "#f6edff"
fg_muted = "#b7a1c3"
accent = "#9cc8eb"
accent_fg = "#000000"
selection_bg = "#c9bad0"
selection_fg = "#4b4750"
match_fg = "#d795e7"
border = "#673f77"
separator = "#562c6680"
danger = "#f18b8c"
warning = "#e9c657"
success = "#9bd674"
info = "#8fc1e8"
badge_bg = "#562c66"
badge_fg = "#f6edff"

[states.selected]
bg = "#c9bad0"
fg = "#4b4750"
[states.hover]
bg = "#562c66"
[states.disabled]
fg = "#b7a1c3"

[footer]
hint_color = "#b7a1c3"
