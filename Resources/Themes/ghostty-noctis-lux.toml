# Ported from Ghostty's bundled "Noctis Lux" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Noctis Lux"
appearance = "light"

[palette]
bg = "#fef8ec"
surface = "#f1ece0"
elevated = "#fffcf6"
fg = "#005661"
fg_muted = "#467b7f"
accent = "#006fb7"
accent_fg = "#ededed"
selection_bg = "#f4e2b8"
selection_fg = "#005661"
match_fg = "#ff5792"
border = "#cbd8d0"
separator = "#fffcf680"
danger = "#e34e1c"
warning = "#d17c00"
success = "#00a560"
info = "#0094f0"
badge_bg = "#fffcf6"
badge_fg = "#005661"

[states.selected]
bg = "#f4e2b8"
fg = "#005661"
[states.hover]
bg = "#fffcf6"
[states.disabled]
fg = "#598f92"

[window]
material = "popover"

[footer]
hint_color = "#598f92"
