# Ported from Ghostty's bundled "Arizona Monsoon" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Arizona Monsoon"
appearance = "dark"

[palette]
bg = "#0a0f14"
surface = "#070b0e"
elevated = "#23272c"
fg = "#e6e8ed"
fg_muted = "#999ca1"
accent = "#f4d06f"
accent_fg = "#000000"
selection_bg = "#334155"
selection_fg = "#e6e8ed"
match_fg = "#d48cff"
border = "#363a3f"
separator = "#23272c80"
danger = "#e35d4a"
warning = "#e6b441"
success = "#7cc46b"
info = "#5b9dff"
badge_bg = "#23272c"
badge_fg = "#e6e8ed"

[states.selected]
bg = "#334155"
fg = "#e6e8ed"
[states.hover]
bg = "#23272c"
[states.disabled]
fg = "#999ca1"

[footer]
hint_color = "#999ca1"
