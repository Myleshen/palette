# Ported from Ghostty's bundled "Grey Green" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Grey Green"
appearance = "dark"

[palette]
bg = "#002a1a"
surface = "#001e13"
elevated = "#1a3f31"
fg = "#ffffff"
fg_muted = "#a6b4af"
accent = "#fff400"
accent_fg = "#000000"
selection_bg = "#517e50"
selection_fg = "#fafafa"
match_fg = "#ff00f0"
border = "#335548"
separator = "#1a3f3180"
danger = "#fe1414"
warning = "#f1ff01"
success = "#74ff00"
info = "#00deff"
badge_bg = "#1a3f31"
badge_fg = "#ffffff"

[states.selected]
bg = "#517e50"
fg = "#fafafa"
[states.hover]
bg = "#1a3f31"
[states.disabled]
fg = "#a6b4af"

[footer]
hint_color = "#a6b4af"
