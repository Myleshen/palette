# Ported from Ghostty's bundled "Prismatica" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Prismatica"
appearance = "dark"

[palette]
bg = "#10151e"
surface = "#0c0f16"
elevated = "#282c34"
fg = "#edf0f4"
fg_muted = "#a0a3a9"
accent = "#edcf7d"
accent_fg = "#000000"
selection_bg = "#3e3541"
selection_fg = "#edf0f4"
match_fg = "#dbaae0"
border = "#3c4149"
separator = "#282c3480"
danger = "#ef767d"
warning = "#ebc86b"
success = "#87c79c"
info = "#84b5ed"
badge_bg = "#282c34"
badge_fg = "#edf0f4"

[states.selected]
bg = "#3e3541"
fg = "#edf0f4"
[states.hover]
bg = "#282c34"
[states.disabled]
fg = "#a0a3a9"

[footer]
hint_color = "#a0a3a9"
