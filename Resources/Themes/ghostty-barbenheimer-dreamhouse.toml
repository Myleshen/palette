# Ported from Ghostty's bundled "Barbenheimer Dreamhouse" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Barbenheimer Dreamhouse"
appearance = "light"

[palette]
bg = "#fff8f0"
surface = "#f2ece4"
elevated = "#fffcf8"
fg = "#14140b"
fg_muted = "#66645b"
accent = "#f060a0"
accent_fg = "#000000"
selection_bg = "#14140b"
selection_fg = "#fff8f0"
match_fg = "#9b40b4"
border = "#d0cac2"
separator = "#fffcf880"
danger = "#f060a0"
warning = "#d1b161"
success = "#9bcc6a"
info = "#7ac1ed"
badge_bg = "#fffcf8"
badge_fg = "#14140b"

[states.selected]
bg = "#14140b"
fg = "#fff8f0"
[states.hover]
bg = "#fffcf8"
[states.disabled]
fg = "#66645b"

[window]
material = "popover"

[footer]
hint_color = "#66645b"
