# Ported from Ghostty's bundled "Afterglow" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Afterglow"
appearance = "dark"

[palette]
bg = "#212121"
surface = "#181818"
elevated = "#373737"
fg = "#d0d0d0"
fg_muted = "#939393"
accent = "#6c99bb"
accent_fg = "#000000"
selection_bg = "#303030"
selection_fg = "#d0d0d0"
match_fg = "#9f4e85"
border = "#444444"
separator = "#37373780"
danger = "#ac4142"
warning = "#e5b567"
success = "#7e8e50"
info = "#6c99bb"
badge_bg = "#373737"
badge_fg = "#d0d0d0"

[states.selected]
bg = "#303030"
fg = "#d0d0d0"
[states.hover]
bg = "#373737"
[states.disabled]
fg = "#939393"

[footer]
hint_color = "#939393"
