# Ported from Ghostty's bundled "traffic" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · traffic"
appearance = "dark"

[palette]
bg = "#272c30"
surface = "#1c2023"
elevated = "#3d4145"
fg = "#cfb9a8"
fg_muted = "#94887e"
accent = "#515e67"
accent_fg = "#ffffff"
selection_bg = "#cfb9a8"
selection_fg = "#272c30"
match_fg = "#715f5e"
border = "#494848"
separator = "#3d414580"
danger = "#934e46"
warning = "#c79e84"
success = "#637268"
info = "#515e67"
badge_bg = "#3d4145"
badge_fg = "#cfb9a8"

[states.selected]
bg = "#cfb9a8"
fg = "#272c30"
[states.hover]
bg = "#3d4145"
[states.disabled]
fg = "#94887e"

[footer]
hint_color = "#94887e"
