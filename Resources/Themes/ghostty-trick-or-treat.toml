# Ported from Ghostty's bundled "Trick or Treat" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Trick or Treat"
appearance = "dark"

[palette]
bg = "#40145f"
surface = "#2e0e44"
elevated = "#532c6f"
fg = "#fff0e3"
fg_muted = "#bca3b5"
accent = "#acd9f7"
accent_fg = "#000000"
selection_bg = "#642b82"
selection_fg = "#fff9f0"
match_fg = "#efaae3"
border = "#664079"
separator = "#532c6f80"
danger = "#ff8b82"
warning = "#f8c94e"
success = "#a8dc72"
info = "#8fc9f2"
badge_bg = "#532c6f"
badge_fg = "#fff0e3"

[states.selected]
bg = "#642b82"
fg = "#fff9f0"
[states.hover]
bg = "#532c6f"
[states.disabled]
fg = "#bca3b5"

[footer]
hint_color = "#bca3b5"
