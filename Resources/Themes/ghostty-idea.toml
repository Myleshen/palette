# Ported from Ghostty's bundled "Idea" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Idea"
appearance = "dark"

[palette]
bg = "#202020"
surface = "#171717"
elevated = "#363636"
fg = "#adadad"
fg_muted = "#7c7c7c"
accent = "#6c9ced"
accent_fg = "#000000"
selection_bg = "#44475a"
selection_fg = "#ffffff"
match_fg = "#fc7eff"
border = "#3c3c3c"
separator = "#36363680"
danger = "#fc5256"
warning = "#ccb444"
success = "#98b61c"
info = "#437ee7"
badge_bg = "#363636"
badge_fg = "#adadad"

[states.selected]
bg = "#44475a"
fg = "#ffffff"
[states.hover]
bg = "#363636"
[states.disabled]
fg = "#7c7c7c"

[footer]
hint_color = "#7c7c7c"
