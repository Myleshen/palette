# Ported from Ghostty's bundled "N0Tch2K" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: badge_fg was corrected to reach 4.5:1 against the badge background.
name = "Ghostty · N0Tch2K"
appearance = "dark"

[palette]
bg = "#222222"
surface = "#181818"
elevated = "#383838"
fg = "#a0a0a0"
fg_muted = "#747474"
accent = "#98bd5e"
accent_fg = "#000000"
selection_bg = "#4d4d4d"
selection_fg = "#ffffff"
match_fg = "#a3a3a3"
border = "#3b3b3b"
separator = "#38383880"
danger = "#a95551"
warning = "#a98051"
success = "#666666"
info = "#657d3e"
badge_bg = "#383838"
badge_fg = "#a4a4a4"

[states.selected]
bg = "#4d4d4d"
fg = "#ffffff"
[states.hover]
bg = "#383838"
[states.disabled]
fg = "#747474"

[footer]
hint_color = "#747474"
