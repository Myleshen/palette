# Ported from Ghostty's bundled "Mindcrime" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Mindcrime"
appearance = "dark"

[palette]
bg = "#19191c"
surface = "#121214"
elevated = "#303033"
fg = "#eee6dd"
fg_muted = "#a39e99"
accent = "#a8c4cf"
accent_fg = "#000000"
selection_bg = "#51413e"
selection_fg = "#fff9ed"
match_fg = "#d1b4c2"
border = "#444243"
separator = "#30303380"
danger = "#e5625a"
warning = "#d3aa77"
success = "#82baa0"
info = "#8daebc"
badge_bg = "#303033"
badge_fg = "#eee6dd"

[states.selected]
bg = "#51413e"
fg = "#fff9ed"
[states.hover]
bg = "#303033"
[states.disabled]
fg = "#a39e99"

[footer]
hint_color = "#a39e99"
