# Ported from Ghostty's bundled "Hurtado" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Hurtado"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#dbdbdb"
fg_muted = "#8e8e8e"
accent = "#89beff"
accent_fg = "#000000"
selection_bg = "#b5d5ff"
selection_fg = "#000000"
match_fg = "#fd5ff1"
border = "#2c2c2c"
separator = "#1a1a1a80"
danger = "#ff1b00"
warning = "#fbe74a"
success = "#a5e055"
info = "#496487"
badge_bg = "#1a1a1a"
badge_fg = "#dbdbdb"

[states.selected]
bg = "#b5d5ff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#8e8e8e"

[footer]
hint_color = "#8e8e8e"
