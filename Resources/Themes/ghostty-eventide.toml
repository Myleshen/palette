# Ported from Ghostty's bundled "Eventide" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Eventide"
appearance = "dark"

[palette]
bg = "#0b1220"
surface = "#080d17"
elevated = "#232a36"
fg = "#e6edf3"
fg_muted = "#99a0a9"
accent = "#9bbdff"
accent_fg = "#000000"
selection_bg = "#284361"
selection_fg = "#f5f8fc"
match_fg = "#dab6ff"
border = "#373e4a"
separator = "#232a3680"
danger = "#ff7272"
warning = "#ffd166"
success = "#62d6a5"
info = "#79aaff"
badge_bg = "#232a36"
badge_fg = "#e6edf3"

[states.selected]
bg = "#284361"
fg = "#f5f8fc"
[states.hover]
bg = "#232a36"
[states.disabled]
fg = "#99a0a9"

[footer]
hint_color = "#99a0a9"
