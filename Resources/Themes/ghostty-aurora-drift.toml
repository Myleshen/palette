# Ported from Ghostty's bundled "Aurora Drift" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Aurora Drift"
appearance = "dark"

[palette]
bg = "#050814"
surface = "#04060e"
elevated = "#1e212c"
fg = "#e6f1ff"
fg_muted = "#979fad"
accent = "#91bdff"
accent_fg = "#000000"
selection_bg = "#263449"
selection_fg = "#f7fbff"
match_fg = "#d9adff"
border = "#323743"
separator = "#1e212c80"
danger = "#ff6b6b"
warning = "#ffd166"
success = "#5fd9ad"
info = "#6ea8ff"
badge_bg = "#1e212c"
badge_fg = "#e6f1ff"

[states.selected]
bg = "#263449"
fg = "#f7fbff"
[states.hover]
bg = "#1e212c"
[states.disabled]
fg = "#979fad"

[footer]
hint_color = "#979fad"
