# Ported from Ghostty's bundled "JetBrains Darcula" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · JetBrains Darcula"
appearance = "dark"

[palette]
bg = "#202020"
surface = "#171717"
elevated = "#363636"
fg = "#adadad"
fg_muted = "#878786"
accent = "#6d9ef2"
accent_fg = "#000000"
selection_bg = "#1a3272"
selection_fg = "#adadad"
match_fg = "#fb82ff"
border = "#3c3c3c"
separator = "#36363680"
danger = "#fa5355"
warning = "#c2c300"
success = "#237a16"
info = "#4581eb"
badge_bg = "#363636"
badge_fg = "#adadad"

[states.selected]
bg = "#1a3272"
fg = "#adadad"
[states.hover]
bg = "#363636"
[states.disabled]
fg = "#7c7c7c"

[footer]
hint_color = "#7c7c7c"
