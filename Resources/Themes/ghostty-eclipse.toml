# Ported from Ghostty's bundled "Eclipse" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Eclipse"
appearance = "dark"

[palette]
bg = "#0e1116"
surface = "#0a0c10"
elevated = "#26292d"
fg = "#dce3ed"
fg_muted = "#949aa2"
accent = "#f6c45f"
accent_fg = "#000000"
selection_bg = "#25324a"
selection_fg = "#9c9ea1"
match_fg = "#ddbfff"
border = "#373b41"
separator = "#26292d80"
danger = "#ff6366"
warning = "#f1c655"
success = "#85df5e"
info = "#5fb9ff"
badge_bg = "#26292d"
badge_fg = "#dce3ed"

[states.selected]
bg = "#25324a"
fg = "#9c9ea1"
[states.hover]
bg = "#26292d"
[states.disabled]
fg = "#949aa2"

[footer]
hint_color = "#949aa2"
