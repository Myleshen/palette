# Ported from Ghostty's bundled "Under The Sea" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Under The Sea"
appearance = "dark"

[palette]
bg = "#011116"
surface = "#010c10"
elevated = "#1a292d"
fg = "#ffffff"
fg_muted = "#a6acad"
accent = "#61d5ba"
accent_fg = "#000000"
selection_bg = "#415555"
selection_fg = "#4dffda"
match_fg = "#1298ff"
border = "#344145"
separator = "#1a292d80"
danger = "#b2302d"
warning = "#59819c"
success = "#00a941"
info = "#459a86"
badge_bg = "#1a292d"
badge_fg = "#ffffff"

[states.selected]
bg = "#415555"
fg = "#4dffda"
[states.hover]
bg = "#1a292d"
[states.disabled]
fg = "#a6acad"

[footer]
hint_color = "#a6acad"
