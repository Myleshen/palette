# Ported from Omarchy's bundled "Osaka Jade" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/osaka-jade/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Omarchy · Osaka Jade"
appearance = "dark"

[palette]
bg = "#111c18"
surface = "#0c1411"
elevated = "#29332f"
fg = "#c1c497"
fg_muted = "#83896b"
accent = "#509475"
accent_fg = "#000000"
selection_bg = "#c1c497"
selection_fg = "#111c18"
match_fg = "#75bbb3"
border = "#343e31"
separator = "#29332f80"
danger = "#FF5345"
warning = "#459451"
success = "#549e6a"
info = "#509475"
badge_bg = "#29332f"
badge_fg = "#c1c497"

[states.selected]
bg = "#c1c497"
fg = "#111c18"
[states.hover]
bg = "#29332f"
[states.disabled]
fg = "#83896b"

[footer]
hint_color = "#83896b"
