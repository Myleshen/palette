# Ported from Ghostty's bundled "Kanagawa Dragon" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Kanagawa Dragon"
appearance = "dark"

[palette]
bg = "#181616"
surface = "#111010"
elevated = "#2f2d2d"
fg = "#c5c9c5"
fg_muted = "#888a88"
accent = "#7fb4ca"
accent_fg = "#000000"
selection_bg = "#c5c9c5"
selection_fg = "#181616"
match_fg = "#a292a3"
border = "#3b3a39"
separator = "#2f2d2d80"
danger = "#c4746e"
warning = "#c4b28a"
success = "#8a9a7b"
info = "#8ba4b0"
badge_bg = "#2f2d2d"
badge_fg = "#c5c9c5"

[states.selected]
bg = "#c5c9c5"
fg = "#181616"
[states.hover]
bg = "#2f2d2d"
[states.disabled]
fg = "#888a88"

[footer]
hint_color = "#888a88"
