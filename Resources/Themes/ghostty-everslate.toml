# Ported from Ghostty's bundled "everslate" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · everslate"
appearance = "dark"

[palette]
bg = "#191f21"
surface = "#121618"
elevated = "#303537"
fg = "#ede6d5"
fg_muted = "#a3a096"
accent = "#7fbbb3"
accent_fg = "#000000"
selection_bg = "#2c5561"
selection_fg = "#ede6d5"
match_fg = "#d699b6"
border = "#434745"
separator = "#30353780"
danger = "#cf7677"
warning = "#b7875a"
success = "#6e9e8b"
info = "#4196c7"
badge_bg = "#303537"
badge_fg = "#ede6d5"

[states.selected]
bg = "#2c5561"
fg = "#ede6d5"
[states.hover]
bg = "#303537"
[states.disabled]
fg = "#a3a096"

[footer]
hint_color = "#a3a096"
