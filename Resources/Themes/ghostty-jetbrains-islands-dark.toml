# Ported from Ghostty's bundled "JetBrains Islands Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · JetBrains Islands Dark"
appearance = "dark"

[palette]
bg = "#191a1c"
surface = "#121314"
elevated = "#303133"
fg = "#bcbec4"
fg_muted = "#838589"
accent = "#56a8f5"
accent_fg = "#000000"
selection_bg = "#2a4371"
selection_fg = "#d1d3d9"
match_fg = "#b189f5"
border = "#3a3b3e"
separator = "#30313380"
danger = "#f75464"
warning = "#cf8e6d"
success = "#6aab73"
info = "#56a8f5"
badge_bg = "#303133"
badge_fg = "#bcbec4"

[states.selected]
bg = "#2a4371"
fg = "#d1d3d9"
[states.hover]
bg = "#303133"
[states.disabled]
fg = "#838589"

[footer]
hint_color = "#838589"
