# Ported from Ghostty's bundled "Horizons" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Horizons"
appearance = "light"

[palette]
bg = "#f8fafc"
surface = "#ecedef"
elevated = "#fcfdfe"
fg = "#0f172a"
fg_muted = "#616674"
accent = "#123d82"
accent_fg = "#ffffff"
selection_bg = "#e2e8f0"
selection_fg = "#0f172a"
match_fg = "#65349a"
border = "#c9cdd2"
separator = "#fcfdfe80"
danger = "#761515"
warning = "#755600"
success = "#126b32"
info = "#174da6"
badge_bg = "#fcfdfe"
badge_fg = "#0f172a"

[states.selected]
bg = "#e2e8f0"
fg = "#0f172a"
[states.hover]
bg = "#fcfdfe"
[states.disabled]
fg = "#616674"

[window]
material = "popover"

[footer]
hint_color = "#616674"
