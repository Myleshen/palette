# Ported from Ghostty's bundled "Petrol Lagoon" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Petrol Lagoon"
appearance = "dark"

[palette]
bg = "#0c1618"
surface = "#091011"
elevated = "#242d2f"
fg = "#c2d8d8"
fg_muted = "#829495"
accent = "#7db8d8"
accent_fg = "#000000"
selection_bg = "#17393d"
selection_fg = "#dfeeee"
match_fg = "#b5a7dd"
border = "#303d3e"
separator = "#242d2f80"
danger = "#e0736e"
warning = "#d1b366"
success = "#6cc48e"
info = "#5b9fc4"
badge_bg = "#242d2f"
badge_fg = "#c2d8d8"

[states.selected]
bg = "#17393d"
fg = "#dfeeee"
[states.hover]
bg = "#242d2f"
[states.disabled]
fg = "#829495"

[footer]
hint_color = "#829495"
