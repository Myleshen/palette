# Ported from Ghostty's bundled "Poimandres Darker" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Poimandres Darker"
appearance = "dark"

[palette]
bg = "#16161e"
surface = "#101016"
elevated = "#2d2d34"
fg = "#a6accd"
fg_muted = "#747890"
accent = "#add7ff"
accent_fg = "#000000"
selection_bg = "#a6accd"
selection_fg = "#3d3d3d"
match_fg = "#fae4fc"
border = "#333441"
separator = "#2d2d3480"
danger = "#d0679d"
warning = "#fffac2"
success = "#5de4c7"
info = "#89ddff"
badge_bg = "#2d2d34"
badge_fg = "#a6accd"

[states.selected]
bg = "#a6accd"
fg = "#3d3d3d"
[states.hover]
bg = "#2d2d34"
[states.disabled]
fg = "#747890"

[footer]
hint_color = "#747890"
