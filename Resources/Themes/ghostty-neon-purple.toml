# Ported from Ghostty's bundled "Neon Purple" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Neon Purple"
appearance = "dark"

[palette]
bg = "#291b47"
surface = "#1e1333"
elevated = "#3e3259"
fg = "#e5e5e5"
fg_muted = "#a39eae"
accent = "#1bccfd"
accent_fg = "#000000"
selection_bg = "#c1deff"
selection_fg = "#000000"
match_fg = "#ff00f8"
border = "#4f4367"
separator = "#3e325980"
danger = "#cd0d76"
warning = "#fffa6a"
success = "#03eba5"
info = "#00bfff"
badge_bg = "#3e3259"
badge_fg = "#e5e5e5"

[states.selected]
bg = "#c1deff"
fg = "#000000"
[states.hover]
bg = "#3e3259"
[states.disabled]
fg = "#a39eae"

[footer]
hint_color = "#a39eae"
