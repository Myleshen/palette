# Ported from Ghostty's bundled "Mellifluous" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Mellifluous"
appearance = "dark"

[palette]
bg = "#1a1a1a"
surface = "#131313"
elevated = "#313131"
fg = "#dadada"
fg_muted = "#979797"
accent = "#a8a1be"
accent_fg = "#000000"
selection_bg = "#2d2d2d"
selection_fg = "#c0af8c"
match_fg = "#b39fb0"
border = "#404040"
separator = "#31313180"
danger = "#d29393"
warning = "#cbaa89"
success = "#b3b393"
info = "#a8a1be"
badge_bg = "#313131"
badge_fg = "#dadada"

[states.selected]
bg = "#2d2d2d"
fg = "#c0af8c"
[states.hover]
bg = "#313131"
[states.disabled]
fg = "#979797"

[footer]
hint_color = "#979797"
