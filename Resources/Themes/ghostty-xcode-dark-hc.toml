# Ported from Ghostty's bundled "Xcode Dark hc" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Xcode Dark hc"
appearance = "dark"

[palette]
bg = "#1f1f24"
surface = "#16161a"
elevated = "#35353a"
fg = "#ffffff"
fg_muted = "#b1b1b2"
accent = "#6bdfff"
accent_fg = "#000000"
selection_bg = "#43454b"
selection_fg = "#ffffff"
match_fg = "#ff85b8"
border = "#4c4c50"
separator = "#35353a80"
danger = "#ff8a7a"
warning = "#d9c668"
success = "#83c9bc"
info = "#4ec4e6"
badge_bg = "#35353a"
badge_fg = "#ffffff"

[states.selected]
bg = "#43454b"
fg = "#ffffff"
[states.hover]
bg = "#35353a"
[states.disabled]
fg = "#b1b1b2"

[footer]
hint_color = "#b1b1b2"
