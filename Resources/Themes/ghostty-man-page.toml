# Ported from Ghostty's bundled "Man Page" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Man Page"
appearance = "light"

[palette]
bg = "#fef49c"
surface = "#f1e894"
elevated = "#fffad2"
fg = "#000000"
fg_muted = "#595537"
accent = "#0000b2"
accent_fg = "#ffffff"
selection_bg = "#a4c9cd"
selection_fg = "#000000"
match_fg = "#b200b2"
border = "#cbc37d"
separator = "#fffad280"
danger = "#cc0000"
warning = "#919000"
success = "#00a200"
info = "#0000b2"
badge_bg = "#fffad2"
badge_fg = "#000000"

[states.selected]
bg = "#a4c9cd"
fg = "#000000"
[states.hover]
bg = "#fffad2"
[states.disabled]
fg = "#595537"

[window]
material = "popover"

[footer]
hint_color = "#595537"
