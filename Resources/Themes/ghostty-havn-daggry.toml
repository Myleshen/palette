# Ported from Ghostty's bundled "Havn Daggry" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Havn Daggry"
appearance = "light"

[palette]
bg = "#f8f9fb"
surface = "#ecedee"
elevated = "#fcfcfd"
fg = "#3b4a7a"
fg_muted = "#697292"
accent = "#3a577d"
accent_fg = "#ffffff"
selection_bg = "#cfe9dd"
selection_fg = "#313c64"
match_fg = "#7c5c97"
border = "#d2d6e1"
separator = "#fcfcfd80"
danger = "#985248"
warning = "#be6b00"
success = "#577159"
info = "#3a577d"
badge_bg = "#fcfcfd"
badge_fg = "#3b4a7a"

[states.selected]
bg = "#cfe9dd"
fg = "#313c64"
[states.hover]
bg = "#fcfcfd"
[states.disabled]
fg = "#7d87a7"

[window]
material = "popover"

[footer]
hint_color = "#7d87a7"
