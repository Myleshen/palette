# Ported from Ghostty's bundled "Citruszest" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Citruszest"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#bfbfbf"
fg_muted = "#828282"
accent = "#33cfff"
accent_fg = "#000000"
selection_bg = "#ff8c00"
selection_fg = "#3b3b3b"
match_fg = "#ffb2fe"
border = "#353535"
separator = "#2a2a2a80"
danger = "#ff5454"
warning = "#ffd400"
success = "#00cc7a"
info = "#00bfff"
badge_bg = "#2a2a2a"
badge_fg = "#bfbfbf"

[states.selected]
bg = "#ff8c00"
fg = "#3b3b3b"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#828282"

[footer]
hint_color = "#828282"
