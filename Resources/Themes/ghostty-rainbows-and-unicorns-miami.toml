# Ported from Ghostty's bundled "Rainbows and Unicorns Miami" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Rainbows and Unicorns Miami"
appearance = "dark"

[palette]
bg = "#1b1433"
surface = "#130e25"
elevated = "#322c47"
fg = "#f9ecf5"
fg_muted = "#aba0b1"
accent = "#a3d2ff"
accent_fg = "#000000"
selection_bg = "#ff6fd8"
selection_fg = "#1b1433"
match_fg = "#ffa3e8"
border = "#473f5a"
separator = "#322c4780"
danger = "#ff5c8a"
warning = "#ffe27a"
success = "#7cf0a8"
info = "#6fb7ff"
badge_bg = "#322c47"
badge_fg = "#f9ecf5"

[states.selected]
bg = "#ff6fd8"
fg = "#1b1433"
[states.hover]
bg = "#322c47"
[states.disabled]
fg = "#aba0b1"

[footer]
hint_color = "#aba0b1"
