# Ported from Ghostty's bundled "Mesa Blue" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Mesa Blue"
appearance = "dark"

[palette]
bg = "#164c72"
surface = "#103752"
elevated = "#2d5e80"
fg = "#fff0d7"
fg_muted = "#adb7b4"
accent = "#cee6f8"
accent_fg = "#000000"
selection_bg = "#35698b"
selection_fg = "#fff8e9"
match_fg = "#f3c7e0"
border = "#456d86"
separator = "#2d5e8080"
danger = "#ffad91"
warning = "#f6d67a"
success = "#9fdfad"
info = "#b7d9f4"
badge_bg = "#2d5e80"
badge_fg = "#fff0d7"

[states.selected]
bg = "#35698b"
fg = "#fff8e9"
[states.hover]
bg = "#2d5e80"
[states.disabled]
fg = "#adb7b4"

[footer]
hint_color = "#adb7b4"
