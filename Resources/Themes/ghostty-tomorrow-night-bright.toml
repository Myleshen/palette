# Ported from Ghostty's bundled "Tomorrow Night Bright" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Tomorrow Night Bright"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#eaeaea"
fg_muted = "#989898"
accent = "#7aa6da"
accent_fg = "#000000"
selection_bg = "#424242"
selection_fg = "#eaeaea"
match_fg = "#c397d8"
border = "#2f2f2f"
separator = "#1a1a1a80"
danger = "#d54e53"
warning = "#e7c547"
success = "#b9ca4a"
info = "#7aa6da"
badge_bg = "#1a1a1a"
badge_fg = "#eaeaea"

[states.selected]
bg = "#424242"
fg = "#eaeaea"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#989898"

[footer]
hint_color = "#989898"
