# Ported from Ghostty's bundled "Moonfly" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Moonfly"
appearance = "dark"

[palette]
bg = "#080808"
surface = "#060606"
elevated = "#212121"
fg = "#bdbdbd"
fg_muted = "#7e7e7e"
accent = "#74b2ff"
accent_fg = "#000000"
selection_bg = "#b2ceee"
selection_fg = "#080808"
match_fg = "#cf87e8"
border = "#2c2c2c"
separator = "#21212180"
danger = "#ff5454"
warning = "#e3c78a"
success = "#8cc85f"
info = "#80a0ff"
badge_bg = "#212121"
badge_fg = "#bdbdbd"

[states.selected]
bg = "#b2ceee"
fg = "#080808"
[states.hover]
bg = "#212121"
[states.disabled]
fg = "#7e7e7e"

[footer]
hint_color = "#7e7e7e"
