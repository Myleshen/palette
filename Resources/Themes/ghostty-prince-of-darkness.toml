# Ported from Ghostty's bundled "Prince of Darkness" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Prince of Darkness"
appearance = "dark"

[palette]
bg = "#0a0714"
surface = "#07050e"
elevated = "#23202c"
fg = "#dcd3ff"
fg_muted = "#928cad"
accent = "#9bb4ff"
accent_fg = "#000000"
selection_bg = "#43206b"
selection_fg = "#f2e6ff"
match_fg = "#e384ff"
border = "#343043"
separator = "#23202c80"
danger = "#7439c9"
warning = "#3ec7ff"
success = "#c43dff"
info = "#7a63ff"
badge_bg = "#23202c"
badge_fg = "#dcd3ff"

[states.selected]
bg = "#43206b"
fg = "#f2e6ff"
[states.hover]
bg = "#23202c"
[states.disabled]
fg = "#928cad"

[footer]
hint_color = "#928cad"
