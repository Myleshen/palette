# Ported from Ghostty's bundled "Synthwave" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Synthwave"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#dad9c7"
fg_muted = "#8e8d81"
accent = "#2f9ded"
accent_fg = "#000000"
selection_bg = "#19cde6"
selection_fg = "#000000"
match_fg = "#f97137"
border = "#2c2b28"
separator = "#1a1a1a80"
danger = "#f6188f"
warning = "#fdf834"
success = "#1ebb2b"
info = "#2186ec"
badge_bg = "#1a1a1a"
badge_fg = "#dad9c7"

[states.selected]
bg = "#19cde6"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#8e8d81"

[footer]
hint_color = "#8e8d81"
