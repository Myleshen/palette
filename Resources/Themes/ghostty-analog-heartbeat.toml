# Ported from Ghostty's bundled "Analog Heartbeat" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Analog Heartbeat"
appearance = "dark"

[palette]
bg = "#211f1c"
surface = "#181614"
elevated = "#373533"
fg = "#e6ddcb"
fg_muted = "#a19b8e"
accent = "#a8c4d6"
accent_fg = "#000000"
selection_bg = "#454034"
selection_fg = "#aeacaa"
match_fg = "#d0a9bd"
border = "#48453f"
separator = "#37353380"
danger = "#c96f64"
warning = "#d9ac63"
success = "#94b26a"
info = "#839eb2"
badge_bg = "#373533"
badge_fg = "#e6ddcb"

[states.selected]
bg = "#454034"
fg = "#aeacaa"
[states.hover]
bg = "#373533"
[states.disabled]
fg = "#a19b8e"

[footer]
hint_color = "#a19b8e"
