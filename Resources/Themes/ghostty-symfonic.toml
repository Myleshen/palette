# Ported from Ghostty's bundled "Symfonic" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Symfonic"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#0887d7"
accent_fg = "#000000"
selection_bg = "#073642"
selection_fg = "#ffffff"
match_fg = "#b729d9"
border = "#333333"
separator = "#1a1a1a80"
danger = "#dc322f"
warning = "#ff8400"
success = "#56db3a"
info = "#0084d4"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#073642"
fg = "#ffffff"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
