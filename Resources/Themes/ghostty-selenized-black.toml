# Ported from Ghostty's bundled "Selenized Black" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Selenized Black"
appearance = "dark"

[palette]
bg = "#181818"
surface = "#111111"
elevated = "#2f2f2f"
fg = "#b9b9b9"
fg_muted = "#818181"
accent = "#4f9cfe"
accent_fg = "#000000"
selection_bg = "#3b3b3b"
selection_fg = "#a8a8a8"
match_fg = "#ff81ca"
border = "#383838"
separator = "#2f2f2f80"
danger = "#ed4a46"
warning = "#dbb32d"
success = "#70b433"
info = "#368aeb"
badge_bg = "#2f2f2f"
badge_fg = "#b9b9b9"

[states.selected]
bg = "#3b3b3b"
fg = "#a8a8a8"
[states.hover]
bg = "#2f2f2f"
[states.disabled]
fg = "#818181"

[footer]
hint_color = "#818181"
