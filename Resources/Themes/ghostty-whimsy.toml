# Ported from Ghostty's bundled "Whimsy" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Whimsy"
appearance = "dark"

[palette]
bg = "#29283b"
surface = "#1e1d2a"
elevated = "#3e3e4f"
fg = "#b4b2d8"
fg_muted = "#8f8dad"
accent = "#65aff8"
accent_fg = "#000000"
selection_bg = "#3d3c58"
selection_fg = "#ffffff"
match_fg = "#aa7ff0"
border = "#45435a"
separator = "#3e3e4f80"
danger = "#ef6487"
warning = "#fdd877"
success = "#5eca89"
info = "#65aef7"
badge_bg = "#3e3e4f"
badge_fg = "#b3b0d6"

[states.selected]
bg = "#3d3c58"
fg = "#ffffff"
[states.hover]
bg = "#3e3e4f"
[states.disabled]
fg = "#8380a0"

[footer]
hint_color = "#8380a0"
