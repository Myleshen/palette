# Ported from Ghostty's bundled "SeedFlip Glacier" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · SeedFlip Glacier"
appearance = "light"

[palette]
bg = "#f8fafc"
surface = "#ecedef"
elevated = "#fcfdfe"
fg = "#0f172a"
fg_muted = "#616674"
accent = "#0f58bd"
accent_fg = "#ffffff"
selection_bg = "#fcfdfe"
selection_fg = "#0f172a"
match_fg = "#bd0fbd"
border = "#c9cdd2"
separator = "#fcfdfe80"
danger = "#bd0f0f"
warning = "#aa8f00"
success = "#00a83e"
info = "#0f58bd"
badge_bg = "#fcfdfe"
badge_fg = "#0f172a"

[states.selected]
bg = "#fcfdfe"
fg = "#0f172a"
[states.hover]
bg = "#fcfdfe"
[states.disabled]
fg = "#616674"

[window]
material = "popover"

[footer]
hint_color = "#616674"
