# Ported from Ghostty's bundled "iTerm2 Tango Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · iTerm2 Tango Dark"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#010101"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#84b0d8"
accent_fg = "#000000"
selection_bg = "#c1deff"
selection_fg = "#000000"
match_fg = "#bc94b7"
border = "#333333"
separator = "#1a1a1a80"
danger = "#d81e00"
warning = "#cfae00"
success = "#5ea702"
info = "#427ab3"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#c1deff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
