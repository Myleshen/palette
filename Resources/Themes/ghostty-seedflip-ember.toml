# Ported from Ghostty's bundled "SeedFlip Ember" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · SeedFlip Ember"
appearance = "dark"

[palette]
bg = "#0a0a0a"
surface = "#070707"
elevated = "#232323"
fg = "#ededed"
fg_muted = "#9e9e9e"
accent = "#89b6f5"
accent_fg = "#000000"
selection_bg = "#232323"
selection_fg = "#ededed"
match_fg = "#f589f5"
border = "#373737"
separator = "#23232380"
danger = "#f04242"
warning = "#f0d342"
success = "#42f07c"
info = "#428bf0"
badge_bg = "#232323"
badge_fg = "#ededed"

[states.selected]
bg = "#232323"
fg = "#ededed"
[states.hover]
bg = "#232323"
[states.disabled]
fg = "#9e9e9e"

[footer]
hint_color = "#9e9e9e"
