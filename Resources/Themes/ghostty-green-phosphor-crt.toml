# Ported from Ghostty's bundled "Green Phosphor CRT" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Green Phosphor CRT"
appearance = "dark"

[palette]
bg = "#0b0f0b"
surface = "#080b08"
elevated = "#232723"
fg = "#33ff33"
fg_muted = "#25ab25"
accent = "#33ff77"
accent_fg = "#000000"
selection_bg = "#0a3a0a"
selection_fg = "#9a9d9a"
match_fg = "#66ffaa"
border = "#133f13"
separator = "#23272380"
danger = "#00aa00"
warning = "#66ff66"
success = "#33ff33"
info = "#00cc44"
badge_bg = "#232723"
badge_fg = "#33ff33"

[states.selected]
bg = "#0a3a0a"
fg = "#9a9d9a"
[states.hover]
bg = "#232723"
[states.disabled]
fg = "#25ab25"

[footer]
hint_color = "#25ab25"
