# Ported from Ghostty's bundled "Firefly Traditional" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Firefly Traditional"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#f5f5f5"
fg_muted = "#9f9f9f"
accent = "#00f900"
accent_fg = "#000000"
selection_bg = "#cfeac6"
selection_fg = "#000000"
match_fg = "#ff5cfe"
border = "#313131"
separator = "#1a1a1a80"
danger = "#c23720"
warning = "#afad24"
success = "#33bc26"
info = "#5a63ff"
badge_bg = "#1a1a1a"
badge_fg = "#f5f5f5"

[states.selected]
bg = "#cfeac6"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#9f9f9f"

[footer]
hint_color = "#9f9f9f"
