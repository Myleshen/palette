# Ported from Ghostty's bundled "Laser" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
# Contrast note: badge_fg was corrected to reach 4.5:1 against the badge background.
name = "Ghostty · Laser"
appearance = "dark"

[palette]
bg = "#030d18"
surface = "#020911"
elevated = "#1c252f"
fg = "#f106e3"
fg_muted = "#a808a5"
accent = "#00ff9c"
accent_fg = "#000000"
selection_bg = "#2e206a"
selection_fg = "#f4f4f4"
match_fg = "#ffb2fe"
border = "#330c41"
separator = "#1c252f80"
danger = "#ff8373"
warning = "#09b4bd"
success = "#b4fb73"
info = "#fed300"
badge_bg = "#1c252f"
badge_fg = "#f324e6"

[states.selected]
bg = "#2e206a"
fg = "#f4f4f4"
[states.hover]
bg = "#1c252f"
[states.disabled]
fg = "#a808a5"

[footer]
hint_color = "#a808a5"
