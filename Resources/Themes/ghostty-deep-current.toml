# Ported from Ghostty's bundled "Deep Current" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Deep Current"
appearance = "dark"

[palette]
bg = "#08121f"
surface = "#060d16"
elevated = "#212a35"
fg = "#e2e8f0"
fg_muted = "#969da7"
accent = "#60a5fa"
accent_fg = "#000000"
selection_bg = "#334155"
selection_fg = "#e2e8f0"
match_fg = "#e879f9"
border = "#343d49"
separator = "#212a3580"
danger = "#ff4d6d"
warning = "#f59e0b"
success = "#22c55e"
info = "#3b82f6"
badge_bg = "#212a35"
badge_fg = "#e2e8f0"

[states.selected]
bg = "#334155"
fg = "#e2e8f0"
[states.hover]
bg = "#212a35"
[states.disabled]
fg = "#969da7"

[footer]
hint_color = "#969da7"
