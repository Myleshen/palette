# Ported from Ghostty's bundled "Miami Heat" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Miami Heat"
appearance = "dark"

[palette]
bg = "#120b2e"
surface = "#0d0821"
elevated = "#2a2343"
fg = "#fce7ff"
fg_muted = "#aa9ab6"
accent = "#29b6ff"
accent_fg = "#000000"
selection_bg = "#34215c"
selection_fg = "#9893aa"
match_fg = "#b86bff"
border = "#413758"
separator = "#2a234380"
danger = "#ff3d7f"
warning = "#ffcb52"
success = "#2ee6b6"
info = "#29b6ff"
badge_bg = "#2a2343"
badge_fg = "#fce7ff"

[states.selected]
bg = "#34215c"
fg = "#9893aa"
[states.hover]
bg = "#2a2343"
[states.disabled]
fg = "#aa9ab6"

[footer]
hint_color = "#aa9ab6"
