# Ported from Ghostty's bundled "High Voltage Highway" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · High Voltage Highway"
appearance = "dark"

[palette]
bg = "#151619"
surface = "#0f1012"
elevated = "#2c2d30"
fg = "#f1ece4"
fg_muted = "#a4a19d"
accent = "#99c1d9"
accent_fg = "#000000"
selection_bg = "#42363e"
selection_fg = "#f1ece4"
match_fg = "#d0afda"
border = "#414142"
separator = "#2c2d3080"
danger = "#e17a64"
warning = "#e6c277"
success = "#9ec49a"
info = "#8bb8d4"
badge_bg = "#2c2d30"
badge_fg = "#f1ece4"

[states.selected]
bg = "#42363e"
fg = "#f1ece4"
[states.hover]
bg = "#2c2d30"
[states.disabled]
fg = "#a4a19d"

[footer]
hint_color = "#a4a19d"
