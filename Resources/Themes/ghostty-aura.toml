# Ported from Ghostty's bundled "Aura" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Aura"
appearance = "dark"

[palette]
bg = "#15141b"
surface = "#0f0e13"
elevated = "#2c2c32"
fg = "#edecee"
fg_muted = "#a1a0a4"
accent = "#a47bff"
accent_fg = "#000000"
selection_bg = "#a277ff"
selection_fg = "#262626"
match_fg = "#a277ff"
border = "#403f45"
separator = "#2c2c3280"
danger = "#ff6767"
warning = "#ffca85"
success = "#61ffca"
info = "#a277ff"
badge_bg = "#2c2c32"
badge_fg = "#edecee"

[states.selected]
bg = "#a277ff"
fg = "#262626"
[states.hover]
bg = "#2c2c32"
[states.disabled]
fg = "#a1a0a4"

[footer]
hint_color = "#a1a0a4"
