# Ported from Ghostty's bundled "X Oslo" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: fg_muted was moved toward the foreground to reach 3:1 against the background.
# Contrast note: badge_fg was corrected to reach 4.5:1 against the badge background.
name = "Ghostty · X Oslo"
appearance = "dark"

[palette]
bg = "#3f4451"
surface = "#2d313a"
elevated = "#525762"
fg = "#abb2bf"
fg_muted = "#8a909d"
accent = "#4dc4ff"
accent_fg = "#000000"
selection_bg = "#abb2bf"
selection_fg = "#3f4451"
match_fg = "#de73ff"
border = "#555a67"
separator = "#52576280"
danger = "#e05561"
warning = "#d18f52"
success = "#8cc265"
info = "#4aa5f0"
badge_bg = "#525762"
badge_fg = "#c9ced6"

[states.selected]
bg = "#abb2bf"
fg = "#3f4451"
[states.hover]
bg = "#525762"
[states.disabled]
fg = "#8a909d"

[footer]
hint_color = "#8a909d"
