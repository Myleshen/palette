# Ported from Ghostty's bundled "Sequoia Retro Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Sequoia Retro Light"
appearance = "light"

[palette]
bg = "#edeef2"
surface = "#e1e2e6"
elevated = "#f7f7f9"
fg = "#282930"
fg_muted = "#6d6e74"
accent = "#456a82"
accent_fg = "#ffffff"
selection_bg = "#817c9c"
selection_fg = "#16171b"
match_fg = "#5f7982"
border = "#c6c7cb"
separator = "#f7f7f980"
danger = "#5f7982"
warning = "#bf5238"
success = "#4a704e"
info = "#456a82"
badge_bg = "#f7f7f9"
badge_fg = "#282930"

[states.selected]
bg = "#817c9c"
fg = "#16171b"
[states.hover]
bg = "#f7f7f9"
[states.disabled]
fg = "#6d6e74"

[window]
material = "popover"

[footer]
hint_color = "#6d6e74"
