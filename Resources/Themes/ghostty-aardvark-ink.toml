# Ported from Ghostty's bundled "Aardvark Ink" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Aardvark Ink"
appearance = "dark"

[palette]
bg = "#0f141f"
surface = "#0b0e16"
elevated = "#272c35"
fg = "#b4bcca"
fg_muted = "#7a818e"
accent = "#76a8f2"
accent_fg = "#000000"
selection_bg = "#2a3645"
selection_fg = "#dfe5ee"
match_fg = "#d58bf0"
border = "#303641"
separator = "#272c3580"
danger = "#c26265"
warning = "#ad9b49"
success = "#52aa60"
info = "#487fd4"
badge_bg = "#272c35"
badge_fg = "#b4bcca"

[states.selected]
bg = "#2a3645"
fg = "#dfe5ee"
[states.hover]
bg = "#272c35"
[states.disabled]
fg = "#7a818e"

[footer]
hint_color = "#7a818e"
