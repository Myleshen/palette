# Ported from Ghostty's bundled "Witching Hour" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Witching Hour"
appearance = "dark"

[palette]
bg = "#261044"
surface = "#1b0c31"
elevated = "#3c2857"
fg = "#f5edff"
fg_muted = "#ada0be"
accent = "#add5f3"
accent_fg = "#000000"
selection_bg = "#45236b"
selection_fg = "#fff8ff"
match_fg = "#d9b1f5"
border = "#4f3c69"
separator = "#3c285780"
danger = "#f18a9d"
warning = "#e9c86b"
success = "#a4d66e"
info = "#91c4ed"
badge_bg = "#3c2857"
badge_fg = "#f5edff"

[states.selected]
bg = "#45236b"
fg = "#fff8ff"
[states.hover]
bg = "#3c2857"
[states.disabled]
fg = "#ada0be"

[footer]
hint_color = "#ada0be"
