# Ported from Ghostty's bundled "Atom" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Atom"
appearance = "dark"

[palette]
bg = "#161719"
surface = "#101112"
elevated = "#2d2e30"
fg = "#c5c8c6"
fg_muted = "#888a89"
accent = "#96cbfe"
accent_fg = "#000000"
selection_bg = "#444444"
selection_fg = "#c5c8c6"
match_fg = "#b9b6fc"
border = "#393a3c"
separator = "#2d2e3080"
danger = "#fd5ff1"
warning = "#ffd7b1"
success = "#87c38a"
info = "#85befd"
badge_bg = "#2d2e30"
badge_fg = "#c5c8c6"

[states.selected]
bg = "#444444"
fg = "#c5c8c6"
[states.hover]
bg = "#2d2e30"
[states.disabled]
fg = "#888a89"

[footer]
hint_color = "#888a89"
