# Ported from Ghostty's bundled "SeedFlip Voltage" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · SeedFlip Voltage"
appearance = "dark"

[palette]
bg = "#0a0a0a"
surface = "#070707"
elevated = "#232323"
fg = "#f0f0f0"
fg_muted = "#a0a0a0"
accent = "#a6ff00"
accent_fg = "#000000"
selection_bg = "#232323"
selection_fg = "#f0f0f0"
match_fg = "#f589f5"
border = "#383838"
separator = "#23232380"
danger = "#f04242"
warning = "#f0d342"
success = "#42f07c"
info = "#428bf0"
badge_bg = "#232323"
badge_fg = "#f0f0f0"

[states.selected]
bg = "#232323"
fg = "#f0f0f0"
[states.hover]
bg = "#232323"
[states.disabled]
fg = "#a0a0a0"

[footer]
hint_color = "#a0a0a0"
