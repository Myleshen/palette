# Ported from Ghostty's bundled "Callie Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Callie Light"
appearance = "light"

[palette]
bg = "#fbf5f8"
surface = "#eee9ec"
elevated = "#fdfbfc"
fg = "#493542"
fg_muted = "#746670"accent = "#3b5993"
accent_fg = "#ffffff"
selection_bg = "#e0ccd7"
selection_fg = "#55414e"
match_fg = "#85415f"
border = "#dad1d6"
separator = "#fdfbfc80"
danger = "#9e5251"
warning = "#886518"
success = "#3f7b4a"
info = "#4b6ba6"
badge_bg = "#fdfbfc"
badge_fg = "#55414e"

[states.selected]
bg = "#e0ccd7"
fg = "#55414e"
[states.hover]
bg = "#fdfbfc"
[states.disabled]
fg = "#8f808a"

[window]
material = "popover"

[footer]
hint_color = "#746670"
