# Ported from Ghostty's bundled "Adwaita" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Adwaita"
appearance = "light"

[palette]
bg = "#ffffff"
surface = "#f2f2f2"
elevated = "#ffffff"
fg = "#1d1d20"
fg_muted = "#6c6c6e"
accent = "#12488b"
accent_fg = "#ffffff"
selection_bg = "#1d1d20"
selection_fg = "#ffffff"
match_fg = "#a347ba"
border = "#d2d2d2"
separator = "#ffffff80"
danger = "#c01c28"
warning = "#a2734c"
success = "#26a269"
info = "#12488b"
badge_bg = "#ffffff"
badge_fg = "#1d1d20"

[states.selected]
bg = "#1d1d20"
fg = "#ffffff"
[states.hover]
bg = "#ffffff"
[states.disabled]
fg = "#6c6c6e"

[window]
material = "popover"

[footer]
hint_color = "#6c6c6e"
