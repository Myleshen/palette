# Ported from Ghostty's bundled "Monokai Vivid" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Monokai Vivid"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#f9f9f9"
fg_muted = "#a8a8a8"
accent = "#ff5444"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#000000"
match_fg = "#f800f8"
border = "#404040"
separator = "#2a2a2a80"
danger = "#fa2934"
warning = "#fff30a"
success = "#98e123"
info = "#0848ff"
badge_bg = "#2a2a2a"
badge_fg = "#f9f9f9"

[states.selected]
bg = "#ffffff"
fg = "#000000"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#a8a8a8"

[footer]
hint_color = "#a8a8a8"
