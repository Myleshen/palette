# Ported from Ghostty's bundled "Zacess Warm Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zacess Warm Dark"
appearance = "dark"

[palette]
bg = "#211b17"
surface = "#181311"
elevated = "#37322e"
fg = "#e5d5b6"
fg_muted = "#a0947e"
accent = "#d7ecff"
accent_fg = "#000000"
selection_bg = "#7abad3"
selection_fg = "#211b17"
match_fg = "#ffe1f4"
border = "#484037"
separator = "#37322e80"
danger = "#fc9a8d"
warning = "#e4b35b"
success = "#a2be6f"
info = "#88b9e3"
badge_bg = "#37322e"
badge_fg = "#e5d5b6"

[states.selected]
bg = "#7abad3"
fg = "#211b17"
[states.hover]
bg = "#37322e"
[states.disabled]
fg = "#a0947e"

[footer]
hint_color = "#a0947e"
