# Ported from Ghostty's bundled "Ghostty Default Style Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Ghostty Default Style Dark"
appearance = "dark"

[palette]
bg = "#282c34"
surface = "#1d2025"
elevated = "#3e4148"
fg = "#ffffff"
fg_muted = "#b4b5b8"
accent = "#7aa6da"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#282c34"
match_fg = "#c397d8"
border = "#53565d"
separator = "#3e414880"
danger = "#cc6566"
warning = "#f0c674"
success = "#b6bd68"
info = "#82a2be"
badge_bg = "#3e4148"
badge_fg = "#ffffff"

[states.selected]
bg = "#ffffff"
fg = "#282c34"
[states.hover]
bg = "#3e4148"
[states.disabled]
fg = "#b4b5b8"

[footer]
hint_color = "#b4b5b8"
