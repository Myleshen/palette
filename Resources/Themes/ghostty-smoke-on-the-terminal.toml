# Ported from Ghostty's bundled "Smoke on the Terminal" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Smoke on the Terminal"
appearance = "dark"

[palette]
bg = "#30243a"
surface = "#231a2a"
elevated = "#453a4e"
fg = "#f5e8f4"
fg_muted = "#b0a3b3"
accent = "#afbee5"
accent_fg = "#000000"
selection_bg = "#553f55"
selection_fg = "#f5e8f4"
match_fg = "#d5a7e5"
border = "#574b5f"
separator = "#453a4e80"
danger = "#df8d80"
warning = "#e4be83"
success = "#a7c996"
info = "#a4b5e2"
badge_bg = "#453a4e"
badge_fg = "#f5e8f4"

[states.selected]
bg = "#553f55"
fg = "#f5e8f4"
[states.hover]
bg = "#453a4e"
[states.disabled]
fg = "#b0a3b3"

[footer]
hint_color = "#b0a3b3"
