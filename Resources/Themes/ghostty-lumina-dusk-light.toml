# Ported from Ghostty's bundled "Lumina Dusk Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Lumina Dusk Light"
appearance = "light"

[palette]
bg = "#f6f3fe"
surface = "#eae7f1"
elevated = "#fbfaff"
fg = "#2e2945"
fg_muted = "#747086"
accent = "#2b5088"
accent_fg = "#ffffff"
selection_bg = "#d7bcc6"
selection_fg = "#2e2945"
match_fg = "#713a6c"
border = "#cecbd9"
separator = "#fbfaff80"
danger = "#872423"
warning = "#9e611b"
success = "#357545"
info = "#3163ad"
badge_bg = "#fbfaff"
badge_fg = "#2e2945"

[states.selected]
bg = "#d7bcc6"
fg = "#2e2945"
[states.hover]
bg = "#fbfaff"
[states.disabled]
fg = "#747086"

[window]
material = "popover"

[footer]
hint_color = "#747086"
