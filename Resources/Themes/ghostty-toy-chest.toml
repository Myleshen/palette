# Ported from Ghostty's bundled "Toy Chest" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Toy Chest"
appearance = "dark"

[palette]
bg = "#24364b"
surface = "#1a2736"
elevated = "#3a4a5d"
fg = "#43dd87"
fg_muted = "#45af7d"
accent = "#55c2f7"
accent_fg = "#000000"
selection_bg = "#5f217a"
selection_fg = "#d5d5d5"
match_fg = "#ae6bdc"
border = "#275555"
separator = "#3a4a5d80"
danger = "#dc4b40"
warning = "#db8e27"
success = "#1a9172"
info = "#537fbb"
badge_bg = "#3a4a5d"
badge_fg = "#31d07b"

[states.selected]
bg = "#5f217a"
fg = "#d5d5d5"
[states.hover]
bg = "#3a4a5d"
[states.disabled]
fg = "#2c9a6a"

[footer]
hint_color = "#2c9a6a"
