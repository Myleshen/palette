# Ported from Ghostty's bundled "Zacess Deep Contrast Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Zacess Deep Contrast Dark"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#ffff00"
accent_fg = "#000000"
selection_bg = "#ff70ff"
selection_fg = "#000000"
match_fg = "#ff8fff"
border = "#333333"
separator = "#1a1a1a80"
danger = "#ff5f5f"
warning = "#cdcd00"
success = "#00cd00"
info = "#8888ff"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#ff70ff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
