# Ported from Ghostty's bundled "Grok Day" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Grok Day"
appearance = "light"

[palette]
bg = "#f5f5f5"
surface = "#e9e9e9"
elevated = "#fbfbfb"
fg = "#262626"
fg_muted = "#6a6969"
accent = "#2f63d1"
accent_fg = "#ffffff"
selection_bg = "#dedede"
selection_fg = "#262626"
match_fg = "#7d4bc6"
border = "#cccccc"
separator = "#fbfbfb80"
danger = "#cd3048"
warning = "#a27612"
success = "#378e23"
info = "#2f64d2"
badge_bg = "#fbfbfb"
badge_fg = "#262626"

[states.selected]
bg = "#dedede"
fg = "#262626"
[states.hover]
bg = "#fbfbfb"
[states.disabled]
fg = "#6e6e6e"

[window]
material = "popover"

[footer]
hint_color = "#6a6969"
