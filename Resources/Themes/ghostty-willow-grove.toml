# Ported from Ghostty's bundled "Willow Grove" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Willow Grove"
appearance = "light"

[palette]
bg = "#fdfcf5"
surface = "#f0efe9"
elevated = "#fefefb"
fg = "#1b1f16"
fg_muted = "#6a6c64"
accent = "#17478f"
accent_fg = "#ffffff"
selection_bg = "#e6ddc6"
selection_fg = "#1b1f16"
match_fg = "#5d2d87"
border = "#d0d0c8"
separator = "#fefefb80"
danger = "#841d1d"
warning = "#624800"
success = "#0b5729"
info = "#17478f"
badge_bg = "#fefefb"
badge_fg = "#1b1f16"

[states.selected]
bg = "#e6ddc6"
fg = "#1b1f16"
[states.hover]
bg = "#fefefb"
[states.disabled]
fg = "#6a6c64"

[window]
material = "popover"

[footer]
hint_color = "#6a6c64"
