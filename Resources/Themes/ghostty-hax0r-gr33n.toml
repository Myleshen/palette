# Ported from Ghostty's bundled "HaX0R Gr33N" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · HaX0R Gr33N"
appearance = "dark"

[palette]
bg = "#020f01"
surface = "#010b01"
elevated = "#1b271a"
fg = "#1ab312"
fg_muted = "#2b8b25"
accent = "#19e20e"
accent_fg = "#000000"
selection_bg = "#d4ffc1"
selection_fg = "#6a6a6a"
match_fg = "#19e20e"
border = "#062f04"
separator = "#1b271a80"
danger = "#15d00d"
warning = "#15d00d"
success = "#15d00d"
info = "#15d00d"
badge_bg = "#1b271a"
badge_fg = "#16b10e"

[states.selected]
bg = "#d4ffc1"
fg = "#6a6a6a"
[states.hover]
bg = "#1b271a"
[states.disabled]
fg = "#0f7809"

[footer]
hint_color = "#0f7809"
