# Ported from Ghostty's bundled "Ayu Mirage" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Ayu Mirage"
appearance = "dark"

[palette]
bg = "#1f2430"
surface = "#161a23"
elevated = "#353a45"
fg = "#cccac2"
fg_muted = "#8f908f"
accent = "#ffcc66"
accent_fg = "#000000"
selection_bg = "#409fff"
selection_fg = "#1f2430"
match_fg = "#dfbfff"
border = "#42454d"
separator = "#353a4580"
danger = "#ed8274"
warning = "#facc6e"
success = "#87d96c"
info = "#6dcbfa"
badge_bg = "#353a45"
badge_fg = "#cccac2"

[states.selected]
bg = "#409fff"
fg = "#1f2430"
[states.hover]
bg = "#353a45"
[states.disabled]
fg = "#8f908f"

[footer]
hint_color = "#8f908f"
