# Ported from Ghostty's bundled "Terminal Green 1999" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Terminal Green 1999"
appearance = "dark"

[palette]
bg = "#03120a"
surface = "#020d07"
elevated = "#1c2a23"
fg = "#d8ffe6"
fg_muted = "#8dac99"
accent = "#97dcfd"
accent_fg = "#000000"
selection_bg = "#d8ffe6"
selection_fg = "#03120a"
match_fg = "#b1ff79"
border = "#2e4136"
separator = "#1c2a2380"
danger = "#ff5c7a"
warning = "#00d26a"
success = "#22c55e"
info = "#7dd3fc"
badge_bg = "#1c2a23"
badge_fg = "#d8ffe6"

[states.selected]
bg = "#d8ffe6"
fg = "#03120a"
[states.hover]
bg = "#1c2a23"
[states.disabled]
fg = "#8dac99"

[footer]
hint_color = "#8dac99"
