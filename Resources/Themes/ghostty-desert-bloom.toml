# Ported from Ghostty's bundled "Desert Bloom" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Desert Bloom"
appearance = "dark"

[palette]
bg = "#54213e"
surface = "#3c182d"
elevated = "#653751"
fg = "#fff0df"
fg_muted = "#c3a8a7"
accent = "#afd2ef"
accent_fg = "#000000"
selection_bg = "#75435f"
selection_fg = "#fff8ed"
match_fg = "#e6b6d9"
border = "#764a5e"
separator = "#65375180"
danger = "#f3958d"
warning = "#edc95f"
success = "#86ce91"
info = "#92c2e8"
badge_bg = "#653751"
badge_fg = "#fff0df"

[states.selected]
bg = "#75435f"
fg = "#fff8ed"
[states.hover]
bg = "#653751"
[states.disabled]
fg = "#c3a8a7"

[footer]
hint_color = "#c3a8a7"
