# Ported from Ghostty's bundled "No Clown Fiesta" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · No Clown Fiesta"
appearance = "dark"

[palette]
bg = "#101010"
surface = "#0c0c0c"
elevated = "#282828"
fg = "#e0e1e4"
fg_muted = "#97989a"
accent = "#bad7ff"
accent_fg = "#000000"
selection_bg = "#696d79"
selection_fg = "#f0f1f2"
match_fg = "#aa759f"
border = "#3a3a3a"
separator = "#28282880"
danger = "#b46958"
warning = "#f4bf75"
success = "#90a959"
info = "#bad7ff"
badge_bg = "#282828"
badge_fg = "#e0e1e4"

[states.selected]
bg = "#696d79"
fg = "#f0f1f2"
[states.hover]
bg = "#282828"
[states.disabled]
fg = "#97989a"

[footer]
hint_color = "#97989a"
