# Ported from Ghostty's bundled "Gruvbox Material Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Gruvbox Material Dark"
appearance = "dark"

[palette]
bg = "#282828"
surface = "#1d1d1d"
elevated = "#3e3e3e"
fg = "#d4be98"
fg_muted = "#9b8d73"
accent = "#80b2a6"
accent_fg = "#000000"
selection_bg = "#d4be98"
selection_fg = "#282828"
match_fg = "#d3869b"
border = "#4a463e"
separator = "#3e3e3e80"
danger = "#ea6962"
warning = "#d8a657"
success = "#a9b665"
info = "#7daea3"
badge_bg = "#3e3e3e"
badge_fg = "#d4be98"

[states.selected]
bg = "#d4be98"
fg = "#282828"
[states.hover]
bg = "#3e3e3e"
[states.disabled]
fg = "#988a71"

[footer]
hint_color = "#988a71"
