# Ported from Ghostty's bundled "Signal Ghost" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Signal Ghost"
appearance = "dark"

[palette]
bg = "#0e1414"
surface = "#0a0e0e"
elevated = "#262c2c"
fg = "#e7efe7"
fg_muted = "#9ba29d"
accent = "#92bff0"
accent_fg = "#000000"
selection_bg = "#1f2a2a"
selection_fg = "#f3faf5"
match_fg = "#d1a9e8"
border = "#39403e"
separator = "#262c2c80"
danger = "#e56f75"
warning = "#e6c45c"
success = "#62c99b"
info = "#72a9e8"
badge_bg = "#262c2c"
badge_fg = "#e7efe7"

[states.selected]
bg = "#1f2a2a"
fg = "#f3faf5"
[states.hover]
bg = "#262c2c"
[states.disabled]
fg = "#9ba29d"

[footer]
hint_color = "#9ba29d"
