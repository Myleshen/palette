# Ported from Ghostty's bundled "CRT Afterglow" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · CRT Afterglow"
appearance = "dark"

[palette]
bg = "#0b0f0b"
surface = "#080b08"
elevated = "#232723"
fg = "#d0d8c8"
fg_muted = "#8b9286"
accent = "#b3f1ff"
accent_fg = "#000000"
selection_bg = "#2a3a2a"
selection_fg = "#d0d8c8"
match_fg = "#dda0ff"
border = "#323731"
separator = "#23272380"
danger = "#ff5f56"
warning = "#f1fa8c"
success = "#50fa7b"
info = "#8be9fd"
badge_bg = "#232723"
badge_fg = "#d0d8c8"

[states.selected]
bg = "#2a3a2a"
fg = "#d0d8c8"
[states.hover]
bg = "#232723"
[states.disabled]
fg = "#8b9286"

[footer]
hint_color = "#8b9286"
