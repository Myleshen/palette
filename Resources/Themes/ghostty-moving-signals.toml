# Ported from Ghostty's bundled "Moving Signals" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Moving Signals"
appearance = "dark"

[palette]
bg = "#28141b"
surface = "#1d0e13"
elevated = "#3e2c32"
fg = "#f6e9dc"
fg_muted = "#ae9e98"
accent = "#e6c077"
accent_fg = "#000000"
selection_bg = "#58303b"
selection_fg = "#ffffff"
match_fg = "#cdb2c8"
border = "#513f42"
separator = "#3e2c3280"
danger = "#d56b70"
warning = "#d7a96c"
success = "#9cb6a2"
info = "#8baac0"
badge_bg = "#3e2c32"
badge_fg = "#f6e9dc"

[states.selected]
bg = "#58303b"
fg = "#ffffff"
[states.hover]
bg = "#3e2c32"
[states.disabled]
fg = "#ae9e98"

[footer]
hint_color = "#ae9e98"
