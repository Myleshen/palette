# Ported from Ghostty's bundled "Thirteen" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Thirteen"
appearance = "dark"

[palette]
bg = "#260607"
surface = "#1b0405"
elevated = "#3c1f20"
fg = "#f4ead8"
fg_muted = "#ac9a8f"
accent = "#9db5c6"
accent_fg = "#000000"
selection_bg = "#4b1719"
selection_fg = "#fff7e9"
match_fg = "#bba4b9"
border = "#4f3431"
separator = "#3c1f2080"
danger = "#d97d75"
warning = "#c5ad70"
success = "#91b994"
info = "#849fb4"
badge_bg = "#3c1f20"
badge_fg = "#f4ead8"

[states.selected]
bg = "#4b1719"
fg = "#fff7e9"
[states.hover]
bg = "#3c1f20"
[states.disabled]
fg = "#ac9a8f"

[footer]
hint_color = "#ac9a8f"
