# Ported from Ghostty's bundled "Squintless" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Squintless"
appearance = "light"

[palette]
bg = "#f2e5bc"
surface = "#e6dab3"
elevated = "#f9f3e1"
fg = "#3c3836"
fg_muted = "#6d6657"
accent = "#076678"
accent_fg = "#ffffff"
selection_bg = "#d5c4a1"
selection_fg = "#3c3836"
match_fg = "#8f3f71"
border = "#cec2a1"
separator = "#f9f3e180"
danger = "#9d0006"
warning = "#b57614"
success = "#79740e"
info = "#076678"
badge_bg = "#f9f3e1"
badge_fg = "#3c3836"

[states.selected]
bg = "#d5c4a1"
fg = "#3c3836"
[states.hover]
bg = "#f9f3e1"
[states.disabled]
fg = "#7c7565"

[window]
material = "popover"

[footer]
hint_color = "#7c7565"
