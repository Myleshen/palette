# Ported from Ghostty's bundled "Zacess High Contrast Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Zacess High Contrast Dark"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#c8e6ff"
accent_fg = "#000000"
selection_bg = "#bf96ff"
selection_fg = "#000000"
match_fg = "#ffcdf7"
border = "#333333"
separator = "#1a1a1a80"
danger = "#ff9e94"
warning = "#f5c400"
success = "#26f444"
info = "#8fd0ff"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#bf96ff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
