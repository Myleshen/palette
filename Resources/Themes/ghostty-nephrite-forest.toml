# Ported from Ghostty's bundled "Nephrite Forest" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Nephrite Forest"
appearance = "dark"

[palette]
bg = "#0d1c14"
surface = "#09140e"
elevated = "#25332c"
fg = "#e0ebe5"
fg_muted = "#96a39c"
accent = "#89c3fe"
accent_fg = "#000000"
selection_bg = "#324139"
selection_fg = "#e0ebe5"
match_fg = "#d0aafc"
border = "#37453e"
separator = "#25332c80"
danger = "#ffa09c"
warning = "#d9bb5c"
success = "#4dbf74"
info = "#89c3fe"
badge_bg = "#25332c"
badge_fg = "#e0ebe5"

[states.selected]
bg = "#324139"
fg = "#e0ebe5"
[states.hover]
bg = "#25332c"
[states.disabled]
fg = "#96a39c"

[footer]
hint_color = "#96a39c"
