# Ported from Ghostty's bundled "Obsidian" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Obsidian"
appearance = "dark"

[palette]
bg = "#283033"
surface = "#1d2325"
elevated = "#3e4547"
fg = "#cdcdcd"
fg_muted = "#939697"
accent = "#a1d7ff"
accent_fg = "#000000"
selection_bg = "#3e4c4f"
selection_fg = "#dfe1e2"
match_fg = "#ff55ff"
border = "#494f52"
separator = "#3e454780"
danger = "#b30d0e"
warning = "#fecd22"
success = "#00bb00"
info = "#3a9bdb"
badge_bg = "#3e4547"
badge_fg = "#cdcdcd"

[states.selected]
bg = "#3e4c4f"
fg = "#dfe1e2"
[states.hover]
bg = "#3e4547"
[states.disabled]
fg = "#939697"

[footer]
hint_color = "#939697"
