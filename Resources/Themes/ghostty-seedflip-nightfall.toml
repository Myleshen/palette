# Ported from Ghostty's bundled "SeedFlip Nightfall" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · SeedFlip Nightfall"
appearance = "dark"

[palette]
bg = "#0a0a0f"
surface = "#07070b"
elevated = "#232327"
fg = "#e4e4e7"
fg_muted = "#98989b"
accent = "#89b6f5"
accent_fg = "#000000"
selection_bg = "#232327"
selection_fg = "#e4e4e7"
match_fg = "#f589f5"
border = "#36363a"
separator = "#23232780"
danger = "#f04242"
warning = "#f0d342"
success = "#42f07c"
info = "#428bf0"
badge_bg = "#232327"
badge_fg = "#e4e4e7"

[states.selected]
bg = "#232327"
fg = "#e4e4e7"
[states.hover]
bg = "#232327"
[states.disabled]
fg = "#98989b"

[footer]
hint_color = "#98989b"
