# Ported from Ghostty's bundled "mistpine" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · mistpine"
appearance = "dark"

[palette]
bg = "#0b1f27"
surface = "#08161c"
elevated = "#23353d"
fg = "#c4c9d0"
fg_muted = "#838e95"
accent = "#93afc4"
accent_fg = "#000000"
selection_bg = "#26414a"
selection_fg = "#d0d1d6"
match_fg = "#b8a8c6"
border = "#304149"
separator = "#23353d80"
danger = "#be7356"
warning = "#c2a55b"
success = "#8a9a5b"
info = "#6f8fa8"
badge_bg = "#23353d"
badge_fg = "#c4c9d0"

[states.selected]
bg = "#26414a"
fg = "#d0d1d6"
[states.hover]
bg = "#23353d"
[states.disabled]
fg = "#838e95"

[footer]
hint_color = "#838e95"
