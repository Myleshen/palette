# Ported from Ghostty's bundled "branch" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · branch"
appearance = "dark"

[palette]
bg = "#32221a"
surface = "#241813"
elevated = "#463831"
fg = "#cfc1a9"
fg_muted = "#998a77"
accent = "#60b2af"
accent_fg = "#000000"
selection_bg = "#cfc1a9"
selection_fg = "#32221a"
match_fg = "#c47e5b"
border = "#514237"
separator = "#46383180"
danger = "#c2562d"
warning = "#d29b5a"
success = "#96a65e"
info = "#3b8e8c"
badge_bg = "#463831"
badge_fg = "#cfc1a9"

[states.selected]
bg = "#cfc1a9"
fg = "#32221a"
[states.hover]
bg = "#463831"
[states.disabled]
fg = "#988977"

[footer]
hint_color = "#988977"
