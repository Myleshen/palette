# Ported from Ghostty's bundled "Aurora" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Aurora"
appearance = "dark"

[palette]
bg = "#23262e"
surface = "#191b21"
elevated = "#393c43"
fg = "#ffca28"
fg_muted = "#b2912a"
accent = "#03d6b8"
accent_fg = "#000000"
selection_bg = "#393c43"
selection_fg = "#00e8c6"
match_fg = "#ee5d43"
border = "#4f472d"
separator = "#393c4380"
danger = "#f0266f"
warning = "#ffe66d"
success = "#8fd46d"
info = "#102ee4"
badge_bg = "#393c43"
badge_fg = "#ffca28"

[states.selected]
bg = "#393c43"
fg = "#00e8c6"
[states.hover]
bg = "#393c43"
[states.disabled]
fg = "#b2912a"

[footer]
hint_color = "#b2912a"
