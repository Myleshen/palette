# Ported from Ghostty's bundled "Sweet Emotion" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Sweet Emotion"
appearance = "dark"

[palette]
bg = "#211027"
surface = "#180c1c"
elevated = "#37283d"
fg = "#f9e5f4"
fg_muted = "#ad9aac"
accent = "#e6b86b"
accent_fg = "#000000"
selection_bg = "#49343d"
selection_fg = "#fff8ee"
match_fg = "#cd9eef"
border = "#4c3b50"
separator = "#37283d80"
danger = "#ee75a8"
warning = "#e6b86b"
success = "#78c6a6"
info = "#89a8ee"
badge_bg = "#37283d"
badge_fg = "#f9e5f4"

[states.selected]
bg = "#49343d"
fg = "#fff8ee"
[states.hover]
bg = "#37283d"
[states.disabled]
fg = "#ad9aac"

[footer]
hint_color = "#ad9aac"
