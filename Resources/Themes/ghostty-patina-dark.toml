# Ported from Ghostty's bundled "Patina Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Patina Dark"
appearance = "dark"

[palette]
bg = "#121212"
surface = "#0d0d0d"
elevated = "#2a2a2a"
fg = "#dbd7ca"
fg_muted = "#95928a"
accent = "#6db3c2"
accent_fg = "#000000"
selection_bg = "#42403d"
selection_fg = "#dbd7ca"
match_fg = "#c98a7d"
border = "#3a3937"
separator = "#2a2a2a80"
danger = "#cb7676"
warning = "#e6cc77"
success = "#4d9375"
info = "#6db3c2"
badge_bg = "#2a2a2a"
badge_fg = "#dbd7ca"

[states.selected]
bg = "#42403d"
fg = "#dbd7ca"
[states.hover]
bg = "#2a2a2a"
[states.disabled]
fg = "#95928a"

[footer]
hint_color = "#95928a"
