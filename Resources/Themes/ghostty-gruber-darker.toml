# Ported from Ghostty's bundled "Gruber Darker" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Gruber Darker"
appearance = "dark"

[palette]
bg = "#181818"
surface = "#111111"
elevated = "#2f2f2f"
fg = "#e4e4ef"
fg_muted = "#9d9da4"
accent = "#ffdd33"
accent_fg = "#000000"
selection_bg = "#ffffff"
selection_fg = "#52494e"
match_fg = "#afafd7"
border = "#414143"
separator = "#2f2f2f80"
danger = "#f43841"
warning = "#ffdd33"
success = "#73c936"
info = "#96a6c8"
badge_bg = "#2f2f2f"
badge_fg = "#e4e4ef"

[states.selected]
bg = "#ffffff"
fg = "#52494e"
[states.hover]
bg = "#2f2f2f"
[states.disabled]
fg = "#9d9da4"

[footer]
hint_color = "#9d9da4"
