# Ported from Ghostty's bundled "Monsoon Mesa" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Monsoon Mesa"
appearance = "dark"

[palette]
bg = "#164b58"
surface = "#10363f"
elevated = "#2d5d69"
fg = "#f8f1df"
fg_muted = "#a9b7b0"
accent = "#c0def4"
accent_fg = "#000000"
selection_bg = "#356873"
selection_fg = "#fffbed"
match_fg = "#e9c8e7"
border = "#436c73"
separator = "#2d5d6980"
danger = "#f7a18d"
warning = "#f0d278"
success = "#98d9ac"
info = "#a7d1ef"
badge_bg = "#2d5d69"
badge_fg = "#f8f1df"

[states.selected]
bg = "#356873"
fg = "#fffbed"
[states.hover]
bg = "#2d5d69"
[states.disabled]
fg = "#a9b7b0"

[footer]
hint_color = "#a9b7b0"
