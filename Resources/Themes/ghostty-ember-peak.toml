# Ported from Ghostty's bundled "Ember Peak" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Ember Peak"
appearance = "dark"

[palette]
bg = "#0a0a0f"
surface = "#07070b"
elevated = "#232327"
fg = "#f8fafc"
fg_muted = "#a5a6a9"
accent = "#a8c9ff"
accent_fg = "#000000"
selection_bg = "#2b1f16"
selection_fg = "#fff1df"
match_fg = "#ecb2ff"
border = "#3a3a3e"
separator = "#23232780"
danger = "#ff806f"
warning = "#ffd166"
success = "#65d493"
info = "#86b5ff"
badge_bg = "#232327"
badge_fg = "#f8fafc"

[states.selected]
bg = "#2b1f16"
fg = "#fff1df"
[states.hover]
bg = "#232327"
[states.disabled]
fg = "#a5a6a9"

[footer]
hint_color = "#a5a6a9"
