# Ported from Ghostty's bundled "Wombat" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Wombat"
appearance = "dark"

[palette]
bg = "#171717"
surface = "#111111"
elevated = "#2e2e2e"
fg = "#dedacf"
fg_muted = "#98968f"
accent = "#a5c7ff"
accent_fg = "#000000"
selection_bg = "#453b39"
selection_fg = "#b6bbc0"
match_fg = "#ddaaff"
border = "#3f3e3c"
separator = "#2e2e2e80"
danger = "#ff615a"
warning = "#ebd99c"
success = "#b1e969"
info = "#5da9f6"
badge_bg = "#2e2e2e"
badge_fg = "#dedacf"

[states.selected]
bg = "#453b39"
fg = "#b6bbc0"
[states.hover]
bg = "#2e2e2e"
[states.disabled]
fg = "#98968f"

[footer]
hint_color = "#98968f"
