# Ported from Ghostty's bundled "Alpine Milk" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Alpine Milk"
appearance = "light"

[palette]
bg = "#fafafa"
surface = "#ededed"
elevated = "#fdfdfd"
fg = "#333940"
fg_muted = "#707478"
accent = "#2d6cb8"
accent_fg = "#ececec"
selection_bg = "#d6e6f7"
selection_fg = "#333940"
match_fg = "#8a5fb0"
border = "#d2d3d5"
separator = "#fdfdfd80"
danger = "#c94f46"
warning = "#b28422"
success = "#4a9256"
info = "#3d7cc9"
badge_bg = "#fdfdfd"
badge_fg = "#333940"

[states.selected]
bg = "#d6e6f7"
fg = "#333940"
[states.hover]
bg = "#fdfdfd"
[states.disabled]
fg = "#797d81"

[window]
material = "popover"

[footer]
hint_color = "#797d81"
