# Ported from Ghostty's bundled "Modus Operandi Tinted" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Modus Operandi Tinted"
appearance = "light"

[palette]
bg = "#fbf7f0"
surface = "#eeebe4"
elevated = "#fdfbf8"
fg = "#000000"
fg_muted = "#585654"
accent = "#0031a9"
accent_fg = "#ffffff"
selection_bg = "#c2bcb5"
selection_fg = "#000000"
match_fg = "#721045"
border = "#c9c6c0"
separator = "#fdfbf880"
danger = "#a60000"
warning = "#6f5500"
success = "#006800"
info = "#0031a9"
badge_bg = "#fdfbf8"
badge_fg = "#000000"

[states.selected]
bg = "#c2bcb5"
fg = "#000000"
[states.hover]
bg = "#fdfbf8"
[states.disabled]
fg = "#585654"

[window]
material = "popover"

[footer]
hint_color = "#585654"
