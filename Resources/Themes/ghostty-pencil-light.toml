# Ported from Ghostty's bundled "Pencil Light" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Pencil Light"
appearance = "light"

[palette]
bg = "#f1f1f1"
surface = "#e5e5e5"
elevated = "#f9f9f9"
fg = "#424242"
fg_muted = "#676667"
accent = "#006e9a"
accent_fg = "#e5e5e5"
selection_bg = "#b6d6fd"
selection_fg = "#424242"
match_fg = "#523c79"
border = "#cecece"
separator = "#f9f9f980"
danger = "#c30771"
warning = "#998d00"
success = "#009e71"
info = "#008ec4"
badge_bg = "#f9f9f9"
badge_fg = "#424242"

[states.selected]
bg = "#b6d6fd"
fg = "#424242"
[states.hover]
bg = "#f9f9f9"
[states.disabled]
fg = "#7f7f7f"

[window]
material = "popover"

[footer]
hint_color = "#676666"
