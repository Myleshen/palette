# Ported from Ghostty's bundled "Material Darker" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Material Darker"
appearance = "dark"

[palette]
bg = "#212121"
surface = "#181818"
elevated = "#373737"
fg = "#eeffff"
fg_muted = "#a6b1b1"
accent = "#82aaff"
accent_fg = "#000000"
selection_bg = "#eeffff"
selection_fg = "#545454"
match_fg = "#c792ea"
border = "#4a4d4d"
separator = "#37373780"
danger = "#ff5370"
warning = "#ffcb6b"
success = "#c3e88d"
info = "#82aaff"
badge_bg = "#373737"
badge_fg = "#eeffff"

[states.selected]
bg = "#eeffff"
fg = "#545454"
[states.hover]
bg = "#373737"
[states.disabled]
fg = "#a6b1b1"

[footer]
hint_color = "#a6b1b1"
