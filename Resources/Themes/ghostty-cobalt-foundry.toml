# Ported from Ghostty's bundled "Cobalt Foundry" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Cobalt Foundry"
appearance = "dark"

[palette]
bg = "#10151c"
surface = "#0c0f14"
elevated = "#282c33"
fg = "#c2cedb"
fg_muted = "#848d98"
accent = "#74aeec"
accent_fg = "#000000"
selection_bg = "#1f3a5c"
selection_fg = "#e2eaf2"
match_fg = "#b5a0e0"
border = "#343a42"
separator = "#282c3380"
danger = "#e57373"
warning = "#d4a95f"
success = "#81b366"
info = "#4f95e0"
badge_bg = "#282c33"
badge_fg = "#c2cedb"

[states.selected]
bg = "#1f3a5c"
fg = "#e2eaf2"
[states.hover]
bg = "#282c33"
[states.disabled]
fg = "#848d98"

[footer]
hint_color = "#848d98"
