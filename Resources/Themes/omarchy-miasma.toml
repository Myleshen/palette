# Ported from Omarchy's bundled "Miasma" theme.
# Source: https://github.com/basecamp/omarchy/blob/master/themes/miasma/colors.toml
# Omarchy is MIT-licensed; colour values only, no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Omarchy · Miasma"
appearance = "dark"

[palette]
bg = "#222222"
surface = "#181818"
elevated = "#383838"
fg = "#c2c2b0"
fg_muted = "#8a8a7e"
accent = "#78824b"
accent_fg = "#000000"
selection_bg = "#78824b"
selection_fg = "#131312"
match_fg = "#bb7744"
border = "#42423e"
separator = "#38383880"
danger = "#685742"
warning = "#b36d43"
success = "#5f875f"
info = "#78824b"
badge_bg = "#383838"
badge_fg = "#c2c2b0"

[states.selected]
bg = "#78824b"
fg = "#131312"
[states.hover]
bg = "#383838"
[states.disabled]
fg = "#8a8a7e"

[footer]
hint_color = "#8a8a7e"
