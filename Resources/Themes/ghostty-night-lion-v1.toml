# Ported from Ghostty's bundled "Night Lion V1" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Night Lion V1"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#bbbbbb"
fg_muted = "#7a7a7a"
accent = "#276bd8"
accent_fg = "#ffffff"
selection_bg = "#b5d5ff"
selection_fg = "#000000"
match_fg = "#ff55ff"
border = "#252525"
separator = "#1a1a1a80"
danger = "#bb0000"
warning = "#f3f167"
success = "#5fde8f"
info = "#276bd8"
badge_bg = "#1a1a1a"
badge_fg = "#bbbbbb"

[states.selected]
bg = "#b5d5ff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#7a7a7a"

[footer]
hint_color = "#7a7a7a"
