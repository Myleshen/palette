# Ported from Ghostty's bundled "Wild Charm Dark" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
name = "Ghostty · Wild Charm Dark"
appearance = "dark"

[palette]
bg = "#000000"
surface = "#000000"
elevated = "#1a1a1a"
fg = "#ffffff"
fg_muted = "#a6a6a6"
accent = "#00afff"
accent_fg = "#000000"
selection_bg = "#00afff"
selection_fg = "#000000"
match_fg = "#ff87ff"
border = "#333333"
separator = "#1a1a1a80"
danger = "#d7005f"
warning = "#d78700"
success = "#00af5f"
info = "#0087d7"
badge_bg = "#1a1a1a"
badge_fg = "#ffffff"

[states.selected]
bg = "#00afff"
fg = "#000000"
[states.hover]
bg = "#1a1a1a"
[states.disabled]
fg = "#a6a6a6"

[footer]
hint_color = "#a6a6a6"
