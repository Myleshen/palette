# Ported from Ghostty's bundled "Medallion" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
name = "Ghostty · Medallion"
appearance = "dark"

[palette]
bg = "#1d1908"
surface = "#151206"
elevated = "#343021"
fg = "#cac296"
fg_muted = "#8d8764"
accent = "#acb8ff"
accent_fg = "#000000"
selection_bg = "#626dac"
selection_fg = "#f9f8f3"
match_fg = "#ffa0ff"
border = "#403b24"
separator = "#34302180"
danger = "#b64c00"
warning = "#d3bd26"
success = "#7c8b16"
info = "#616bb0"
badge_bg = "#343021"
badge_fg = "#cac296"

[states.selected]
bg = "#626dac"
fg = "#f9f8f3"
[states.hover]
bg = "#343021"
[states.disabled]
fg = "#8d8764"

[footer]
hint_color = "#8d8764"
