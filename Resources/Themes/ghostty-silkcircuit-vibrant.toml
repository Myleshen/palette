# Ported from Ghostty's bundled "SilkCircuit Vibrant" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · SilkCircuit Vibrant"
appearance = "dark"

[palette]
bg = "#0f0c1a"
surface = "#0b0913"
elevated = "#272431"
fg = "#f8f8f2"
fg_muted = "#a6a5a6"
accent = "#00ffcc"
accent_fg = "#000000"
selection_bg = "#3a2e5a"
selection_fg = "#f8f8f2"
match_fg = "#ff66ff"
border = "#3e3b45"
separator = "#27243180"
danger = "#ff3366"
warning = "#ffcc00"
success = "#00ff66"
info = "#6699ff"
badge_bg = "#272431"
badge_fg = "#f8f8f2"

[states.selected]
bg = "#3a2e5a"
fg = "#f8f8f2"
[states.hover]
bg = "#272431"
[states.disabled]
fg = "#a6a5a6"

[footer]
hint_color = "#a6a5a6"
