# Ported from Ghostty's bundled "Vacuum Tube" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · Vacuum Tube"
appearance = "dark"

[palette]
bg = "#0c0907"
surface = "#090605"
elevated = "#242220"
fg = "#f7efe3"
fg_muted = "#a59e96"
accent = "#ffc078"
accent_fg = "#000000"
selection_bg = "#35251a"
selection_fg = "#fff4e8"
match_fg = "#e7bbed"
border = "#3b3733"
separator = "#24222080"
danger = "#ff826d"
warning = "#f5cb67"
success = "#79d09b"
info = "#8fb4ee"
badge_bg = "#242220"
badge_fg = "#f7efe3"

[states.selected]
bg = "#35251a"
fg = "#fff4e8"
[states.hover]
bg = "#242220"
[states.disabled]
fg = "#a59e96"

[footer]
hint_color = "#a59e96"
