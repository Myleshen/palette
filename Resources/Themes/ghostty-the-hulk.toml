# Ported from Ghostty's bundled "The Hulk" theme.
# Source: https://github.com/ghostty-org/ghostty — themes are the MIT-licensed
# iTerm2-Color-Schemes collection. Colour values only; no code is copied.
# Palette derives surface, elevated, muted, border, badge and states from the
# terminal background/foreground/ANSI palette.
# Contrast note: selection_fg was corrected to reach 4.5:1 against the selection background.
# Contrast note: accent uses the distinct cursor colour instead of ANSI blue.
name = "Ghostty · The Hulk"
appearance = "dark"

[palette]
bg = "#1b1d1e"
surface = "#131516"
elevated = "#323434"
fg = "#b5b5b5"
fg_muted = "#838484"
accent = "#16b61b"
accent_fg = "#000000"
selection_bg = "#4d504c"
selection_fg = "#a4cba3"
match_fg = "#72589d"
border = "#3a3b3c"
separator = "#32343480"
danger = "#269d1b"
warning = "#63e457"
success = "#13ce30"
info = "#3350ff"
badge_bg = "#323434"
badge_fg = "#b5b5b5"

[states.selected]
bg = "#4d504c"
fg = "#a4cba3"
[states.hover]
bg = "#323434"
[states.disabled]
fg = "#7f8080"

[footer]
hint_color = "#7f8080"
