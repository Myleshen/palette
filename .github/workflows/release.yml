name: release

# Tags, not merges: the version lives in Resources/Info.plist next to a
# hand-written CHANGELOG entry, so the maintainer decides the number and tags
# the commit. The workflow refuses a tag that disagrees with the plist.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # A tag on a side branch must never publish: only history that is on
      # main reaches the release environment.
      - name: Tag must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plist="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$plist" != "$version" ]; then
            echo "::error title=Version mismatch::Resources/Info.plist says $plist but the release is $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Swift version
        id: swift
        run: echo "version=$(swift --version 2>&1 | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-build-${{ github.job }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.swift.outputs.version }}-

      # See Scripts/restore-build-timestamps.sh: without this a restored cache
      # still rebuilds everything, because checkout stamps sources with "now".
      - name: Warm the build cache
        run: Scripts/restore-build-timestamps.sh

      - name: Test
        run: swift test

      - name: Build, zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make app
          mkdir -p dist
          ditto -c -k --norsrc --keepParent build/Palette.app "dist/Palette-$VERSION.zip"
          shasum -a 256 "dist/Palette-$VERSION.zip" | tee sha256.txt
          # Verified by the smoke job, so the name is bare: the asset sits next
          # to the zip with no dist/ prefix.
          (cd dist && shasum -a 256 "Palette-$VERSION.zip" > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Palette-${{ steps.version.outputs.version }}.zip

      # Draft first: immutable releases cannot be edited after publishing, so
      # the notes and assets are fixed while it is still a draft.
      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          escaped="$(printf '%s' "$VERSION" | sed 's/\./\\./g')"
          # The CHANGELOG entry is the release note, as it was written.
          awk -v pat="^## ${escaped}([^0-9.]|\$)" '
            $0 ~ pat { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "v$VERSION" --draft --title "Palette $VERSION" \
              --notes-file notes.md "dist/Palette-$VERSION.zip" dist/SHA256SUMS
          else
            gh release create "v$VERSION" --draft --title "Palette $VERSION" \
              --generate-notes "dist/Palette-$VERSION.zip" dist/SHA256SUMS
          fi
          gh release edit "v$VERSION" --draft=false

      - name: Update the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "::warning title=Homebrew cask not bumped::Set the TAP_DEPLOY_KEY secret (an SSH deploy key with write access to Myleshen/homebrew-tap) so a release moves the cask. v$VERSION is published either way."
            exit 0
          fi
          sha="$(cut -d' ' -f1 sha256.txt)"
          key="$RUNNER_TEMP/tap_deploy"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:Myleshen/homebrew-tap.git tap
          cask="tap/Casks/palette.rb"
          sed -i '' -E "s/version \"[^\"]*\"/version \"$VERSION\"/" "$cask"
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"$sha\"/" "$cask"
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C tap diff --quiet; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git -C tap commit -qam "palette: $VERSION"
          git -C tap push -q origin main

  # Reads the published assets back, the way a user does.
  smoke:
    needs: release
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify the published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          shasum -a 256 -c SHA256SUMS
          unzip -q Palette-*.zip
          test -x Palette.app/Contents/MacOS/Palette
          codesign -dv Palette.app
