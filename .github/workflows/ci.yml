name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The toolchain is part of the cache key: build products are tied to the
      # Swift module format, and restoring them after a runner image change
      # fails with "DESERIALIZATION FAILURE".
      - name: Swift version
        id: swift
        run: echo "version=$(swift --version 2>&1 | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-build-${{ github.job }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.swift.outputs.version }}-

      # See Scripts/restore-build-timestamps.sh: without this a restored cache
      # still rebuilds everything, because checkout stamps sources with "now".
      - name: Warm the build cache
        run: Scripts/restore-build-timestamps.sh

      - name: Test
        # Release configuration on purpose: `make app` builds release too, so one
        # set of artifacts serves both steps and the cache stays warm. Debug
        # artifacts were being evicted from the cache, so every run recompiled.
        run: swift test -c release ${{ github.event_name == 'push' && '--enable-code-coverage' || '' }}

      - name: Report coverage
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          report="$(ls .build/release/codecov/*.json 2>/dev/null | head -n 1)"
          if [ -z "$report" ]; then
            echo "no coverage report produced"
            exit 0
          fi
          # xccov cannot read SPM's LLVM JSON on every toolchain, so fall back
          # to llvm-cov instead of losing the report.
          xcrun xccov view --report "$report" && exit 0
          bundle="$(find -H .build/release -maxdepth 3 -name '*.xctest' -type d | head -n 1)"
          xcrun llvm-cov report "$bundle/Contents/MacOS/$(ls "$bundle/Contents/MacOS" | head -n 1)" \
            -instr-profile=.build/release/codecov/default.profdata \
            -ignore-filename-regex='\.build/checkouts|/Tests/'

      - name: Build the app bundle
        run: make app

      - name: Check the bundle
        run: |
          set -euo pipefail
          test -x build/Palette.app/Contents/MacOS/Palette
          lipo -archs build/Palette.app/Contents/MacOS/Palette

  e2e:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Swift version
        id: swift
        run: echo "version=$(swift --version 2>&1 | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
          key: ${{ runner.os }}-build-${{ github.job }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.swift.outputs.version }}-

      # See Scripts/restore-build-timestamps.sh: without this a restored cache
      # still rebuilds everything, because checkout stamps sources with "now".
      - name: Warm the build cache
        run: Scripts/restore-build-timestamps.sh

      - name: End-to-end flows
        run: make e2e
