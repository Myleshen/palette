name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: ${{ runner.os }}-swift-

      - name: Test
        run: swift test --enable-code-coverage

      - name: Report coverage
        continue-on-error: true
        run: |
          set -euo pipefail
          report="$(ls .build/debug/codecov/*.json 2>/dev/null | head -n 1)"
          if [ -z "$report" ]; then
            echo "no coverage report produced"
            exit 0
          fi
          # xccov cannot read SPM's LLVM JSON on every toolchain, so fall back
          # to llvm-cov instead of losing the report.
          xcrun xccov view --report "$report" && exit 0
          bundle="$(find -H .build/debug -maxdepth 2 -name '*.xctest' -type d | head -n 1)"
          xcrun llvm-cov report "$bundle/Contents/MacOS/$(ls "$bundle/Contents/MacOS" | head -n 1)" \
            -instr-profile=.build/debug/codecov/default.profdata \
            -ignore-filename-regex='\.build/checkouts|/Tests/'

      - name: Build the app bundle
        run: make app

      - name: Check the bundle
        run: |
          set -euo pipefail
          test -x build/Palette.app/Contents/MacOS/Palette
          lipo -archs build/Palette.app/Contents/MacOS/Palette

  e2e:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: End-to-end flows
        run: make e2e
